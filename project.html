<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ТехноКрылья России — проект по цифровому обучению детей из детских домов." />
  <title>ТехноКрыльяРоссии</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&family=Russo+One&family=Ruslan+Display&display=swap" rel="stylesheet" />
  <!-- Swiper -->
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    section[id]{ scroll-margin-top: 170px; }
    @media (max-width: 520px){
      section[id]{ scroll-margin-top: 150px; }
    }

    :root{
      --content-max: 1120px;
      --content-pad: 24px;
      --card-bg: rgba(255,255,255,.92);
      --card-brd: rgba(30,80,160,.14);
      --shadow: 0 18px 50px rgba(16,24,40,.10);
      --h1: clamp(28px, 3.2vw, 44px);
      --h2: clamp(18px, 2.0vw, 26px);
      --p:  clamp(15px, 1.05vw, 18px);
      --radius: 26px;
      --dock-sticky-top: calc(10px + env(safe-area-inset-top, 0px));
      --dock-max: 920px;
      --glowBlue: rgba(120,190,255,.18);
      --glowRed: rgba(255,110,95,.14);
    }

    body {
      margin: 0;
      padding-top: 0;
      font-family: 'Rubik', sans-serif;
      color: #1c2430;
      background: linear-gradient(to bottom right, #f4f6fb, #ffffff);
      overflow-x:hidden;
    }

    /* =========================================================
       SWIPER: Кинотеатр + Серии
    ========================================================= */
    .swiper-container{
      position: relative;
      width: 100%;
      height: clamp(260px, 34vw, 520px);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,0.14);
      background: rgba(0,0,0,.04);
    }

    .swiper-slide img{
      width:100%;
      height:100%;
      object-fit: cover;
      transform: scale(1.02);
      transition: transform .9s ease;
    }

    .swiper-container:hover .swiper-slide img{
      transform: scale(1.05);
    }

    .swiper-pagination{
      bottom: 10px !important;
      z-index:4 !important;
    }

    .custom-controls{
      display:flex;
      justify-content:space-between;
      gap: 10px;
      padding: 12px 18px 18px;
      position:relative;
      z-index:2;
    }
    .custom-controls button{
      width:48px; height:48px; border-radius:14px;
      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.24), transparent 62%),
        linear-gradient(180deg, rgba(255,255,255,.96), rgba(240,246,255,.92));
      border:1px solid rgba(30,80,160,.22);
      color:#0f2a63;
      font-size:1.1em; font-weight:bold;
      cursor:pointer;
      transition: transform .3s ease, filter .3s ease, background .3s ease;
      display:flex; align-items:center; justify-content:center;
      box-shadow: 0 14px 26px rgba(0,0,0,.14);
      -webkit-tap-highlight-color: transparent;
    }

    .watch-button {
      background: linear-gradient(45deg, #0039a6, #d52b1e);
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .watch-button:hover {
      transform: scale(1.1);
    }

    /* Слайдер с кнопками */
    .swiper-slide {
      position: relative;
    }

    .swiper-slide img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .watch-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }
  </style>
</head>

<body class="page-project">

  <!-- HERO -->
  <header class="hero">
    <div class="hero-ribbon" aria-hidden="true"></div>

    <div class="wrap hero__inner">
      <div class="hero__grid">
        <div class="brand">
          <h1>Техно<span class="highlight-wings" style="color:#66a3ff;">Крылья</span><span class="highlight-russia" style="color:#ff6a5f;">России</span></h1>
          <p class="hero__lead">
            Мы помогаем детям из детских домов и школ интернатов получить доступ к цифровому образованию и навыкам,
            которые дают реальный шанс на цифровое будущее.
          </p>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap stack">

      <!-- Кинотеатр Слайдер -->
      <section class="card" id="cinema">
        <!-- Верхний слайдер с надписью Кинотеатр -->
        <div class="swiper-container">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <h2 style="text-align: center; color: white;">Кинотеатр</h2>
              <p style="text-align: center; color: white;">Смотрите мультсериалы о цифровой безопасности</p>
            </div>
          </div>
        </div>

        <!-- Слайдер с сериями -->
        <div class="swiper-container">
          <div class="swiper-wrapper">
            <!-- 10 серий с кнопками Смотреть -->
            <div class="swiper-slide">
              <img src="series1.jpg" alt="Серия 1" />
              <button class="watch-button">Смотреть</button>
            </div>
            <div class="swiper-slide">
              <img src="series2.jpg" alt="Серия 2" />
              <button class="watch-button">Смотреть</button>
            </div>
            <div class="swiper-slide">
              <img src="series3.jpg" alt="Серия 3" />
              <button class="watch-button">Смотреть</button>
            </div>
            <div class="swiper-slide">
              <img src="series4.jpg" alt="Серия 4" />
              <button class="watch-button">Смотреть</button>
            </div>
            <div class="swiper-slide">
              <img src="series5.jpg" alt="Серия 5" />
              <button class="watch-button">Смотреть</button>
            </div>
            <div class="swiper-slide">
              <img src="series6.jpg" alt="Серия 6" />
              <button class="watch-button">Смотреть</button>
            </div>
            <div class="swiper-slide">
              <img src="series7.jpg" alt="Серия 7" />
              <button class="watch-button">Смотреть</button>
            </div>
            <div class="swiper-slide">
              <img src="series8.jpg" alt="Серия 8" />
              <button class="watch-button">Смотреть</button>
            </div>
            <div class="swiper-slide">
              <img src="series9.jpg" alt="Серия 9" />
              <button class="watch-button">Смотреть</button>
            </div>
            <div class="swiper-slide">
              <img src="series10.jpg" alt="Серия 10" />
              <button class="watch-button">Смотреть</button>
            </div>
          </div>
          <div class="swiper-pagination"></div>
        </div>
      </section>

    </div>
  </main>

  <footer>
    <div class="footer__inner">
      <div class="footer__card" role="contentinfo" aria-label="Нижний колонтитул">
        <span class="footer__mark" aria-hidden="true"></span>
        <p class="footer__text">
          © 2025 <span class="footer__brand">ТехноКрыльяРоссии</span>
          <span class="footer__dot">•</span>
          Все права защищены
        </p>
      </div>
    </div>
  </footer>

  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
  <script>
    const mySwiper = new Swiper('.swiper-container', {
      loop: true,
      speed: 800,
      autoplay: { delay: 4000, disableOnInteraction: false },
      pagination: { el: '.swiper-pagination', clickable: true }
    });

    document.querySelector('.custom-prev').addEventListener('click', () => mySwiper.slidePrev());
    document.querySelector('.custom-next').addEventListener('click', () => mySwiper.slideNext());
  </script>

</body>
</html>
