<!DOCTYPE html>  
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ТехноКрылья России — проект по цифровому обучению детей из детских домов." />
  <title>ТехноКрыльяРоссии</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&family=Russo+One&family=Ruslan+Display&display=swap" rel="stylesheet" />
  <!-- Swiper -->
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />

  <style>
    /* =========================================================
       GLOBAL BASE
    ========================================================= */
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    section[id]{ scroll-margin-top: 170px; }
    @media (max-width: 520px){
      section[id]{ scroll-margin-top: 150px; }
    }

    :root{
      --content-max: 1120px;
      --content-pad: 24px;

      --card-bg: rgba(255,255,255,.92);
      --card-brd: rgba(30,80,160,.14);
      --shadow: 0 18px 50px rgba(16,24,40,.10);

      --h1: clamp(28px, 3.2vw, 44px);
      --h2: clamp(18px, 2.0vw, 26px);
      --p:  clamp(15px, 1.05vw, 18px);

      --radius: 26px;

      --dock-sticky-top: calc(10px + env(safe-area-inset-top, 0px));
      --dock-max: 920px;

      --glowBlue: rgba(120,190,255,.18);
      --glowRed: rgba(255,110,95,.14);
    }

    body{
      margin: 0;
      padding-top: 0;
      font-family: 'Rubik', sans-serif;
      color: #1c2430;
      background:
        radial-gradient(1200px 720px at 20% 0%, rgba(0,57,166,.10), transparent 60%),
        radial-gradient(900px 560px at 86% 0%, rgba(213,43,30,.08), transparent 55%),
        linear-gradient(to bottom right, #f4f6fb, #ffffff);
      overflow-x:hidden;
    }

    :focus-visible{
      outline: 2px solid rgba(120,190,255,.75);
      outline-offset: 2px;
      border-radius: 12px;
    }

    a{ color:#0039a6; }
    a:hover{ color:#d52b1e; }

    .wrap{
      width: min(var(--content-max), calc(100% - (var(--content-pad) * 2)));
      margin: 0 auto;
    }

    /* =========================================================
       Footer Styling
    ========================================================= */
    footer{
      margin-top: 22px;
      background:#0039a6;
      color:#fff;
      text-align:center;
      padding: 18px;
      border-top: 4px solid #d52b1e;
      font-size: 14px;
      font-family: 'Russo One', sans-serif;
      letter-spacing: 0.05em;
    }

    footer p{
      margin: 0;
      color: rgba(255,255,255,.95);
    }

    footer .footer-content{
      display: inline-block;
      padding: 10px;
      background: rgba(255,255,255,0.12);
      border-radius: 10px;
      backdrop-filter: blur(10px) saturate(1.05);
      -webkit-backdrop-filter: blur(10px) saturate(1.05);
      box-shadow: 0 10px 20px rgba(0,0,0,.12);
    }

    footer .footer-content p{
      margin: 0;
      color: rgba(255,255,255,.75);
    }

    footer .footer-content span{
      font-weight: bold;
      color: #d52b1e;
    }

    footer .social-links{
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 14px;
    }

    footer .social-link{
      width: 40px;
      height: 40px;
      transition: transform .18s ease, filter .18s ease;
    }

    footer .social-link img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    footer .social-link:hover{
      transform: translateY(-2px) scale(1.06);
      filter: brightness(1.12);
    }

  </style>
</head>

<body>
  <!-- HERO -->
  <header class="hero">
    <div class="wrap hero__inner">
      <h1>Техно<span class="highlight-wings" style="color:#66a3ff;">Крылья</span><span class="highlight-russia" style="color:#ff6a5f;">России</span></h1>
    </div>
  </header>

  <main>
    <div class="wrap">
      <p>Content goes here...</p>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <p>&copy; 2025 <span>ТехноКрыльяРоссии</span>. Все права защищены.</p>
    </div>
    <div class="social-links">
      <a href="https://vk.com/digitalhavenrussia" class="social-link" target="_blank" aria-label="ВКонтакте"><img src="vk-embl.webp" alt="VK"></a>
      <a href="https://t.me/DigitalHavenRussia" class="social-link" target="_blank" aria-label="Telegram"><img src="telega-embl.webp" alt="Telegram"></a>
      <a href="https://www.instagram.com/digitalhavenrussia" class="social-link" target="_blank" aria-label="Instagram"><img src="inst-embl.webp" alt="Instagram"></a>
    </div>
  </footer>

  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
  <script>
    const mySwiper = new Swiper('.swiper-container', {
      loop: true,
      speed: 800,
      autoplay: { delay: 4000, disableOnInteraction: false },
      pagination: { el: '.swiper-pagination', clickable: true }
    });
  </script>
</body>
</html>
