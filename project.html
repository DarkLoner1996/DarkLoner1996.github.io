/* 1) Делаем фон шапки “глубже” и добавляем тёмный scrim */
.page-project header.hero{
  /* чуть насыщеннее, чтобы не было “выцветшей” середины */
  background: linear-gradient(90deg,
    #062a78 0%,
    #123a93 42%,
    #b2201f 100%
  ) !important;
  background-size: 220% 100% !important;
}

/* тёмная вуаль поверх флага/градиента — именно для читабельности */
.page-project header.hero::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:
    /* слева сильнее (там заголовок), справа мягче (под stats) */
    linear-gradient(90deg,
      rgba(5, 10, 22, .72) 0%,
      rgba(5, 10, 22, .44) 52%,
      rgba(5, 10, 22, .18) 100%
    );
}

/* оставляем флаг, но чуть приглушаем */
.page-project header.hero::before{
  opacity: .05 !important;
}

/* 2) Убираем “осветляющую” белую вуаль и заменяем на тёмную мягкую */
.page-project .hero__inner::before{
  background:
    radial-gradient(closest-side at 35% 35%, rgba(0,0,0,.55), rgba(0,0,0,0) 72%),
    radial-gradient(closest-side at 55% 55%, rgba(0,57,166,.18), rgba(0,57,166,0) 78%),
    radial-gradient(closest-side at 70% 45%, rgba(213,43,30,.14), rgba(213,43,30,0) 82%) !important;
  filter: blur(18px) !important;
  opacity: .92 !important;
}

/* важно: контент всегда поверх scrim */
.page-project .hero__inner{ position:relative; z-index:1; }
.page-project .hero__grid{ position:relative; z-index:1; }

/* 3) Усиливаем читаемость текста (без “плашки-квадрата”) */
.page-project .brand h1{
  -webkit-text-stroke: 1px rgba(0,0,0,.42) !important;
  text-shadow:
    0 2px 10px rgba(0,0,0,.40),
    0 18px 36px rgba(0,0,0,.30) !important;
}

/* чтобы синие/красные слова тоже не “терялись” */
.page-project .brand h1 .highlight-wings,
.page-project .brand h1 .highlight-russia{
  text-shadow:
    0 2px 10px rgba(0,0,0,.35),
    0 14px 28px rgba(0,0,0,.26);
}

/* лид — чуть светлее и контрастнее */
.page-project .hero__lead{
  color: rgba(255,255,255,.93) !important;
  text-shadow:
    0 2px 12px rgba(0,0,0,.40),
    0 16px 30px rgba(0,0,0,.22) !important;
}

/* 4) Кнопки и “быстрая навигация” — делаем темнее (чтобы читались) */
.page-project .btn--ghost{
  background: rgba(255,255,255,.12) !important;
  border-color: rgba(255,255,255,.22) !important;
  color: rgba(255,255,255,.96) !important;
}

.page-project .jump a{
  background: rgba(0,0,0,.20) !important;
  border-color: rgba(255,255,255,.22) !important;
  color: rgba(255,255,255,.95) !important;
}

/* 5) Stats — сейчас они бледные: делаем “HUD-читабельность” */
.page-project .stat{
  background: rgba(0,0,0,.18) !important;
  border-color: rgba(255,255,255,.20) !important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14),
    0 14px 30px rgba(0,0,0,.18) !important;
}

.page-project .stat b{
  text-shadow: 0 2px 14px rgba(0,0,0,.40) !important;
}

.page-project .stat span{
  opacity: .92 !important;
}
