<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ТехноКрыльяРоссии</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    *{ margin:0; padding:0; box-sizing:border-box; }
    html, body{
      width:100%;
      height:100%;
      overflow-x:hidden;
      font-family:'Ruslan Display', cursive;
      background:#ddeeff;
    }

    /* ============================================================
       HUD MENU — BLUE/STEEL GLASS (в тему плаката)
       Цель: выглядеть как "премиум HUD", но НЕ спорить с фоном.
       ============================================================ */

    :root{
      --nav-left: 18px;
      --nav-top: 14px;
      --panel-w: 340px;

      /* Основная палитра (в тему неба/плаката): сталь + синий */
      --text: rgba(245,250,255,.96);
      --muted: rgba(220,235,255,.72);

      --glassA: rgba(55, 75, 95, .54);
      --glassB: rgba(28, 44, 60, .36);

      --stroke: rgba(255,255,255,.22);
      --stroke2: rgba(255,255,255,.14);
      --shadow: rgba(0,0,0,.34);

      /* Карточки */
      --itemA: rgba(255,255,255,.12);
      --itemB: rgba(255,255,255,.06);
      --itemStroke: rgba(255,255,255,.16);

      /* Акценты: спокойный циан (hover) + тёплое золото (active/cta) */
      --hoverGlow: rgba(120, 200, 255, .16);
      --activeGlow: rgba(255, 215, 140, .22);

      /* Pills */
      --pillBg: rgba(255,255,255,.10);
      --pillStroke: rgba(255,255,255,.18);
      --pillText: rgba(240,246,255,.90);

      --pillActiveBg1: rgba(255, 230, 170, .38);
      --pillActiveBg2: rgba(255, 205, 120, .22);
      --pillActiveText: rgba(255, 250, 238, .98);

      /* CTA */
      --cta1: rgba(255, 236, 176, .98);
      --cta2: rgba(255, 210, 118, .94);
      --ctaText: rgba(60,55,40,.96);

      --radius: 18px;
      --ring: rgba(120,200,255,.28);
    }

    /* Ночной режим — темнее, но всё равно blue/steel */
    .hud--night{
      --glassA: rgba(22, 32, 46, .74);
      --glassB: rgba(10, 16, 26, .52);

      --itemA: rgba(255,255,255,.10);
      --itemB: rgba(255,255,255,.05);
      --muted: rgba(210,230,255,.68);

      --hoverGlow: rgba(120,200,255,.12);
      --activeGlow: rgba(255, 200, 120, .20);

      --stroke: rgba(255,255,255,.20);
      --stroke2: rgba(255,255,255,.12);
      --ring: rgba(120,200,255,.24);
    }

    .side-nav{
      position:fixed;
      left: var(--nav-left);
      top: var(--nav-top);
      z-index:1000;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-start;
      transform: translateZ(0);
    }

    /* ===== TAB (верхняя капсула) ===== */
    .side-nav__tab{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:16px;

      background:
        radial-gradient(120% 120% at 20% 10%, rgba(255,255,255,.20), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.10));

      border:1px solid rgba(255,255,255,.28);
      box-shadow: 0 14px 28px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.22);

      backdrop-filter: blur(12px) saturate(1.1);
      -webkit-backdrop-filter: blur(12px) saturate(1.1);

      user-select:none;
      position:relative;
      overflow:hidden;
    }

    .tab-btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:7px 10px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.20);
      background: rgba(255,255,255,.08);
      color: var(--text);
      cursor:pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
      white-space:nowrap;
      position:relative;
      z-index:1;
    }
    .tab-btn:hover{
      transform: translateY(-1px);
      filter:saturate(1.04);
      box-shadow: 0 10px 20px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.14);
    }
    .tab-btn:focus-visible{
      outline:none;
      box-shadow: 0 0 0 3px var(--ring), inset 0 1px 0 rgba(255,255,255,.12);
    }

    .tab-ico{
      width:26px; height:26px;
      border-radius:10px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.18);
      box-shadow: 0 10px 16px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.16);
      color: var(--text);
      font-size:16px;
      line-height:1;
    }
    .tab-title{
      font-size:15px;
      letter-spacing:.12px;
      opacity:.95;
      white-space:nowrap;
    }

    /* ===== switch ===== */
    .hud-switch{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 8px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      position:relative;
      z-index:1;
    }
    .hud-switch .moon{
      width:18px; height:18px;
      border-radius:8px;
      display:grid;
      place-items:center;
      font-size:13px;
      color: rgba(255,255,255,.90);
      opacity:.90;
    }
    .switch{
      width:40px; height:18px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.10);
      position:relative;
      cursor:pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
      transition: filter .18s ease, transform .12s ease;
    }
    .switch:hover{ filter:saturate(1.04); }
    .switch:active{ transform: scale(.985); }
    .switch::after{
      content:"";
      position:absolute;
      top:2px; left:2px;
      width:14px; height:14px;
      border-radius:50%;
      background: rgba(255,255,255,.86);
      box-shadow: 0 6px 10px rgba(0,0,0,.22);
      transition: left .18s ease, background .18s ease;
    }
    .switch.is-on{ background: rgba(255, 220, 140, .18); }
    .switch.is-on::after{ left:24px; background: rgba(255, 235, 185, .95); }

    /* ===== PANEL ===== */
    .side-nav__panel{
      width: var(--panel-w);
      border-radius: var(--radius);
      padding:12px 12px 14px;

      background:
        radial-gradient(90% 70% at 18% 10%, rgba(255,255,255,.18), transparent 62%),
        linear-gradient(180deg, var(--glassA), var(--glassB));

      border:1px solid var(--stroke);

      box-shadow:
        0 24px 52px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 0 0 1px rgba(255,255,255,.06);

      backdrop-filter: blur(14px) saturate(1.12);
      -webkit-backdrop-filter: blur(14px) saturate(1.12);

      position:relative;
      overflow:hidden;

      transform-origin: top left;
      transition: transform .22s ease, opacity .22s ease, filter .22s ease;
    }

    /* внутренний контур — мягкий */
    .side-nav__panel::before{
      content:"";
      position:absolute;
      inset:10px;
      border-radius: calc(var(--radius) - 10px);
      border:1px solid var(--stroke2);
      pointer-events:none;
      z-index:1;
    }

    /* очень тонкие scanlines + легкий глянец */
    .side-nav__panel::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(80% 60% at 22% 10%, rgba(255,255,255,.12), transparent 65%),
        repeating-linear-gradient(to bottom, transparent 0 12px, rgba(255,255,255,.02) 12px 13px);
      opacity:.75;
      mix-blend-mode: soft-light;
      z-index:0;
    }

    .hud-noise{
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.45;
      background-image:
        radial-gradient(circle at 14% 18%, rgba(255,255,255,.025) 0 1px, transparent 2px),
        radial-gradient(circle at 78% 28%, rgba(255,255,255,.020) 0 1px, transparent 2px),
        radial-gradient(circle at 42% 78%, rgba(255,255,255,.020) 0 1px, transparent 2px),
        radial-gradient(circle at 86% 62%, rgba(255,255,255,.020) 0 1px, transparent 2px);
      filter: blur(.25px);
      z-index:0;
    }

    .side-nav__list{
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:10px;
      margin:6px 0 12px;
      padding:0;
      position:relative;
      z-index:2;
    }

    /* ===== ITEMS ===== */
    .hud-item{
      position:relative;
      display:flex;
      align-items:center;
      gap:12px;

      padding:12px 12px;
      border-radius:16px;

      background:
        radial-gradient(110% 80% at 18% 10%, rgba(255,255,255,.12), transparent 60%),
        linear-gradient(180deg, var(--itemA), var(--itemB));

      border:1px solid var(--itemStroke);

      box-shadow:
        0 10px 18px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.12);

      text-decoration:none;
      color: var(--text);

      overflow:hidden;
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }
    .hud-item:hover{
      transform: translateY(-1px);
      filter:saturate(1.04);
      box-shadow:
        0 16px 28px rgba(0,0,0,.26),
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 0 16px var(--hoverGlow);
    }
    .hud-item:active{ transform: translateY(0px) scale(.995); }

    .hud-item:focus-visible{
      outline:none;
      box-shadow:
        0 0 0 3px var(--ring),
        0 16px 28px rgba(0,0,0,.24),
        inset 0 1px 0 rgba(255,255,255,.12);
    }

    /* ВАЖНО: маркер слева — тонкий и благородный (не кислотный) */
    .hud-item::before{
      content:"";
      position:absolute;
      left:10px; top:10px; bottom:10px;
      width:3px;
      border-radius:999px;
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.05));
      opacity:.85;
    }
    .hud-item.is-active::before{
      background: linear-gradient(180deg, rgba(255,235,190,.78), rgba(255,205,120,.55));
      box-shadow: 0 0 12px rgba(255,220,140,.18);
      opacity:1;
    }

    /* Active — мягкий золотой glow (без “ужасного выделения”) */
    .hud-item.is-active{
      box-shadow:
        0 18px 34px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.14),
        inset 0 0 18px var(--activeGlow);
    }

    /* ===== ICONS (монохром, чтобы не спорить с фоном) ===== */
    .hud-ico{
      width:44px; height:44px;
      border-radius:14px;
      display:grid;
      place-items:center;

      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.16);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.10),
        0 8px 14px rgba(0,0,0,.20);

      flex: 0 0 auto;
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }

    .hud-ico svg{
      width:22px; height:22px;
      stroke: rgba(245,250,255,.92);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.18));
      opacity:.92;
    }

    .hud-item:hover .hud-ico{
      transform: translateY(-1px) scale(1.02);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 10px 18px rgba(0,0,0,.24);
    }

    .hud-txt{
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width:0;
      flex:1 1 auto;
    }

    .hud-title{
      font-size:16px;
      letter-spacing:.18px;
      line-height:1.05;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .hud-sub{
      font-size:12px;
      letter-spacing:.10px;
      color: var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      opacity:.92;
    }

    /* Pills — как в макете (спокойные, но читаемые) */
    .hud-pill{
      flex:0 0 auto;
      padding:6px 12px;
      border-radius:999px;
      border:1px solid var(--pillStroke);
      background: var(--pillBg);
      color: var(--pillText);
      font-size:11px;
      letter-spacing:.18em;
      text-transform:uppercase;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
      margin-left:6px;
      transition: transform .16s ease, filter .16s ease;
    }
    .hud-pill.active{
      background: linear-gradient(180deg, var(--pillActiveBg1), var(--pillActiveBg2));
      color: var(--pillActiveText);
      border-color: rgba(255,255,255,.26);
    }
    .hud-item:hover .hud-pill{ transform: translateY(-1px); filter:saturate(1.03); }

    .hud-chev{
      margin-left:6px;
      color: rgba(255,255,255,.70);
      opacity:.75;
      font-size:18px;
      line-height:1;
      transform: translateY(-1px);
      transition: transform .16s ease, opacity .16s ease;
    }
    .hud-item:hover .hud-chev{ transform: translateY(-1px) translateX(2px); opacity:.95; }

    .side-nav__divider{
      height:1px;
      margin:10px 2px 12px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.20), transparent);
      opacity:.9;
      position:relative;
      z-index:2;
    }

    /* CTA — золотая, как в макете, без лишней “магии” */
    .hud-cta{
      position:relative;
      z-index:2;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      height:54px;
      border-radius:16px;

      background: linear-gradient(180deg, var(--cta1), var(--cta2));
      border:1px solid rgba(255,255,255,.42);
      box-shadow: 0 16px 30px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.55);

      color: var(--ctaText);
      text-decoration:none;
      font-size:16px;
      letter-spacing:.12em;
      text-transform:uppercase;

      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
      text-align:center;
      padding:0 12px;
    }
    .hud-cta:hover{
      transform: translateY(-1px);
      filter:saturate(1.06);
      box-shadow:
        0 18px 34px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.58);
    }
    .hud-cta:active{ transform: translateY(0px) scale(.995); }
    .hud-cta:focus-visible{
      outline:none;
      box-shadow:
        0 0 0 3px rgba(255,220,140,.22),
        0 18px 34px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.58);
    }

    .hud-cta .heart{
      width:28px; height:28px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.55);
      border:1px solid rgba(255,255,255,.40);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.55);
      flex:0 0 auto;
    }
    .hud-cta .heart svg{
      width:16px; height:16px;
      stroke: rgba(70,60,40,.85);
      fill:none;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    /* ===== collapse left ===== */
    .side-nav.is-collapsed .side-nav__panel{
      transform: translateX(calc(-100% - 18px));
      opacity:0;
      pointer-events:none;
      filter: blur(1px);
    }

    @media (max-width: 820px){
      :root{ --nav-left: 10px; --nav-top: 10px; --panel-w: 310px; }
      .tab-title{ display:none; }
    }

    @media (prefers-reduced-motion: reduce){
      .side-nav__panel, .hud-item, .tab-btn, .hud-cta, .switch { transition:none !important; }
    }

    /* ===== HEADER (твой) ===== */
    .header{
      position:relative;
      width:100%;
      height:100vh;
      min-height:100svh;
      min-height:100dvh;
      overflow:hidden;
      background:#ddeeff;
    }
    .header__bg-blur{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      filter: blur(22px) saturate(1.15);
      transform: scale(1.12);
      z-index:0;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }
    .header__bg{
      position:absolute;
      left:50%;
      top:50%;
      width:100vw;
      height:auto;
      max-height:100vh;
      transform:translate(-50%, -50%);
      z-index:1;
      object-fit:unset;
      pointer-events:none;
      user-select:none;
    }
    .header::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.05), rgba(0,0,0,0.18)),
        rgba(255,255,255,0.05);
      z-index:3;
      pointer-events:none;
    }

    .cloud-left{
      position:absolute; top:0%; left:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      animation:flyLeftToRight 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    .cloud-right{
      position:absolute; top:3%; right:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      transform:scaleX(-1);
      animation:flyRightToLeft 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    @keyframes flyLeftToRight{
      0%,10%{ transform:translateX(0); }
      90%,100%{ transform:translateX(calc(100vw + 250px)); }
    }
    @keyframes flyRightToLeft{
      0%,10%{ transform:translateX(0) scaleX(-1); }
      90%,100%{ transform:translateX(calc(-100vw - 250px)) scaleX(-1); }
    }

    .cube-container{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(40, minmax(0, 1fr));
      grid-template-rows:repeat(25, minmax(0, 1fr));
      z-index:2;
      pointer-events:none;
    }
    .cube{
      width:100%;
      height:100%;
      background:url('code.webp') no-repeat center/contain;
      opacity:0;
      animation:cubeReveal 1.5s ease forwards;
    }
    @keyframes cubeReveal{
      0%{ transform:translate(var(--tx),var(--ty)) scale(0.1); opacity:0; }
      50%{ transform:translate(0,0) scale(1); opacity:1; }
      100%{ transform:translate(0,0) scale(1); opacity:0; }
    }

    .grass{
      position:absolute; bottom:0; left:0;
      width:200%; height:50px;
      background:url('grass.gif') repeat-x;
      background-size:contain;
      animation:slowGrass 60s ease-in-out infinite alternate;
      pointer-events:none; z-index:2;
    }
    @keyframes slowGrass{
      from { transform:translateX(0); }
      to   { transform:translateX(-25%); }
    }
  </style>
</head>

<body>

  <!-- HUD MENU (СЛЕВА) -->
  <nav class="side-nav hud--day" aria-label="Навигация">

        </li>

        <li>
          <a class="hud-item" href="https://digitalhavenrussia.ru/project.html">
            <span class="hud-ico" aria-hidden="true">
              <!-- INFO -->
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 10.5v6"></path>
                <path d="M12 7.5h.01"></path>
              </svg>
            </span>
            <span class="hud-txt">
              <span class="hud-title">О проекте</span>
              <span class="hud-sub">брифинг</span>
            </span>
            <span class="hud-pill">INFO</span>
            <span class="hud-chev" aria-hidden="true">›</span>
          </a>
        </li>

        <li>
          <a class="hud-item" href="https://digitalhavenrussia.ru/security.html">
            <span class="hud-ico" aria-hidden="true">
              <!-- VIDEO -->

    <div class="grass"></div>

  <script>
    // cubes (как у тебя)
    const container = document.getElementById('cubes');
    const cols = 40, rows = 25;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cube = document.createElement('div');
        cube.className = 'cube';
        cube.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
        cube.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
        cube.style.gridColumn = x + 1;
        cube.style.gridRow = y + 1;
        cube.style.animationDelay = (Math.random() * 0.8) + 's';
        container.appendChild(cube);
      }
    }

    // Активный пункт по URL
    (function markActive(){
      try{
        const path = location.pathname.replace(/\/+$/, '') || '/';
        const items = document.querySelectorAll('.hud-item');
        items.forEach(a => a.classList.remove('is-active'));

        const rules = [
          { match: ['/', '/index.html'], hrefPart: 'digitalhavenrussia.ru' },
          { match: ['/project.html'], hrefPart: 'project.html' },
          { match: ['/security.html'], hrefPart: 'security.html' },
          { match: ['/map.html'], hrefPart: 'map.html' },
        ];
        const rule = rules.find(r => r.match.includes(path));
        if(!rule) return;

        const active = Array.from(items).find(a => (a.getAttribute('href') || '').includes(rule.hrefPart));
        if(active) active.classList.add('is-active');
      }catch(e){}
    })();

    // Сворачивание ВЛЕВО
    (function toggleMenu(){
      const nav = document.querySelector('.side-nav');
      const btn = document.getElementById('menuToggle');
      const ico = btn?.querySelector('.tab-ico');
      if(!nav || !btn || !ico) return;

      btn.addEventListener('click', () => {
        const collapsed = nav.classList.toggle('is-collapsed');
        btn.setAttribute('aria-expanded', String(!collapsed));
        btn.title = collapsed ? 'Развернуть меню' : 'Свернуть меню';
        ico.textContent = collapsed ? '≡' : '⟨';
      });
    })();

    // Ночной HUD (тумблер)
    (function nightHud(){
      const nav = document.querySelector('.side-nav');
      const sw = document.getElementById('nightSwitch');
      if(!nav || !sw) return;

      const setState = (on) => {
        sw.classList.toggle('is-on', on);
        sw.setAttribute('aria-checked', String(on));
        nav.classList.toggle('hud--night', on);
      };

      const toggle = () => setState(!(sw.getAttribute('aria-checked') === 'true'));

      sw.addEventListener('click', toggle);
      sw.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });

      setState(false);
    })();
  </script>
