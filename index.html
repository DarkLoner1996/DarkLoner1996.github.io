<!DOCTYPE html>  
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ТехноКрыльяРоссии</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%;
      height:100%;
      overflow-x:hidden;
      font-family:'Ruslan Display', cursive;
      background:#ddeeff;
    }

    /* ===== NAV CAPSULE (обновлено по правкам UX/UI) =====
       Что добавил:
       1) Меньше "пластика": приглушил блики/тени, сделал капсулу легче.
       2) Активный пункт: явно выделен + маленький маркер-точка.
       3) Чуть больше воздуха сверху (top: 22px).
       4) Фокус по клавиатуре (:focus-visible) для доступности.
       5) Меньше анимаций для тех, у кого reduced motion.
    */

    :root{
      /* капсула */
      --cap-bg1: rgba(255,255,255,.16);
      --cap-bg2: rgba(255,255,255,.08);
      --cap-border: rgba(255,255,255,.26);
      --cap-shadow: rgba(0,0,0,.18);

      /* кнопки */
      --btn-blue1:#2f77ff;
      --btn-blue2:#1f4fd8;
      --btn-border: rgba(255,255,255,.26);

      --gold1:#ffe2a6;
      --gold2:#ffd27d;

      --text:#ffffff;
    }

    .nav-capsule{
      position:fixed;
      top:22px; /* было 12px — добавил воздуха */
      left:50%;
      transform:translateX(-50%);
      z-index:1000;
      width:min(980px, calc(100% - 24px));
    }

    /* Стеклянная “длинная капсула” под меню */
    .nav-capsule__inner{
      position:relative;
      padding:10px 12px;
      border-radius:22px;

      background: linear-gradient(180deg, var(--cap-bg1), var(--cap-bg2));
      border:1px solid var(--cap-border);

      /* облегчил тень/внутренний блик */
      box-shadow:
        0 14px 28px var(--cap-shadow),
        inset 0 1px 0 rgba(255,255,255,.22);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow:hidden;
    }

    /* Блик сверху на капсуле (сделал мягче) */
    .nav-capsule__inner::before{
      content:"";
      position:absolute;
      left:18px;
      right:18px;
      top:7px;
      height:14px;
      border-radius:999px;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.42), transparent);
      opacity:.45;
      pointer-events:none;
    }

    /* тонкая “золотая искра” снизу (чуть тише) */
    .nav-capsule__inner::after{
      content:"";
      position:absolute;
      left:22px;
      right:22px;
      bottom:8px;
      height:2px;
      border-radius:999px;
      background:linear-gradient(90deg, transparent, rgba(255,210,125,.7), transparent);
      opacity:.38;
      pointer-events:none;
    }

    /* список кнопок */
    .nav-capsule__list{
      list-style:none;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin:0;
      padding:0;
      flex-wrap:wrap;
    }

    /* Кнопки */
    .nav-capsule__list a{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;

      padding:10px 16px;
      border-radius:16px;
      text-decoration:none;

      font-size:18px;
      letter-spacing:.3px;

      color:var(--text);
      background: linear-gradient(180deg, var(--btn-blue1), var(--btn-blue2));
      border:1px solid var(--btn-border);

      /* уменьшил "пластиковость": слабее тени и внутренние затемнения */
      box-shadow:
        0 10px 18px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.28);

      text-shadow: 0 2px 10px rgba(0,0,0,.28);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      will-change: transform;
    }

    /* верхний блик на каждой кнопке (мягче и ниже по силе) */
    .nav-capsule__list a::before{
      content:"";
      position:absolute;
      left:10px;
      right:10px;
      top:7px;
      height:10px;
      border-radius:999px;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.40), transparent);
      opacity:.35;
      pointer-events:none;
    }

    /* золотистая грань снизу кнопки (появляется на hover/active/active-item) */
    .nav-capsule__list a::after{
      content:"";
      position:absolute;
      left:12px;
      right:12px;
      bottom:6px;
      height:2px;
      border-radius:999px;
      background:linear-gradient(90deg, transparent, var(--gold2), transparent);
      opacity:0;
      transform: translateY(2px);
      transition: opacity .18s ease, transform .18s ease;
      pointer-events:none;
    }

    .nav-capsule__list a:hover{
      transform: translateY(-1px) scale(1.03);
      box-shadow:
        0 16px 30px rgba(0,0,0,.26),
        0 0 0 2px rgba(255,210,125,.16),
        inset 0 1px 0 rgba(255,255,255,.34);
      filter:saturate(1.06);
    }
    .nav-capsule__list a:hover::after{
      opacity:1;
      transform: translateY(0);
    }

    .nav-capsule__list a:active{
      transform: translateY(0) scale(1.02);
    }

    /* ===== Активная кнопка (явно + маркер) ===== */
    .nav-capsule__list a.is-active{
      box-shadow:
        0 18px 34px rgba(0,0,0,.28),
        0 0 0 2px rgba(255,210,125,.26),
        inset 0 1px 0 rgba(255,255,255,.36);
      filter:saturate(1.08);
    }
    .nav-capsule__list a.is-active::after{
      opacity:1;
      transform: translateY(0);
    }
    /* маркер-точка слева (понятно "вы тут") */
    .nav-capsule__list a.is-active span{
      position:relative;
      padding-left:12px;
    }
    .nav-capsule__list a.is-active span::before{
      content:"";
      position:absolute;
      left:0;
      top:50%;
      width:7px;
      height:7px;
      border-radius:50%;
      background: radial-gradient(circle, rgba(255,210,125,1), rgba(255,210,125,.55));
      transform: translateY(-50%);
      box-shadow: 0 0 10px rgba(255,210,125,.35);
    }

    /* Фокус с клавиатуры */
    .nav-capsule__list a:focus-visible{
      outline: none;
      box-shadow:
        0 16px 30px rgba(0,0,0,.26),
        0 0 0 3px rgba(255,210,125,.34),
        inset 0 1px 0 rgba(255,255,255,.34);
    }

    /* Мобилка */
    @media (max-width:768px){
      .nav-capsule{ top:14px; }
      .nav-capsule__inner{ padding:8px 10px; border-radius:18px; }
      .nav-capsule__list{ gap:8px; }
      .nav-capsule__list a{
        font-size:15px;
        padding:9px 12px;
        border-radius:14px;
      }
    }

    /* Меньше анимаций, если пользователь просит */
    @media (prefers-reduced-motion: reduce){
      .nav-capsule__list a{ transition:none; }
      .cloud-left, .cloud-right, .grass, .cube{ animation:none !important; }
    }

    /* ===== HEADER ===== */
    .header{
      position:relative;
      width:100%;
      height:100vh;
      min-height:100svh;
      min-height:100dvh;
      overflow:hidden;
      background:#ddeeff;
    }

    .header__bg-blur{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      filter: blur(22px) saturate(1.15);
      transform: scale(1.12);
      z-index:0;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .header__bg{
      position:absolute;
      left:50%;
      top:50%;
      width:100vw;
      height:auto;
      max-height:100vh;
      transform:translate(-50%, -50%);
      z-index:1;
      object-fit:unset;
      pointer-events:none;
      user-select:none;
    }

    .header::after {
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.05), rgba(0,0,0,0.18)),
        rgba(255,255,255,0.05);
      z-index:3;
      pointer-events:none;
    }

    /* ===== Clouds ===== */
    .cloud-left {
      position:absolute; top:0%; left:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      animation:flyLeftToRight 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    .cloud-right {
      position:absolute; top:3%; right:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      transform:scaleX(-1);
      animation:flyRightToLeft 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    @keyframes flyLeftToRight {
      0%,10%   { transform:translateX(0); }
      90%,100% { transform:translateX(calc(100vw + 250px)); }
    }
    @keyframes flyRightToLeft {
      0%,10%   { transform:translateX(0) scaleX(-1); }
      90%,100% { transform:translateX(calc(-100vw - 250px)) scaleX(-1); }
    }

    /* ===== Cubes ===== */
    .cube-container{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(40, minmax(0, 1fr));
      grid-template-rows:repeat(25, minmax(0, 1fr));
      z-index:2;
      pointer-events:none;
    }
    .cube{
      width:100%;
      height:100%;
      background:url('code.webp') no-repeat center/contain;
      opacity:0;
      animation:cubeReveal 1.5s ease forwards;
    }
    @keyframes cubeReveal {
      0%   { transform:translate(var(--tx),var(--ty)) scale(0.1); opacity:0; }
      50%  { transform:translate(0,0) scale(1); opacity:1; }
      100% { transform:translate(0,0) scale(1); opacity:0; }
    }

    /* ===== Grass ===== */
    .grass {
      position:absolute; bottom:0; left:0;
      width:200%; height:50px;
      background:url('grass.gif') repeat-x;
      background-size:contain;
      animation:slowGrass 60s ease-in-out infinite alternate;
      pointer-events:none; z-index:2;
    }
    @keyframes slowGrass {
      from { transform:translateX(0); }
      to   { transform:translateX(-25%); }
    }
  </style>
</head>

<body>
<nav class="nav-capsule">
  <div class="nav-capsule__inner">
    <ul class="nav-capsule__list">
      <li><a href="https://digitalhavenrussia.ru" class="is-active"><span>Главная</span></a></li>
      <li><a href="https://digitalhavenrussia.ru/project.html">О проекте</a></li>
      <li><a href="https://digitalhavenrussia.ru/security.html">Мультик</a></li>
      <li><a href="https://digitalhavenrussia.ru/map.html">Маршрут помощи</a></li>
    </ul>
  </div>
</nav>

  <div class="header">
    <img class="header__bg-blur" src="header-bg-3840.jpg" alt="" aria-hidden="true" decoding="async">
    <img class="header__bg" src="header-bg-3840.jpg" alt="" loading="eager" decoding="async">

    <div class="cloud-left"></div>
    <div class="cloud-right"></div>

    <div class="cube-container" id="cubes"></div>
    <div class="grass"></div>
  </div>

  <script>
    const container = document.getElementById('cubes');
    const cols = 40, rows = 25;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cube = document.createElement('div');
        cube.className = 'cube';
        cube.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
        cube.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
        cube.style.gridColumn = x + 1;
        cube.style.gridRow = y + 1;
        cube.style.animationDelay = (Math.random() * 0.8) + 's';
        container.appendChild(cube);
      }
    }
  </script>
</body>
</html>
