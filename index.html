<!DOCTYPE html> 
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ТехноКрыльяРоссии</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%;
      height:100%;
      overflow-x:hidden;
      font-family:'Ruslan Display', cursive;
      background:#ddeeff;
    }

    /* ===== NAV CAPSULE (как на макете) ===== */
:root{
  --cap-glass: rgba(255,255,255,.14);
  --cap-border: rgba(255,255,255,.30);
  --cap-shadow: rgba(0,0,0,.25);

  --btn-blue1:#2f77ff;
  --btn-blue2:#1f4fd8;
  --btn-border: rgba(255,255,255,.40);

  --gold1:#ffe2a6;
  --gold2:#ffd27d;

  --text:#ffffff;
  --text-dark:#0b1f4d;
}

.nav-capsule{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:1000;
  width:min(980px, calc(100% - 24px));
}

/* Стеклянная “длинная капсула” под меню */
.nav-capsule__inner{
  position:relative;
  padding:10px 12px;
  border-radius:22px;

  background:
    linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.08));
  border:1px solid var(--cap-border);

  box-shadow:
    0 18px 40px var(--cap-shadow),
    inset 0 1px 0 rgba(255,255,255,.35);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  overflow:hidden;
}

/* Блик сверху на капсуле */
.nav-capsule__inner::before{
  content:"";
  position:absolute;
  left:16px;
  right:16px;
  top:6px;
  height:18px;
  border-radius:999px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  opacity:.65;
  pointer-events:none;
}

/* тонкая “золотая искра” снизу */
.nav-capsule__inner::after{
  content:"";
  position:absolute;
  left:22px;
  right:22px;
  bottom:8px;
  height:2px;
  border-radius:999px;
  background:linear-gradient(90deg, transparent, rgba(255,210,125,.8), transparent);
  opacity:.55;
  pointer-events:none;
}

/* список кнопок */
.nav-capsule__list{
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin:0;
  padding:0;
  flex-wrap:wrap;
}

/* Кнопки как на картинке: объём, градиент, внутренняя подсветка */
.nav-capsule__list a{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:10px 16px;
  border-radius:16px;
  text-decoration:none;

  font-size:18px;
  letter-spacing:.3px;

  color:var(--text);
  background:
    linear-gradient(180deg, var(--btn-blue1), var(--btn-blue2));
  border:1px solid rgba(255,255,255,.28);

  box-shadow:
    0 10px 20px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.45),
    inset 0 -10px 18px rgba(0,0,0,.15);

  text-shadow: 0 2px 10px rgba(0,0,0,.35);
  transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
  will-change: transform;
}

/* верхний блик на каждой кнопке */
.nav-capsule__list a::before{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  top:6px;
  height:12px;
  border-radius:999px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  opacity:.55;
  pointer-events:none;
}

/* золотистая грань снизу кнопки */
.nav-capsule__list a::after{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  bottom:6px;
  height:2px;
  border-radius:999px;
  background:linear-gradient(90deg, transparent, var(--gold2), transparent);
  opacity:.0;
  transform: translateY(2px);
  transition: opacity .18s ease, transform .18s ease;
  pointer-events:none;
}

.nav-capsule__list a:hover{
  transform: translateY(-1px) scale(1.04);
  box-shadow:
    0 16px 34px rgba(0,0,0,.30),
    0 0 0 2px rgba(255,210,125,.18),
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -10px 18px rgba(0,0,0,.18);
  filter:saturate(1.08);
}

.nav-capsule__list a:hover::after{
  opacity:1;
  transform: translateY(0);
}

.nav-capsule__list a:active{
  transform: translateY(0) scale(1.02);
}

/* Активная кнопка */
.nav-capsule__list a.is-active{
  box-shadow:
    0 16px 34px rgba(0,0,0,.30),
    0 0 0 2px rgba(255,210,125,.24),
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -10px 18px rgba(0,0,0,.18);
}
.nav-capsule__list a.is-active::after{
  opacity:1;
  transform: translateY(0);
}

/* Мобилка */
@media (max-width:768px){
  .nav-capsule{ top:10px; }
  .nav-capsule__inner{ padding:8px 10px; border-radius:18px; }
  .nav-capsule__list{ gap:8px; }
  .nav-capsule__list a{
    font-size:15px;
    padding:9px 12px;
    border-radius:14px;
  }
}


    /* ===== HEADER =====
       Цель: экран заполнен, НО основной постер без зума.
       1) blur слой (cover) — заполняет экран
       2) основной постер (contain) — всегда целиком, без приближения
    */
    .header{
      position:relative;
      width:100%;
      height:100vh;
      min-height:100svh;
      min-height:100dvh;
      overflow:hidden;
      background:#ddeeff;
    }

    /* Подложка: заполняет экран */
    .header__bg-blur{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      filter: blur(22px) saturate(1.15);
      transform: scale(1.12);
      z-index:0;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    /* Основной постер: БЕЗ ЗУМА (всегда целиком) */
    .header__bg{
      position:absolute;
      left:50%;
      top:50%;
      width:100vw;
      height:auto;
      max-height:100vh;
      transform:translate(-50%, -50%);
      z-index:1;
      object-fit:unset;
      pointer-events:none;
      user-select:none;
    }

    /* Лёгкая вуаль + чуть затемняем края */
    .header::after {
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.05), rgba(0,0,0,0.18)),
        rgba(255,255,255,0.05);
      z-index:3;
      pointer-events:none;
    }

    /* ===== Clouds ===== */
    .cloud-left {
      position:absolute; top:0%; left:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      animation:flyLeftToRight 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    .cloud-right {
      position:absolute; top:3%; right:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      transform:scaleX(-1);
      animation:flyRightToLeft 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    @keyframes flyLeftToRight {
      0%,10%   { transform:translateX(0); }
      90%,100% { transform:translateX(calc(100vw + 250px)); }
    }
    @keyframes flyRightToLeft {
      0%,10%   { transform:translateX(0) scaleX(-1); }
      90%,100% { transform:translateX(calc(-100vw - 250px)) scaleX(-1); }
    }

    /* ===== Cubes ===== */
    .cube-container{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(40, minmax(0, 1fr));
      grid-template-rows:repeat(25, minmax(0, 1fr));
      z-index:2;
      pointer-events:none;
    }
    .cube{
      width:100%;
      height:100%;
      background:url('code.webp') no-repeat center/contain;
      opacity:0;
      animation:cubeReveal 1.5s ease forwards;
    }
    @keyframes cubeReveal {
      0%   { transform:translate(var(--tx),var(--ty)) scale(0.1); opacity:0; }
      50%  { transform:translate(0,0) scale(1); opacity:1; }
      100% { transform:translate(0,0) scale(1); opacity:0; }
    }

    /* ===== Grass ===== */
    .grass {
      position:absolute; bottom:0; left:0;
      width:200%; height:50px;
      background:url('grass.gif') repeat-x;
      background-size:contain;
      animation:slowGrass 60s ease-in-out infinite alternate;
      pointer-events:none; z-index:2;
    }
    @keyframes slowGrass {
      from { transform:translateX(0); }
      to   { transform:translateX(-25%); }
    }
  </style>
</head>

<body>
<nav class="nav-capsule">
  <div class="nav-capsule__inner">
    <ul class="nav-capsule__list">
      <li><a href="https://digitalhavenrussia.ru" class="is-active">Главная</a></li>
      <li><a href="https://digitalhavenrussia.ru/project.html">О проекте</a></li>
      <li><a href="https://digitalhavenrussia.ru/security.html">Мультик</a></li>
      <li><a href="https://digitalhavenrussia.ru/map.html">Маршрут помощи</a></li>
    </ul>
  </div>
</nav>


  <div class="header">
    <!-- Подложка (заполняет экран) -->
    <img class="header__bg-blur" src="header-bg-3840.jpg" alt="" aria-hidden="true" decoding="async">

    <!-- Основной постер (всегда целиком, БЕЗ зума) -->
    <img class="header__bg" src="header-bg-3840.jpg" alt="" loading="eager" decoding="async">

    <div class="cloud-left"></div>
    <div class="cloud-right"></div>

    <div class="cube-container" id="cubes"></div>
    <div class="grass"></div>
  </div>

  <script>
    const container = document.getElementById('cubes');
    const cols = 40, rows = 25;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cube = document.createElement('div');
        cube.className = 'cube';
        cube.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
        cube.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
        cube.style.gridColumn = x + 1;
        cube.style.gridRow = y + 1;
        cube.style.animationDelay = (Math.random() * 0.8) + 's';
        container.appendChild(cube);
      }
    }
  </script>
</body>
</html>
