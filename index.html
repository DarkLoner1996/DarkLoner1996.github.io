<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ТехноКрыльяРоссии</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body{
      width:100%;
      height:100%;
      overflow-x:hidden;
      font-family:'Ruslan Display', cursive;
      background:#ddeeff;
    }

    /* ============================================================
       MISSION HUD MENU (как на визуализации) — справа сверху
       ✅ HUD-рамка + углы + микро-свет
       ✅ карточки “миссий” (title + sub)
       ✅ CTA как “легендарная кнопка”
       ✅ сворачивание ВПРАВО (панель уезжает за край), TAB остаётся
       ============================================================ */

    :root{
      --nav-right: 18px;
      --nav-top: 14px;

      --hud-outer1: rgba(65, 170, 255, .55);
      --hud-outer2: rgba(255, 210, 125, .45);

      --panel-bg: rgba(14, 28, 58, .55);
      --panel-bg2: rgba(10, 22, 46, .35);

      --glass1: rgba(255,255,255,.18);
      --glass2: rgba(255,255,255,.08);

      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);

      --blueGlow: rgba(110, 200, 255, .55);
      --goldGlow: rgba(255, 210, 125, .75);

      --tile1: rgba(255,255,255,.12);
      --tile2: rgba(255,255,255,.06);

      --cta1: rgba(255, 225, 140, .98);
      --cta2: rgba(255, 198, 86, .92);

      --ring: rgba(120,195,255,.35);

      --radius: 18px;
      --panel-w: 270px;
    }

    .side-nav{
      position:fixed;
      right: var(--nav-right);
      top: var(--nav-top);
      z-index:1000;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-end;
    }

    /* TAB */
    .side-nav__toggle{
      position:relative;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:16px;
      cursor:pointer;
      user-select:none;
      white-space:nowrap;

      color: rgba(255,255,255,.92);

      background:
        linear-gradient(180deg, rgba(18,35,72,.70), rgba(10,22,46,.55)) padding-box,
        linear-gradient(180deg, rgba(65,170,255,.65), rgba(255,210,125,.55)) border-box;
      border:1px solid transparent;

      box-shadow:
        0 16px 34px rgba(0,0,0,.22),
        0 0 22px rgba(110,200,255,.18),
        inset 0 1px 0 rgba(255,255,255,.18);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      overflow:hidden;
    }

    /* scan-line по TAB */
    .side-nav__toggle::after{
      content:"";
      position:absolute;
      left:-60%;
      top:-50%;
      width:60%;
      height:220%;
      transform: rotate(22deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
      opacity:.55;
      animation: tabSweep 3.8s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes tabSweep{
      0%{ transform: translateX(-20%) rotate(22deg); opacity:0; }
      18%{ opacity:.55; }
      60%{ opacity:.18; }
      100%{ transform: translateX(220%) rotate(22deg); opacity:0; }
    }

    .side-nav__toggle:hover{
      transform: translateY(-1px);
      box-shadow:
        0 20px 40px rgba(0,0,0,.26),
        0 0 0 2px rgba(110,200,255,.14),
        0 0 26px rgba(255,210,125,.10),
        inset 0 1px 0 rgba(255,255,255,.22);
      filter:saturate(1.03);
    }
    .side-nav__toggle:focus-visible{
      outline:none;
      box-shadow:
        0 0 0 3px var(--ring),
        0 20px 40px rgba(0,0,0,.26),
        inset 0 1px 0 rgba(255,255,255,.22);
    }

    .toggle-ico{
      width:28px; height:28px;
      border-radius:10px;
      display:grid; place-items:center;
      background: rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:
        0 12px 20px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.18);
      font-size:16px;
      line-height:1;
      position:relative;
    }

    /* маленькая “лампа” */
    .toggle-ico::after{
      content:"";
      position:absolute;
      right:-4px;
      top:-4px;
      width:10px;
      height:10px;
      border-radius:50%;
      background: radial-gradient(circle, rgba(255,236,170,1), rgba(255,210,125,.25));
      box-shadow: 0 0 14px rgba(255,210,125,.45);
      opacity:.95;
    }

    .toggle-text{ font-size:15px; letter-spacing:.15px; opacity:.95; }

    /* PANEL */
    .side-nav__panel{
      position:relative;
      width: var(--panel-w);
      border-radius: var(--radius);
      padding:12px;

      background:
        linear-gradient(180deg, rgba(16,32,66,.72), rgba(10,22,46,.55)) padding-box,
        linear-gradient(180deg, rgba(65,170,255,.65), rgba(255,210,125,.55)) border-box;
      border:1px solid transparent;

      box-shadow:
        0 26px 60px rgba(0,0,0,.32),
        0 0 26px rgba(110,200,255,.14),
        0 0 22px rgba(255,210,125,.10),
        inset 0 1px 0 rgba(255,255,255,.18);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      overflow:hidden;

      transform-origin: top right;
      transition: transform .22s ease, opacity .22s ease, filter .22s ease;
    }

    /* внутренняя стеклянная подложка */
    .side-nav__panel::before{
      content:"";
      position:absolute;
      inset:10px;
      border-radius: calc(var(--radius) - 10px);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.10);
      pointer-events:none;
      opacity:.85;
    }

    /* HUD-углы */
    .corner{
      position:absolute;
      width:14px; height:14px;
      border:2px solid rgba(255,255,255,.42);
      opacity:.70;
      pointer-events:none;
      filter: drop-shadow(0 2px 8px rgba(110,200,255,.10));
      z-index:2;
    }
    .c-tr{ top:10px; right:10px; border-left:none; border-bottom:none; border-top-right-radius:8px; }
    .c-tl{ top:10px; left:10px; border-right:none; border-bottom:none; border-top-left-radius:8px; }
    .c-br{ bottom:10px; right:10px; border-left:none; border-top:none; border-bottom-right-radius:8px; }
    .c-bl{ bottom:10px; left:10px; border-right:none; border-top:none; border-bottom-left-radius:8px; }

    /* пиксельные искры */
    .hud-sparks{
      position:absolute;
      inset:-30px;
      pointer-events:none;
      opacity:.30;
      background:
        radial-gradient(circle at 18% 20%, rgba(255,255,255,.9) 0 1.6px, transparent 3px),
        radial-gradient(circle at 72% 28%, rgba(110,200,255,.9) 0 1.6px, transparent 3px),
        radial-gradient(circle at 86% 62%, rgba(255,210,125,.95) 0 1.8px, transparent 3px),
        radial-gradient(circle at 26% 74%, rgba(255,255,255,.85) 0 1.3px, transparent 2.8px);
      animation: sparksFloat 6s ease-in-out infinite;
      filter: blur(.2px);
      z-index:1;
    }
    @keyframes sparksFloat{
      0%,100%{ transform: translateY(0); opacity:.22; }
      50%{ transform: translateY(7px); opacity:.35; }
    }

    .side-nav__list{
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:10px;
      margin:0;
      padding:0;
      position:relative;
      z-index:3;
    }

    /* карточка миссии */
    .side-nav__link{
      position:relative;
      display:flex;
      align-items:center;
      gap:12px;

      padding:12px 12px;
      border-radius:14px;
      text-decoration:none;
      color: var(--text);

      background:
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06)) padding-box,
        linear-gradient(180deg, rgba(110,200,255,.26), rgba(255,210,125,.18)) border-box;
      border:1px solid transparent;

      box-shadow:
        0 14px 26px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.12);

      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease, background .18s ease;
      overflow:hidden;
    }

    /* scan по карточке */
    .side-nav__link::after{
      content:"";
      position:absolute;
      left:-65%;
      top:-55%;
      width:60%;
      height:240%;
      transform: rotate(22deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.40), transparent);
      opacity:0;
      pointer-events:none;
    }

    .side-nav__link:hover{
      transform: translateY(-1px);
      box-shadow:
        0 18px 34px rgba(0,0,0,.26),
        0 0 0 2px rgba(110,200,255,.12),
        inset 0 1px 0 rgba(255,255,255,.14);
      filter:saturate(1.04);
    }
    .side-nav__link:hover::after{
      opacity:.55;
      animation: itemSweep 1.1s ease-out 1;
    }
    @keyframes itemSweep{
      from{ transform: translateX(-10%) rotate(22deg); }
      to{ transform: translateX(240%) rotate(22deg); }
    }

    .side-nav__link:focus-visible{
      outline:none;
      box-shadow:
        0 0 0 3px var(--ring),
        0 18px 34px rgba(0,0,0,.26),
        inset 0 1px 0 rgba(255,255,255,.14);
    }

    /* левый “индикатор миссии” */
    .side-nav__link::before{
      content:"";
      position:absolute;
      left:10px;
      top:10px;
      bottom:10px;
      width:3px;
      border-radius:999px;
      background: rgba(110,200,255,.25);
      opacity:.85;
    }

    /* иконка-слот */
    .ico{
      width:44px; height:44px;
      border-radius:14px;
      display:grid;
      place-items:center;
      flex: 0 0 auto;

      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), rgba(255,255,255,.08) 55%, rgba(255,255,255,.04)),
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.14);

      box-shadow:
        0 12px 22px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.14);

      font-size:20px;
      line-height:1;
    }

    .txt{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }
    .title{
      font-size:16px;
      letter-spacing:.3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .sub{
      font-size:12px;
      letter-spacing:.15px;
      color: rgba(255,255,255,.70);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* ACTIVE: как “миссия активна” */
    .side-nav__link.is-active{
      box-shadow:
        0 22px 40px rgba(0,0,0,.30),
        0 0 0 2px rgba(255,210,125,.14),
        0 0 22px rgba(255,210,125,.10),
        inset 0 1px 0 rgba(255,255,255,.16);
    }
    .side-nav__link.is-active::before{
      background: linear-gradient(180deg, rgba(110,200,255,.85), rgba(255,210,125,.85));
      box-shadow: 0 0 14px rgba(110,200,255,.18);
      opacity:.95;
    }
    .side-nav__link.is-active .sub{
      color: rgba(255,236,170,.88);
    }

    .divider{
      height:1px;
      margin:12px 4px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.20), transparent);
      opacity:.95;
      position:relative;
      z-index:3;
    }

    /* CTA “легендарная кнопка” */
    .side-nav__cta{
      position:relative;
      z-index:3;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      padding:14px 12px;
      border-radius:14px;
      text-decoration:none;
      color: rgba(40,40,40,.98);

      background:
        linear-gradient(180deg, var(--cta1), var(--cta2)) padding-box,
        linear-gradient(180deg, rgba(255,255,255,.70), rgba(255,210,125,.60)) border-box;
      border:1px solid transparent;

      box-shadow:
        0 20px 44px rgba(0,0,0,.28),
        0 0 24px rgba(255,210,125,.18),
        inset 0 1px 0 rgba(255,255,255,.70);

      font-size:16px;
      letter-spacing:.2px;
      text-transform: uppercase;
      overflow:hidden;
    }

    .side-nav__cta::after{
      content:"";
      position:absolute;
      left:-60%;
      top:-55%;
      width:60%;
      height:240%;
      transform: rotate(22deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
      opacity:.35;
      animation: ctaSweep 3.4s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes ctaSweep{
      0%,100%{ transform: translateX(-30%) rotate(22deg); opacity:.18; }
      50%{ transform: translateX(170%) rotate(22deg); opacity:.45; }
    }

    .side-nav__cta:hover{
      transform: translateY(-1px);
      box-shadow:
        0 26px 56px rgba(0,0,0,.30),
        0 0 0 2px rgba(255,210,125,.18),
        0 0 26px rgba(255,210,125,.20),
        inset 0 1px 0 rgba(255,255,255,.75);
      filter:saturate(1.03);
    }
    .side-nav__cta:focus-visible{
      outline:none;
      box-shadow:
        0 0 0 3px var(--ring),
        0 26px 56px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.75);
    }

    /* ===== Сворачивание ВПРАВО ===== */
    .side-nav.is-collapsed .side-nav__panel{
      transform: translateX(calc(100% + 18px));
      opacity: 0;
      pointer-events:none;
      filter: blur(1px);
    }

    /* мобилка: компактнее */
    @media (max-width: 820px){
      :root{
        --nav-right: 12px;
        --nav-top: 12px;
        --panel-w: 240px;
      }
      .toggle-text{ display:none; }
      .title{ font-size:15px; }
      .sub{ font-size:11px; }
    }

    @media (prefers-reduced-motion: reduce){
      .side-nav__panel,
      .side-nav__link,
      .side-nav__cta,
      .side-nav__toggle,
      .hud-sparks{ transition:none; animation:none; }
      .cloud-left, .cloud-right, .grass, .cube{ animation:none !important; }
    }

    /* ===== HEADER (твой) ===== */
    .header{
      position:relative;
      width:100%;
      height:100vh;
      min-height:100svh;
      min-height:100dvh;
      overflow:hidden;
      background:#ddeeff;
    }

    .header__bg-blur{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      filter: blur(22px) saturate(1.15);
      transform: scale(1.12);
      z-index:0;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .header__bg{
      position:absolute;
      left:50%;
      top:50%;
      width:100vw;
      height:auto;
      max-height:100vh;
      transform:translate(-50%, -50%);
      z-index:1;
      object-fit:unset;
      pointer-events:none;
      user-select:none;
    }

    .header::after {
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.05), rgba(0,0,0,0.18)),
        rgba(255,255,255,0.05);
      z-index:3;
      pointer-events:none;
    }

    /* ===== Clouds ===== */
    .cloud-left {
      position:absolute; top:0%; left:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      animation:flyLeftToRight 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    .cloud-right {
      position:absolute; top:3%; right:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      transform:scaleX(-1);
      animation:flyRightToLeft 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    @keyframes flyLeftToRight {
      0%,10%   { transform:translateX(0); }
      90%,100% { transform:translateX(calc(100vw + 250px)); }
    }
    @keyframes flyRightToLeft {
      0%,10%   { transform:translateX(0) scaleX(-1); }
      90%,100% { transform:translateX(calc(-100vw - 250px)) scaleX(-1); }
    }

    /* ===== Cubes ===== */
    .cube-container{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(40, minmax(0, 1fr));
      grid-template-rows:repeat(25, minmax(0, 1fr));
      z-index:2;
      pointer-events:none;
    }
    .cube{
      width:100%;
      height:100%;
      background:url('code.webp') no-repeat center/contain;
      opacity:0;
      animation:cubeReveal 1.5s ease forwards;
    }
    @keyframes cubeReveal {
      0%   { transform:translate(var(--tx),var(--ty)) scale(0.1); opacity:0; }
      50%  { transform:translate(0,0) scale(1); opacity:1; }
      100% { transform:translate(0,0) scale(1); opacity:0; }
    }

    /* ===== Grass ===== */
    .grass {
      position:absolute; bottom:0; left:0;
      width:200%; height:50px;
      background:url('grass.gif') repeat-x;
      background-size:contain;
      animation:slowGrass 60s ease-in-out infinite alternate;
      pointer-events:none; z-index:2;
    }
    @keyframes slowGrass {
      from { transform:translateX(0); }
      to   { transform:translateX(-25%); }
    }
  </style>
</head>

<body>

  <!-- MISSION HUD MENU -->
  <nav class="side-nav" aria-label="Навигация">
    <button class="side-nav__toggle" type="button" aria-expanded="true" aria-controls="sideNavPanel" title="Свернуть меню">
      <span class="toggle-ico" aria-hidden="true">⟩</span>
      <span class="toggle-text">Игровое меню</span>
    </button>

    <div class="side-nav__panel" id="sideNavPanel">
      <div class="hud-sparks" aria-hidden="true"></div>
      <span class="corner c-tr" aria-hidden="true"></span>
      <span class="corner c-tl" aria-hidden="true"></span>
      <span class="corner c-br" aria-hidden="true"></span>
      <span class="corner c-bl" aria-hidden="true"></span>

      <ul class="side-nav__list">
        <li>
          <a class="side-nav__link is-active" href="https://digitalhavenrussia.ru">
            <span class="ico" aria-hidden="true">🏠</span>
            <span class="txt">
              <span class="title">Главная</span>
              <span class="sub">Миссия активна</span>
            </span>
          </a>
        </li>

        <li>
          <a class="side-nav__link" href="https://digitalhavenrussia.ru/project.html">
            <span class="ico" aria-hidden="true">📘</span>
            <span class="txt">
              <span class="title">О проекте</span>
              <span class="sub">Брифинг</span>
            </span>
          </a>
        </li>

        <li>
          <a class="side-nav__link" href="https://digitalhavenrussia.ru/security.html">
            <span class="ico" aria-hidden="true">🎬</span>
            <span class="txt">
              <span class="title">Мультфильм</span>
              <span class="sub">Обучающий контент</span>
            </span>
          </a>
        </li>

        <li>
          <a class="side-nav__link" href="https://digitalhavenrussia.ru/map.html">
            <span class="ico" aria-hidden="true">🧭</span>
            <span class="txt">
              <span class="title">Маршрут помощи</span>
              <span class="sub">Карта операции</span>
            </span>
          </a>
        </li>
      </ul>

      <div class="divider" aria-hidden="true"></div>

      <a class="side-nav__cta" href="https://digitalhavenrussia.ru/project.html#help">
        <span aria-hidden="true">❤</span>
        <span>Поддержать проект</span>
      </a>
    </div>
  </nav>

  <div class="header">
    <img class="header__bg-blur" src="header-bg-3840.jpg" alt="" aria-hidden="true" decoding="async">
    <img class="header__bg" src="header-bg-3840.jpg" alt="" loading="eager" decoding="async">

    <div class="cloud-left"></div>
    <div class="cloud-right"></div>

    <div class="cube-container" id="cubes"></div>
    <div class="grass"></div>
  </div>

  <script>
    // cubes (как у тебя)
    const container = document.getElementById('cubes');
    const cols = 40, rows = 25;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cube = document.createElement('div');
        cube.className = 'cube';
        cube.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
        cube.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
        cube.style.gridColumn = x + 1;
        cube.style.gridRow = y + 1;
        cube.style.animationDelay = (Math.random() * 0.8) + 's';
        container.appendChild(cube);
      }
    }

    // Активный пункт по URL (подсветка)
    (function markActive(){
      try{
        const path = location.pathname.replace(/\/+$/, '');
        const links = document.querySelectorAll('.side-nav__link');
        links.forEach(a => a.classList.remove('is-active'));

        const rules = [
          { match: ['/', '/index.html'], includes: 'digitalhavenrussia.ru' },
          { match: ['/project.html'], includes: 'project.html' },
          { match: ['/security.html'], includes: 'security.html' },
          { match: ['/map.html'], includes: 'map.html' },
        ];

        const rule = rules.find(r => r.match.includes(path));
        if(!rule) return;

        const active = Array.from(links).find(a => a.getAttribute('href')?.includes(rule.includes));
        if(active) active.classList.add('is-active');
      }catch(e){}
    })();

    // Сворачивание ВПРАВО (панель уезжает за край)
    (function toggleNav(){
      const nav = document.querySelector('.side-nav');
      const btn = document.querySelector('.side-nav__toggle');
      const ico = btn?.querySelector('.toggle-ico');
      if(!nav || !btn || !ico) return;

      btn.addEventListener('click', () => {
        const collapsed = nav.classList.toggle('is-collapsed');
        btn.setAttribute('aria-expanded', String(!collapsed));
        btn.title = collapsed ? 'Развернуть меню' : 'Свернуть меню';
        ico.textContent = collapsed ? '≡' : '⟩';
      });
    })();
  </script>
</body>
</html>
