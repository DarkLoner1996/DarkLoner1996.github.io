<!DOCTYPE html>  
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ТехноКрыльяРоссии</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%;
      height:100%;
      overflow-x:hidden;
      font-family:'Ruslan Display', cursive;
      background:#ddeeff;
    }

    /* ============================================================
       WING MENU (как на визуализации: крылья + иконки + CTA)
       Что добавлено:
       - “крылья” через псевдоэлементы ::before/::after
       - дружелюбный стеклянный бар + мягкие искры
       - кнопки-таблетки с круглой иконкой сверху (как на концепте)
       - CTA "Поддержать проект" справа
       - нормальная адаптация под мобилку (скролл по горизонтали)
       ============================================================ */

    :root{
      --glass: rgba(255,255,255,.70);
      --glass2: rgba(255,255,255,.48);
      --stroke: rgba(255,255,255,.55);
      --shadow: rgba(12, 38, 80, .18);

      --text: #2a4a7a;
      --muted:#3c5f92;

      --accent:#fbe08c;  /* мягкое золото */
      --accent2:#ffd27d;

      --active:#f7d37a;
      --chip:#ffffff;

      --wingBlue1: rgba(120, 195, 255, .55);
      --wingBlue2: rgba(170, 230, 255, .25);
    }

    .nav-capsule{
      position:fixed;
      top:18px;
      left:50%;
      transform:translateX(-50%);
      z-index:1000;
      width:min(1100px, calc(100% - 24px));
    }

    .nav-capsule__inner{
      position:relative;
      border-radius:26px;
      padding:14px 14px;
      background: linear-gradient(180deg, var(--glass), var(--glass2));
      border: 1px solid var(--stroke);
      box-shadow:
        0 18px 40px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow: visible;
    }

    /* “Крылья” по бокам */
    .nav-capsule__inner::before,
    .nav-capsule__inner::after{
      content:"";
      position:absolute;
      top:50%;
      width:min(240px, 22vw);
      height:78px;
      transform: translateY(-50%);
      border-radius: 60px;
      pointer-events:none;
      filter: drop-shadow(0 10px 18px rgba(20,60,120,.12));
      opacity:.95;
      background:
        radial-gradient(120px 50px at 20% 50%, rgba(255,255,255,.75), transparent 70%),
        linear-gradient(180deg, var(--wingBlue1), var(--wingBlue2));
      border: 1px solid rgba(255,255,255,.55);
    }
    .nav-capsule__inner::before{ left:-140px; clip-path: polygon(0 50%, 18% 0, 100% 18%, 100% 82%, 18% 100%); }
    .nav-capsule__inner::after { right:-140px; clip-path: polygon(100% 50%, 82% 0, 0 18%, 0 82%, 82% 100%); }

    /* искры */
    .nav-sparkles{
      position:absolute;
      inset:-10px;
      pointer-events:none;
      opacity:.45;
      background:
        radial-gradient(circle at 12% 40%, rgba(255,255,255,.9) 0 2px, transparent 3px),
        radial-gradient(circle at 28% 70%, rgba(255,255,255,.75) 0 1.5px, transparent 3px),
        radial-gradient(circle at 55% 35%, rgba(255,225,140,.9) 0 2px, transparent 3px),
        radial-gradient(circle at 76% 62%, rgba(255,255,255,.85) 0 1.5px, transparent 3px),
        radial-gradient(circle at 90% 42%, rgba(255,225,140,.8) 0 2px, transparent 3px);
      filter: blur(.2px);
    }

    /* Лэйаут: слева логотип, центр меню, справа CTA */
    .nav-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      padding:6px 8px;
      border-radius:18px;
      user-select:none;
      white-space:nowrap;
    }

    .brand__logo{
      width:54px;
      height:54px;
      border-radius:18px;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(255,255,255,.25) 55%, transparent 70%),
        linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,.35));
      border:1px solid rgba(255,255,255,.65);
      box-shadow: 0 10px 18px rgba(20,60,120,.12), inset 0 1px 0 rgba(255,255,255,.8);
      overflow:hidden;
      display:grid;
      place-items:center;
    }
    .brand__logo img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .brand__text{
      display:flex;
      flex-direction:column;
      line-height:1.05;
    }
    .brand__title{
      font-size:18px;
      letter-spacing:.3px;
      color: var(--text);
      text-shadow: 0 1px 0 rgba(255,255,255,.6);
    }
    .brand__sub{
      font-size:12px;
      letter-spacing:.28em;
      color: rgba(60,95,146,.9);
      margin-top:2px;
    }

    /* Меню по центру */
    .nav-capsule__list{
      list-style:none;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:14px;
      margin:0;
      padding:0;
      flex: 1 1 auto;
      min-width: 0;
    }

    .nav-item{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      min-width: 118px;
    }

    /* круглая иконка сверху */
    .nav-ico{
      width:44px;
      height:44px;
      border-radius:999px;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), rgba(255,255,255,.55) 50%, rgba(255,255,255,.25) 85%),
        linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.35));
      border: 1px solid rgba(255,255,255,.7);
      box-shadow: 0 12px 20px rgba(20,60,120,.12), inset 0 1px 0 rgba(255,255,255,.85);
      display:grid;
      place-items:center;
      color: rgba(42,74,122,.95);
      font-size:18px;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    /* кнопка-таблетка снизу */
    .nav-link{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 14px;
      border-radius:16px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(255,255,255,.65);
      box-shadow: 0 14px 26px rgba(20,60,120,.10), inset 0 1px 0 rgba(255,255,255,.9);
      text-decoration:none;
      color: var(--muted);
      font-size:16px;
      letter-spacing:.2px;
      white-space:nowrap;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    .nav-link::after{
      content:"";
      position:absolute;
      left:14px; right:14px; bottom:6px;
      height:2px;
      border-radius:999px;
      background: linear-gradient(90deg, transparent, rgba(255,210,125,.9), transparent);
      opacity:0;
      transform: translateY(2px);
      transition: opacity .18s ease, transform .18s ease;
      pointer-events:none;
    }

    .nav-item:hover .nav-ico{
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 16px 26px rgba(20,60,120,.14), inset 0 1px 0 rgba(255,255,255,.9);
      filter:saturate(1.05);
    }
    .nav-item:hover .nav-link{
      transform: translateY(-1px);
      box-shadow: 0 18px 30px rgba(20,60,120,.14), inset 0 1px 0 rgba(255,255,255,.92);
      filter:saturate(1.05);
    }
    .nav-item:hover .nav-link::after{
      opacity:1;
      transform: translateY(0);
    }

    /* Активный пункт */
    .nav-item.is-active .nav-ico{
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), rgba(255,235,185,.75) 55%, rgba(255,255,255,.25) 85%),
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.38));
      box-shadow: 0 18px 30px rgba(20,60,120,.16), 0 0 0 3px rgba(255,210,125,.25), inset 0 1px 0 rgba(255,255,255,.92);
    }
    .nav-item.is-active .nav-link{
      box-shadow: 0 18px 30px rgba(20,60,120,.16), 0 0 0 2px rgba(255,210,125,.28), inset 0 1px 0 rgba(255,255,255,.92);
    }
    .nav-item.is-active .nav-link::after{
      opacity:1;
      transform: translateY(0);
    }

    .nav-link:focus-visible{
      outline:none;
      box-shadow: 0 18px 30px rgba(20,60,120,.16), 0 0 0 3px rgba(120,195,255,.30), inset 0 1px 0 rgba(255,255,255,.92);
    }

    /* CTA справа */
    .cta{
      flex: 0 0 auto;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:12px 18px;
      border-radius:18px;
      background: linear-gradient(180deg, rgba(255,244,210,.95), rgba(255,220,140,.88));
      border:1px solid rgba(255,255,255,.75);
      box-shadow: 0 18px 34px rgba(20,60,120,.14), inset 0 1px 0 rgba(255,255,255,.9);
      color: #4b4b4b;
      text-decoration:none;
      font-size:16px;
      letter-spacing:.15px;
      white-space:nowrap;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .cta .heart{
      width:30px;
      height:30px;
      border-radius:999px;
      background: rgba(255,255,255,.8);
      border: 1px solid rgba(255,255,255,.7);
      display:grid;
      place-items:center;
      box-shadow: 0 12px 20px rgba(20,60,120,.10), inset 0 1px 0 rgba(255,255,255,.9);
    }
    .cta:hover{
      transform: translateY(-1px);
      box-shadow: 0 22px 40px rgba(20,60,120,.16), inset 0 1px 0 rgba(255,255,255,.92);
      filter:saturate(1.04);
    }
    .cta:focus-visible{
      outline:none;
      box-shadow: 0 22px 40px rgba(20,60,120,.16), 0 0 0 3px rgba(255,210,125,.35), inset 0 1px 0 rgba(255,255,255,.92);
    }

    /* Адаптив */
    @media (max-width: 980px){
      .brand__text{ display:none; } /* чтобы не теснило */
      .nav-item{ min-width: 108px; }
    }

    @media (max-width: 820px){
      .nav-row{ gap:10px; }
      .nav-capsule__inner{ padding:12px; border-radius:22px; }
      .nav-capsule__inner::before, .nav-capsule__inner::after{ display:none; } /* крылья отключим на узких */
      .nav-capsule__list{
        justify-content:flex-start;
        overflow:auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        gap:10px;
        padding: 0 6px;
      }
      .nav-capsule__list::-webkit-scrollbar{ display:none; }
      .nav-item{ min-width: 104px; }
      .nav-ico{ width:40px; height:40px; font-size:17px; }
      .nav-link{ font-size:14px; padding:9px 12px; border-radius:14px; }
      .cta{ padding:11px 14px; border-radius:16px; font-size:14px; }
      .cta .heart{ width:28px; height:28px; }
    }

    @media (prefers-reduced-motion: reduce){
      .nav-ico, .nav-link, .cta { transition:none; }
      .cloud-left, .cloud-right, .grass, .cube{ animation:none !important; }
    }

    /* ===== HEADER (как у тебя) ===== */
    .header{
      position:relative;
      width:100%;
      height:100vh;
      min-height:100svh;
      min-height:100dvh;
      overflow:hidden;
      background:#ddeeff;
    }

    .header__bg-blur{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      filter: blur(22px) saturate(1.15);
      transform: scale(1.12);
      z-index:0;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .header__bg{
      position:absolute;
      left:50%;
      top:50%;
      width:100vw;
      height:auto;
      max-height:100vh;
      transform:translate(-50%, -50%);
      z-index:1;
      object-fit:unset;
      pointer-events:none;
      user-select:none;
    }

    .header::after {
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.05), rgba(0,0,0,0.18)),
        rgba(255,255,255,0.05);
      z-index:3;
      pointer-events:none;
    }

    /* ===== Clouds ===== */
    .cloud-left {
      position:absolute; top:0%; left:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      animation:flyLeftToRight 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    .cloud-right {
      position:absolute; top:3%; right:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      transform:scaleX(-1);
      animation:flyRightToLeft 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    @keyframes flyLeftToRight {
      0%,10%   { transform:translateX(0); }
      90%,100% { transform:translateX(calc(100vw + 250px)); }
    }
    @keyframes flyRightToLeft {
      0%,10%   { transform:translateX(0) scaleX(-1); }
      90%,100% { transform:translateX(calc(-100vw - 250px)) scaleX(-1); }
    }

    /* ===== Cubes ===== */
    .cube-container{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(40, minmax(0, 1fr));
      grid-template-rows:repeat(25, minmax(0, 1fr));
      z-index:2;
      pointer-events:none;
    }
    .cube{
      width:100%;
      height:100%;
      background:url('code.webp') no-repeat center/contain;
      opacity:0;
      animation:cubeReveal 1.5s ease forwards;
    }
    @keyframes cubeReveal {
      0%   { transform:translate(var(--tx),var(--ty)) scale(0.1); opacity:0; }
      50%  { transform:translate(0,0) scale(1); opacity:1; }
      100% { transform:translate(0,0) scale(1); opacity:0; }
    }

    /* ===== Grass ===== */
    .grass {
      position:absolute; bottom:0; left:0;
      width:200%; height:50px;
      background:url('grass.gif') repeat-x;
      background-size:contain;
      animation:slowGrass 60s ease-in-out infinite alternate;
      pointer-events:none; z-index:2;
    }
    @keyframes slowGrass {
      from { transform:translateX(0); }
      to   { transform:translateX(-25%); }
    }
  </style>
</head>

<body>

<!-- WING MENU -->
<nav class="nav-capsule" aria-label="Навигация">
  <div class="nav-capsule__inner">
    <div class="nav-sparkles" aria-hidden="true"></div>

    <div class="nav-row">
      <!-- BRAND -->
      <div class="brand" aria-label="Цифровая Гавань России">
        <div class="brand__logo" title="DigitalHavenRussia">
          <!-- Поставь сюда свой логотип (например bear-logo.webp / embl.webp).
               Если файла нет — оставь как есть, будет просто “стеклянная плитка”. -->
          <img src="embl.webp" alt="Логотип" onerror="this.remove()" />
        </div>
        <div class="brand__text">
          <div class="brand__title">ЦИФРОВАЯ ГАВАНЬ</div>
          <div class="brand__sub">РОССИИ</div>
        </div>
      </div>

      <!-- CENTER MENU -->
      <ul class="nav-capsule__list">
        <li class="nav-item is-active">
          <div class="nav-ico" aria-hidden="true">🏠</div>
          <a class="nav-link" href="https://digitalhavenrussia.ru"><span>Главная</span></a>
        </li>

        <li class="nav-item">
          <div class="nav-ico" aria-hidden="true">📘</div>
          <a class="nav-link" href="https://digitalhavenrussia.ru/project.html"><span>О проекте</span></a>
        </li>

        <li class="nav-item">
          <div class="nav-ico" aria-hidden="true">🎬</div>
          <a class="nav-link" href="https://digitalhavenrussia.ru/security.html"><span>Мультфильм</span></a>
        </li>

        <li class="nav-item">
          <div class="nav-ico" aria-hidden="true">🧭</div>
          <a class="nav-link" href="https://digitalhavenrussia.ru/map.html"><span>Маршрут</span></a>
        </li>
      </ul>

      <!-- CTA -->
      <!-- Поменяй ссылку на реальную страницу помощи/доната, если есть -->
      <a class="cta" href="https://digitalhavenrussia.ru/project.html#help">
        <span class="heart" aria-hidden="true">❤</span>
        <span>Поддержать проект</span>
      </a>
    </div>
  </div>
</nav>

  <div class="header">
    <img class="header__bg-blur" src="header-bg-3840.jpg" alt="" aria-hidden="true" decoding="async">
    <img class="header__bg" src="header-bg-3840.jpg" alt="" loading="eager" decoding="async">

    <div class="cloud-left"></div>
    <div class="cloud-right"></div>

    <div class="cube-container" id="cubes"></div>
    <div class="grass"></div>
  </div>

  <script>
    // cubes (как у тебя)
    const container = document.getElementById('cubes');
    const cols = 40, rows = 25;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cube = document.createElement('div');
        cube.className = 'cube';
        cube.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
        cube.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
        cube.style.gridColumn = x + 1;
        cube.style.gridRow = y + 1;
        cube.style.animationDelay = (Math.random() * 0.8) + 's';
        container.appendChild(cube);
      }
    }

    // (опционально) подсветка активного пункта по URL:
    // добавь класс is-active на нужный .nav-item автоматически
    (function markActive(){
      try{
        const path = location.pathname.replace(/\/+$/, '');
        const map = [
          { href: '/', match: ['/', '/index.html'] },
          { href: '/project.html', match: ['/project.html'] },
          { href: '/security.html', match: ['/security.html'] },
          { href: '/map.html', match: ['/map.html'] },
        ];

        const items = document.querySelectorAll('.nav-item');
        items.forEach(i => i.classList.remove('is-active'));

        const found = map.find(m => m.match.includes(path));
        if(!found) return;

        const link = document.querySelector(`.nav-link[href*="${found.href}"]`);
        if(link) link.closest('.nav-item')?.classList.add('is-active');
      }catch(e){}
    })();
  </script>
</body>
</html>
