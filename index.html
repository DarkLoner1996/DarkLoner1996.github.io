<html lang="ru">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    *{ margin:0; padding:0; box-sizing:border-box; }
    html, body{
      width:100%;
      height:100%;
      overflow-x:hidden;
      font-family:'Ruslan Display', cursive;
      background:#ddeeff;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

    }

    :root{
      --nav-left: 18px;
      --nav-top: 14px;
      --panel-w: min(440px, calc(100vw - 36px));

      --text: rgba(250,244,232,.96);
      --muted: rgba(245,235,210,.78);

      --gA: rgba(90, 170, 195, .42);
      --gB: rgba(35, 120, 145, .34);

      --iA: rgba(255,255,255,.14);
      --iB: rgba(0,0,0,.06);

      --goldA:#fff2c9;
      --goldB:#f2d07a;
      --goldC:#c58a2c;
      --goldD:#7a4a12;

      --blueP1: rgba(65, 175, 220, .92);
      --blueP2: rgba(30, 120, 170, .92);

      --actP1: rgba(255, 242, 205, .98);
      --actP2: rgba(245, 206, 120, .98);

      --shadow: rgba(0,0,0,.24);
      --ring: rgba(255,230,160,.22);

      --radius: 26px;
      --rowH: clamp(72px, 10vw, 84px);

      /* Matrix/HUD accents */
      --mx: rgba(110,255,210,.92);
      --mx2: rgba(40,220,160,.55);
      --mxDark: rgba(6,18,16,.55);

      /* Matrix colors (yellow + blue) */
      --mxY: rgba(255, 226, 120, .95); /* жёлтый */
      --mxB: rgba(80, 175, 255, .80);  /* синий */

      /* ✅ Режим хедера:
         1 = "по ширине 100%, без искажений, лишнее вниз (скролл)" — самый честный
         2 = "на весь экран cover (будет кроп, но красиво)"
      */
      --hero-mode: 2;
    }

    .side-nav{
      position:fixed;
      left: var(--nav-left);
      top: var(--nav-top);
      z-index:1000;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-start;
      transform: translateZ(0);
      user-select:none;
    }

    /* =============== TOP BAR =============== */
    .side-nav__tab{
      width: var(--panel-w);
      border-radius: 22px;
      padding: 10px 12px;
      position:relative;
      overflow:hidden;

      background:
        radial-gradient(120% 120% at 30% 22%, rgba(255,255,255,.18), transparent 60%),
        radial-gradient(110% 80% at 84% 18%, rgba(255,215,120,.16), transparent 58%),
        linear-gradient(180deg, rgba(16,120,140,.52), rgba(7,65,78,.48));

      box-shadow: 0 16px 32px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.18);
    }
    .side-nav__tab::before{
      content:"";
      position:absolute; inset:0;
      border-radius: 22px;
      padding: 2px;
      background: linear-gradient(180deg, var(--goldA), var(--goldB) 35%, var(--goldC) 70%, var(--goldD));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.92;
    }

    .tab-row{
      position:relative;
      z-index:2;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .back-btn{
      width:46px; height:46px;
      border-radius:16px;
      border:1px solid rgba(255,240,190,.30);
      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.16), transparent 62%),
        linear-gradient(180deg, rgba(10,95,110,.50), rgba(6,55,65,.48));
      box-shadow: 0 12px 20px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.14);
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform .16s ease, filter .16s ease;
      flex:0 0 auto;
    }
    .back-btn:hover{ transform: translateY(-1px); filter:saturate(1.04); }
    .back-btn:active{ transform: translateY(0px) scale(.985); }
    .back-btn svg{ width:22px; height:22px; stroke: var(--text); fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; opacity:.96; }

    .tab-title{
      flex:1 1 auto;
      min-width:0;
      font-size: clamp(18px, 3.8vw, 22px);
      letter-spacing:.20px;

    .hud-switch{

    .hud-switch .moon{

    .switch{

      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      position:relative;
      cursor:pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
      transition: filter .18s ease, transform .12s ease;
    }
    .switch:hover{ filter:saturate(1.05); }
    .switch:active{ transform: scale(.985); }
    .switch::after{
      content:"";
      position:absolute;
      top:2px; left:2px;
      width:18px; height:18px;
      border-radius:50%;
      background: rgba(255,255,255,.88);
      box-shadow: 0 8px 14px rgba(0,0,0,.22);
      transition: left .18s ease, background .18s ease;

    .switch.is-on{
      background: rgba(255,215,120,.18);
      border-color: rgba(255,235,175,.20);
    }
    .switch.is-on::after{
      left:24px;
      background: rgba(255,240,200,.96);
    }

    /* =============== PANEL =============== */
    .side-nav__panel{
      width: var(--panel-w);
      border-radius: var(--radius);
      padding: 14px 14px 16px;
      position:relative;
      overflow:hidden;

      background:
        radial-gradient(140% 120% at 20% 10%, rgba(255,255,255,.18), transparent 62%),
        radial-gradient(120% 100% at 84% 12%, rgba(255,215,120,.12), transparent 60%),

      box-shadow: 0 18px 44px rgba(0,0,0,.22);
      backdrop-filter: blur(14px) saturate(1.12);
      -webkit-backdrop-filter: blur(14px) saturate(1.12);
    }
    .side-nav__panel::before{
      content:"";
      position:absolute; inset:0;
      border-radius: var(--radius);
      padding: 4px;
      background: linear-gradient(180deg, var(--goldA), var(--goldB) 34%, var(--goldC) 70%, var(--goldD));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;

    .inner-stroke{

      border-radius: calc(var(--radius) - 10px);
      border: 1px solid rgba(255,240,190,.20);

    }
    .sparkles{
      position:absolute;

      background:

    .side-nav__list{

    /* =============== ITEM ROW =============== */
    .hud-item{
      height: var(--rowH);
      border-radius: 20px;
      padding: 12px 14px;
      display:flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      color: var(--text);
      position:relative;
      overflow:hidden;

      background:
        radial-gradient(120% 140% at 25% 20%, rgba(255,255,255,.16), transparent 58%),

    }
    .hud-item::before{
      content:"";
      position:absolute; inset:0;

      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.88;
    }

    .hud-item::after{
      content:"";
      position:absolute;
      left: 10px;
      top: 50%;
      width: 10px;
      height: 10px;
      transform: translateY(-50%) rotate(45deg);
      border-radius: 2px;
      background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.08));
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 10px 16px rgba(0,0,0,.16);
      opacity:.86;
    }
    .hud-item.is-active::after{
      background: linear-gradient(180deg, rgba(255,240,195,.95), rgba(245,206,120,.86));
      border-color: rgba(255,255,255,.32);
      box-shadow: 0 0 10px rgba(255,220,140,.16), 0 10px 16px rgba(0,0,0,.16);
      opacity:1;
    }
    .hud-item.is-active{
      box-shadow: 0 14px 28px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.16), inset 0 0 18px rgba(255,220,140,.10);
    }
    .hud-item:hover{
      transform: translateY(-1px);
      filter:saturate(1.05);
      box-shadow: 0 18px 34px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.16);
    }
    .hud-item:active{ transform: translateY(0px) scale(.992); }
    .hud-item:focus-visible{
      outline:none;
      box-shadow: 0 0 0 3px var(--ring), 0 18px 34px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.16);
    }

    .hud-ico{
      width: clamp(50px, 11vw, 58px);
      height: clamp(50px, 11vw, 58px);
      border-radius: 18px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      margin-left: 20px;

      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.14), transparent 62%),

    }
    .hud-ico svg{
      width: clamp(24px, 6vw, 30px);
      height: clamp(24px, 6vw, 30px);
      stroke: rgba(255,245,220,.95);
      fill:none;
      stroke-width:2.3;
      stroke-linecap:round;
      stroke-linejoin:round;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.18));
    }

    .hud-txt{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
      flex:1 1 auto;
    }

    .hud-title{
      font-size: clamp(16px, 3.6vw, 20px);

      line-height: 1.02;
      text-shadow: 0 1px 0 rgba(0,0,0,.18);

      display: -webkit-box;

      overflow: hidden;
    }

    .hud-sub{
      font-size: clamp(10px, 2.4vw, 12px);
      letter-spacing:.08em;
      text-transform:uppercase;
      color: var(--muted);
      opacity:.88;

      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
      overflow:hidden;
    }

    .hud-title--split{
      display:flex;
      flex-direction:column;
      gap:2px;
      line-height:1.02;
    }
    .hud-title--split > span{ display:block; }

    .hud-pill{
      flex:0 0 auto;
      min-width: clamp(84px, 20vw, 110px);
      height: clamp(32px, 7.8vw, 38px);
      padding: 0 12px;
      border-radius: 999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      font-size: clamp(11px, 2.8vw, 14px);
      letter-spacing:.16em;
      text-transform:uppercase;
      color: rgba(245,250,255,.96);

      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.18), transparent 60%),

      border:1px solid rgba(255,240,190,.18);

      box-shadow:
        0 12px 18px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.20);

      position:relative;
      overflow:hidden;

      backdrop-filter: blur(6px) saturate(1.05);
      -webkit-backdrop-filter: blur(6px) saturate(1.05);
    }
    .hud-pill::after{
      content:"›";
      font-size: clamp(18px, 4.2vw, 22px);
      line-height:1;
      opacity:.88;
      transform: translateY(-1px);
      margin-left:2px;
    }
    .hud-pill.active{
      color: rgba(70,55,28,.95);
      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.26), transparent 60%),
        linear-gradient(180deg, var(--actP1), var(--actP2));
      border-color: rgba(255,255,255,.32);
      box-shadow:
        0 14px 22px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.58);
    }
    .hud-pill.active::after{ opacity:.62; }
    .hud-item:hover .hud-pill{
      filter:saturate(1.06);
      transform: translateY(-1px);
      transition: transform .16s ease, filter .16s ease;
    }

    /* =============== CTA =============== */
    .hud-cta{
      position:relative;
      z-index:3;

      height: clamp(64px, 14vw, 74px);
      border-radius: 22px;
      display:flex;
      align-items:center;
      gap:12px;
      justify-content:flex-start;

      padding: 0 58px 0 18px;

      text-decoration:none;
      color: rgba(70,55,28,.95);
      text-transform:uppercase;
      letter-spacing:.10em;
      font-size: clamp(16px, 4.1vw, 21px);

      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.26), transparent 62%),
        linear-gradient(180deg, rgba(255,240,195,.98), rgba(245,206,120,.98));
      border:1px solid rgba(255,255,255,.44);
      box-shadow: 0 20px 38px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.58);

      overflow:hidden;
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }
    .hud-cta::before{
      content:"";
      position:absolute; inset:0;
      border-radius: 22px;
      padding: 2px;
      background: linear-gradient(180deg, rgba(255,255,255,.78), rgba(245,205,120,.52), rgba(140,90,18,.34));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.88;
    }

    .cta-text{
      flex:1 1 auto;
      min-width:0;
      padding-right:10px;
    }

    .cta-gem{
      position:absolute;
      top:50%;
      width:16px; height:16px;
      transform: translateY(-50%) rotate(45deg);
      border-radius: 4px;
      opacity:.90;
      pointer-events:none;

      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), transparent 48%),
        linear-gradient(180deg, rgba(120, 230, 255, .92), rgba(40, 150, 210, .92));
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: 0 10px 16px rgba(0,0,0,.18);
    }
    .cta-gem.left{ display:none; }
    .cta-gem.right{ right: 14px; }

    .hud-cta:hover{
      transform: translateY(-1px);
      filter:saturate(1.04);
      box-shadow: 0 24px 46px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.60);
    }
    .hud-cta:active{ transform: translateY(0px) scale(.992); }

    .hud-cta .heart{
      width:44px;
      height:44px;
      border-radius: 14px;
      display:grid;
      place-items:center;

      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.70), rgba(255,255,255,.35) 55%, rgba(255,255,255,.18));
      border:1px solid rgba(255,255,255,.55);
      box-shadow:
        0 10px 18px rgba(0,0,0,.14),
        inset 0 1px 0 rgba(255,255,255,.70);

      flex:0 0 auto;
      position:relative;
      z-index:2;
      margin-left: 2px;
    }
    .hud-cta .heart svg{
      width:20px; height:20px;
      stroke: rgba(70,55,28,.92);
      fill:none;
      stroke-width:2.6;
      stroke-linecap:round;
      stroke-linejoin:round;
      filter: drop-shadow(0 1px 0 rgba(255,255,255,.35));
    }

    /* =============== COLLAPSE =============== */
    .side-nav.is-collapsed .side-nav__panel{
      transform: translateX(calc(-100% - 18px));
      opacity:0;
      pointer-events:none;
      filter: blur(1px);
      transition: transform .22s ease, opacity .22s ease, filter .22s ease;
    }
    .side-nav__panel{ transition: transform .22s ease, opacity .22s ease, filter .22s ease; }

    /* =============== NIGHT =============== */
    .hud--night{
      --gA: rgba(18, 55, 70, .62);
      --gB: rgba(8, 30, 40, .54);
      --iA: rgba(255,255,255,.12);
      --iB: rgba(0,0,0,.10);
    }

    @media (max-width: 520px){
      .hud-title{ -webkit-line-clamp: 2; }
      .hud-sub{ -webkit-line-clamp: 1; }
      .hud-pill{ min-width: 86px; }
      .hud-ico{ margin-left: 18px; }
    }

    /* =========================================================
       ✅ HEADER: БЕЗ СОСИСКИ / БЕЗ ПЛЮЩЕНИЯ / КРАСИВО НА 4К
       По умолчанию: 100% ширина + авто-высота (скролл вниз)
       Альтернатива: cover (кроп, но "во весь экран")
    ========================================================= */

    /* Контейнер */
    .header{
      position:relative;
      width:100%;
      min-height: 100svh;
      background:#ddeeff;
      overflow-x:hidden;
      overflow-y:auto; /* ✅ если картинка выше экрана — появится скролл */
      isolation:isolate;
    }

    /* Размытый "fill" слой — всегда закрывает экран */
    .header__bg-blur{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      filter: blur(22px) saturate(1.15);
      transform: scale(1.12);
      z-index:0;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
      will-change: transform;
    }

    /* Основная картинка — НЕ absolute, чтобы не насиловать height:100% */
    .header__bg{
      position:relative;
      display:block;
      width:100vw;     /* ✅ по ширине — на весь экран */
      height:auto;     /* ✅ пропорции сохраняются => не "сосиска" */
      z-index:1;
      margin:0 auto;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;

      /* чуть приятнее ресемплинг при даунскейле */
      image-rendering: auto;
      -ms-interpolation-mode: bicubic;
    }

    /* Если хочешь режим "cover на весь экран" — включи переменную:
       --hero-mode: 2;  (в :root)
    */
    :root[style*="--hero-mode: 2"] .header{
      overflow:hidden; /* в cover-режиме скролл не нужен */
    }
    :root[style*="--hero-mode: 2"] .header__bg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;     /* ✅ во весь экран без искажений, но с кропом */
      object-position:center;
    }

    /* лёгкая HUD-виниетка на хедере */
    .header::after{
      content:"";
      position:fixed;
      inset:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.06), rgba(0,0,0,0.22)),
        linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.02) 35%, rgba(0,0,0,0.10));
      z-index:2;
      pointer-events:none;
    }

    /* ===================== MATRIX GLOBAL (FULL SITE) ===================== */
    .matrix-wrap{
      position:fixed;
      inset:0;
      z-index:9997;
      pointer-events:none;
      opacity:0;
      transition: opacity 1.25s ease;
      background: rgba(0,0,0,.26);
      mix-blend-mode: normal;
    }
    .matrix-wrap.is-on{ opacity:1; }
    .matrix-wrap.is-off{ opacity:0; }

    .matrix{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      pointer-events:none;

      opacity:.92;
      mix-blend-mode: screen;
      filter: blur(.35px) saturate(1.25) contrast(1.06);
    }

    /* ===== Появление (скан + глич) ===== */
    .intro{
      position:fixed;
      inset:0;
      z-index:9998;
      pointer-events:none;
      background:
        radial-gradient(120% 120% at 50% 20%, rgba(110,255,210,.10), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,.65), rgba(0,0,0,.35));
      opacity:0;
      transform: translateZ(0);
    }
    .intro.is-on{
      opacity:1;
      animation: introFade 1.35s ease forwards;
    }

    .intro::before{
      content:"";
      position:absolute;
      left:-20%;
      top:-30%;
      width:140%;
      height:30%;
      background: linear-gradient(90deg, transparent, rgba(110,255,210,.16), transparent);
      transform: rotate(12deg) translateY(-120%);
      filter: blur(1px);
      opacity:.9;
      animation: scan 1.35s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .intro::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px),
        radial-gradient(circle at 20% 30%, rgba(110,255,210,.12), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(110,255,210,.08), transparent 55%);
      opacity:.22;
      mix-blend-mode: overlay;
      animation: glitch 1.35s steps(18) forwards;
    }

    @keyframes introFade{
      0%{ opacity:1; }
      75%{ opacity:1; }
      100%{ opacity:0; }
    }
    @keyframes scan{
      0%{ transform: rotate(12deg) translateY(-140%); }
      75%{ transform: rotate(12deg) translateY(120%); }
      100%{ transform: rotate(12deg) translateY(170%); }
    }
    @keyframes glitch{
      0%{ transform: translateX(0); filter:none; }
      20%{ transform: translateX(-1px); filter: contrast(1.08); }
      40%{ transform: translateX(1px); filter: hue-rotate(8deg); }
      60%{ transform: translateX(-1px); filter: contrast(1.04); }
      80%{ transform: translateX(1px); filter: hue-rotate(-6deg); }
      100%{ transform: translateX(0); filter:none; }
    }

    /* ===== Переход между страницами (Matrix-wipe) ===== */
    .page-transition{
      position:fixed;
      inset:0;
      z-index:9999;
      pointer-events:none;
      opacity:0;
      background:
        radial-gradient(120% 120% at 50% 25%, rgba(110,255,210,.10), transparent 62%),
        linear-gradient(180deg, rgba(0,0,0,.82), rgba(0,0,0,.55));
      transform: translateZ(0);
    }
    .page-transition.is-leaving{
      opacity:1;
      animation: ptIn .52s ease forwards;
    }
    .page-transition.is-entering{
      opacity:1;
      animation: ptOut .46s ease forwards;
    }

    .page-transition .wipe{
      position:absolute;
      inset:-10%;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(110,255,210,.0) 0 18px,
          rgba(110,255,210,.06) 18px 20px,
          rgba(110,255,210,.0) 20px 36px
        ),
        radial-gradient(circle at 50% 50%, rgba(110,255,210,.12), transparent 62%);
      mix-blend-mode: screen;
      filter: blur(.3px);
      transform: translateX(-120%);
      opacity:.95;
    }
    .page-transition.is-leaving .wipe{ animation: wipeIn .52s cubic-bezier(.2,.8,.2,1) forwards; }
    .page-transition.is-entering .wipe{ animation: wipeOut .46s cubic-bezier(.2,.8,.2,1) forwards; }

    @keyframes ptIn{ 0%{ opacity:0; } 25%{ opacity:1; } 100%{ opacity:1; } }
    @keyframes ptOut{ 0%{ opacity:1; } 100%{ opacity:0; } }
    @keyframes wipeIn{ 0%{ transform: translateX(-120%); } 100%{ transform: translateX(120%); } }
    @keyframes wipeOut{ 0%{ transform: translateX(120%); } 100%{ transform: translateX(220%); } }

    @media (prefers-reduced-motion: reduce){
      .hud-item, .hud-cta, .switch, .back-btn { transition:none !important; }
      .side-nav__panel{ transition:none !important; }
      .intro, .page-transition, .page-transition .wipe{ animation:none !important; }
      .intro.is-on, .page-transition.is-leaving, .page-transition.is-entering{ opacity:0 !important; }
      .matrix-wrap{ display:none !important; }
    }
  </style>
</head>

<body>

  <!-- Matrix full-site overlay -->

                <path d="M14 18 10 20V6l4-2"></path>

  <!-- HEADER -->
  <div class="header">
    <!-- blur всегда "закрывает" экран -->
    <img class="header__bg-blur" src="header-bg-3840.jpg" alt="" aria-hidden="true" decoding="async">

    <!-- основная картинка: по ширине 100%, без искажений -->
    <img
      class="header__bg"
      src="header-bg-3840.jpg"
      alt=""
      loading="eager"
      decoding="async"
      draggable="false"
    >
  </div>

  <script>
    // =============== Intro (on load) ===============
    (function introAnim(){
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(reduce) return;
      const intro = document.getElementById('intro');
      if(!intro) return;
      requestAnimationFrame(() => intro.classList.add('is-on'));
      setTimeout(() => intro.remove(), 1650);
    })();

    // =============== Активный пункт по URL ===============
    (function markActive(){
      try{
        const path = location.pathname.replace(/\/+$/, '') || '/';
        const items = document.querySelectorAll('.hud-item');
        items.forEach(a => a.classList.remove('is-active'));

        const rules = [
          { match: ['/', '/index.html'], hrefPart: 'digitalhavenrussia.ru' },
          { match: ['/project.html'], hrefPart: 'project.html' },
          { match: ['/security.html'], hrefPart: 'security.html' },
          { match: ['/map.html'], hrefPart: 'map.html' },
        ];
        const rule = rules.find(r => r.match.includes(path));
        if(!rule) return;

        const active = Array.from(items).find(a => (a.getAttribute('href') || '').includes(rule.hrefPart));
        if(active) active.classList.add('is-active');
      }catch(e){}
    })();

    // =============== Сворачивание ===============
    (function toggleMenu(){
      const nav = document.querySelector('.side-nav');
      const btn = document.getElementById('menuToggle');
      if(!nav || !btn) return;

      btn.addEventListener('click', () => {
        const collapsed = nav.classList.toggle('is-collapsed');
        btn.setAttribute('aria-expanded', String(!collapsed));
        btn.title = collapsed ? 'Развернуть меню' : 'Свернуть меню';
      });
    })();

    // =============== Ночной режим ===============
    (function nightHud(){
      const nav = document.querySelector('.side-nav');
      const sw = document.getElementById('nightSwitch');
      if(!nav || !sw) return;

      const setState = (on) => {
        sw.classList.toggle('is-on', on);
        sw.setAttribute('aria-checked', String(on));
        nav.classList.toggle('hud--night', on);
      };

      const toggle = () => setState(!(sw.getAttribute('aria-checked') === 'true'));

      sw.addEventListener('click', toggle);
      sw.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });

      setState(false);
    })();

    // =============== Matrix rain (без изменений твоей логики) ===============
    (function matrixRainCinema(){
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(reduce) return;

      const wrap = document.getElementById('matrixWrap');
      const c = document.getElementById('matrix');
      if(!wrap || !c) return;

      const ctx = c.getContext('2d', { alpha: true });

      const glyphs = (
        "アイウエオカキクケコサシスセソタチツテトナニヌネノ" +
        "ハヒフヘホマミムメモヤユヨラリルレロワヲンヴ" +
        "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$+-*/=<>[]{}()"
      ).split("");

      const dpr = Math.min(2, window.devicePixelRatio || 1);

      let W=0,H=0,font=16,cols=0;
      let dropsA=[], dropsB=[];
      let raf=0;
      let stopTimer=0;

      let minTravelMs = 2400;
      let fadeOutMs   = 1250;
      let loadedAt = 0;

      function rand(min,max){ return min + Math.random()*(max-min); }
      function pick(arr){ return arr[(Math.random()*arr.length)|0]; }

      function makeDrops(layerScale){
        return new Array(cols).fill(0).map(() => {
          const speed = rand(0.55, 1.35) * layerScale;
          const len   = rand(18, 48) * layerScale;
          const y     = rand(-H/font - 80, -10);
          const switchEvery = rand(3, 9);
          const gapChance = 0.012 + Math.random()*0.02;
          return { y, speed, len, t:0, switchEvery, ch: pick(glyphs), gapChance };
        });
      }

      function resize(){
        const r = wrap.getBoundingClientRect();
        W = Math.max(1, Math.floor(r.width));
        H = Math.max(1, Math.floor(r.height));

        c.width  = Math.floor(W * dpr);
        c.height = Math.floor(H * dpr);
        c.style.width  = W + "px";
        c.style.height = H + "px";
        ctx.setTransform(dpr,0,0,dpr,0,0);

        font = Math.max(13, Math.min(22, Math.round(W / 135)));
        cols = Math.floor(W / font);

        dropsA = makeDrops(1.0);
        dropsB = makeDrops(0.80);
      }

      function drawLayer(drops, layerAlpha, glow, headBoost, colorMix){
        ctx.font = `700 ${font}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace`;
        ctx.textBaseline = "top";

        ctx.shadowBlur = glow;
        ctx.shadowColor = `rgba(${colorMix.glowR},${colorMix.glowG},${colorMix.glowB},0.70)`;

        for(let i=0;i<drops.length;i++){
          const d = drops[i];
          const x = i * font;

          if(Math.random() < d.gapChance){
            d.y += d.speed;
            if(d.y * font > H + d.len * font) d.y = rand(-120, -20);
            continue;
          }

          d.t++;
          if(d.t >= d.switchEvery){
            d.t = 0;
            d.ch = pick(glyphs);
          }

          const yTop  = (d.y - d.len) * font;
          const yHead = d.y * font;

          const grad = ctx.createLinearGradient(0, yTop, 0, yHead);
          grad.addColorStop(0.00, `rgba(${colorMix.tailR},${colorMix.tailG},${colorMix.tailB},0.00)`);
          grad.addColorStop(0.55, `rgba(${colorMix.tailR},${colorMix.tailG},${colorMix.tailB},${0.14*layerAlpha})`);
          grad.addColorStop(0.85, `rgba(${colorMix.midR},${colorMix.midG},${colorMix.midB},${0.38*layerAlpha})`);
          grad.addColorStop(1.00, `rgba(${colorMix.headR},${colorMix.headG},${colorMix.headB},${0.96*layerAlpha})`);

          for(let k=0;k<d.len;k++){
            const yy = (d.y - k) * font;
            if(yy < -font || yy > H + font) continue;

            const ch = (k === 0) ? d.ch : pick(glyphs);

            ctx.fillStyle = grad;

            if(k === 0){
              ctx.shadowBlur = glow * 1.25;
              ctx.fillStyle = `rgba(${colorMix.headR},${colorMix.headG},${colorMix.headB},${(0.98*layerAlpha)*headBoost})`;
            } else {
              ctx.shadowBlur = glow;
            }

            ctx.fillText(ch, x, yy);
          }

          d.y += d.speed;
          if(d.y * font > H + d.len * font) d.y = rand(-120, -20);
        }
      }

      function frame(){
        ctx.globalCompositeOperation = "source-over";
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(0,0,0,0.06)";
        ctx.fillRect(0,0,W,H);

        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = "rgba(20, 90, 140, 0.018)";
        ctx.fillRect(0,0,W,H);

        ctx.globalCompositeOperation = "source-over";

        const palette = {
          tailR: 255, tailG: 226, tailB: 120,
          midR:   170, midG: 210, midB: 255,
          headR:   80, headG: 175, headB: 255,
          glowR:  255, glowG: 220, glowB: 120
        };

        drawLayer(dropsB, 0.55, 6, 0.92, palette);
        drawLayer(dropsA, 0.92, 10, 1.06, palette);

        raf = requestAnimationFrame(frame);
      }

      function allReachedBottom(){
        let hits = 0;
        const need = Math.max(6, Math.floor(cols * 0.55));
        for(let i=0; i<dropsA.length; i++){
          if(dropsA[i].y * font > H) hits++;
          if(hits >= need) return true;
        }
        return false;
      }

      function start(){
        wrap.classList.add('is-on');

        resize();
        raf = requestAnimationFrame(frame);

        const stopHard = () => {
          cancelAnimationFrame(raf);
          ctx.clearRect(0,0,W,H);
        };

        const hide = () => {
          wrap.classList.remove('is-on');
          wrap.classList.add('is-off');

          clearTimeout(stopTimer);
          stopTimer = setTimeout(stopHard, fadeOutMs + 120);
        };

        const onLoaded = () => {
          loadedAt = performance.now();

          const tick = () => {
            const now = performance.now();
            const afterLoad = now - loadedAt;

            const hardMax = 5200;

            if((afterLoad >= minTravelMs && allReachedBottom()) || afterLoad >= hardMax){
              hide();
              return;
            }
            requestAnimationFrame(tick);
          };

          requestAnimationFrame(tick);
        };

        window.addEventListener('load', onLoaded, { once:true });

        if(document.readyState === 'complete'){
          setTimeout(onLoaded, 0);
        }

        const nav = document.querySelector('.side-nav');
        if(nav){
          const mo = new MutationObserver(() => {
            const night = nav.classList.contains('hud--night');
            c.style.opacity = night ? '0.98' : '0.92';
            c.style.mixBlendMode = 'screen';
            c.style.filter = night
              ? 'blur(.35px) saturate(1.35) contrast(1.10)'
              : 'blur(.35px) saturate(1.25) contrast(1.06)';
            wrap.style.background = night ? 'rgba(0,0,0,.40)' : 'rgba(0,0,0,.26)';
          });
          mo.observe(nav, { attributes:true, attributeFilter:['class'] });
        }

        window.addEventListener('pagehide', () => {
          clearTimeout(stopTimer);
          stopHard();
        });
      }

      const ro = new ResizeObserver(resize);
      ro.observe(wrap);

      start();
    })();

    // =============== Переходы между страницами (перехват кликов) ===============
    (function pageTransitions(){
      const pt = document.getElementById('pt');
      if(!pt) return;

      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

      function isModifiedClick(e){
        return e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0;
      }
      function samePage(href){
        try{
          const u = new URL(href, location.href);
          return (u.origin === location.origin && u.pathname === location.pathname && u.search === location.search);
        }catch(_){ return true; }
      }

      document.addEventListener('click', (e) => {
        const a = e.target.closest('a[href]');
        if(!a) return;

        const href = a.getAttribute('href');
        if(!href) return;

        if(href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('#')) return;
        if(isModifiedClick(e)) return;

        if(samePage(href) && href.includes('#')) return;
        if(reduce) return;
        if(a.target === '_blank') return;

        e.preventDefault();

        pt.classList.remove('is-entering');
        pt.classList.add('is-leaving');

        const go = () => { location.href = href; };
        setTimeout(go, 420);
        setTimeout(go, 900);
      }, { capture: true });

      window.addEventListener('pageshow', () => {
        if(reduce) return;
        pt.classList.remove('is-leaving');
        pt.classList.add('is-entering');
        setTimeout(() => pt.classList.remove('is-entering'), 520);
      });
    })();
  </script>
</body>
