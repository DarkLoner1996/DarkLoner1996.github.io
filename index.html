<!DOCTYPE html> 
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ТехноКрыльяРоссии</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%;
      height:100%;
      overflow-x:hidden;
      font-family:'Ruslan Display', cursive;
      background:#ddeeff;
    }

    /* ===== NAV (обновлено: синий + белый + золото) ===== */
    :root{
      --nav-blue:#1f4fd8;
      --nav-blue2:#2a66ff;
      --nav-white:rgba(255,255,255,.86);
      --nav-border:rgba(255,255,255,.35);
      --nav-shadow:rgba(0,0,0,.22);
      --nav-gold:#ffd27d;
      --nav-text-dark:#102a68;
    }

    @keyframes fadeInDown {
      from { opacity:0; transform:translateY(-20px); }
      to   { opacity:1; transform:translateY(0); }
    }

    nav {
      position:fixed;
      top:0; left:0;
      width:100%;
      padding:14px 0;
      z-index:1000;

      /* стеклянная панель */
      background:linear-gradient(
        180deg,
        rgba(16,42,104,.32),
        rgba(16,42,104,.18)
      );
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border-bottom:1px solid rgba(255,255,255,.18);
      box-shadow:0 8px 26px var(--nav-shadow);

      animation:fadeInDown 1s ease forwards;
      opacity:0;
    }

    nav ul {
      list-style:none;
      display:flex;
      gap:18px;
      flex-wrap:wrap;
      justify-content:center;
      padding:0 12px;
    }

    /* Кнопки */
    nav ul li a {
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;

      font-size:28px;
      line-height:1;
      padding:12px 18px;
      border-radius:14px;
      text-decoration:none;

      /* читаемость и “премиум” */
      color:var(--nav-text-dark);
      background:var(--nav-white);
      border:1px solid var(--nav-border);
      box-shadow:
        0 10px 22px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.55);

      text-shadow: 0 1px 0 rgba(255,255,255,.35);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease, border-color .18s ease;
      will-change: transform;
    }

    /* лёгкая “золотая” линия снизу (фирменный акцент) */
    nav ul li a::after{
      content:"";
      position:absolute;
      left:12px; right:12px;
      bottom:8px;
      height:2px;
      border-radius:999px;
      background:linear-gradient(90deg, transparent, var(--nav-gold), transparent);
      opacity:.0;
      transition: opacity .18s ease, transform .18s ease;
      transform: translateY(2px);
      pointer-events:none;
    }

    nav ul li a:hover {
      background:linear-gradient(180deg, var(--nav-blue2), var(--nav-blue));
      color:#fff;
      border-color: rgba(255,255,255,.35);

      transform: translateY(-1px) scale(1.05);
      box-shadow:
        0 16px 36px rgba(0,0,0,.28),
        0 0 0 2px rgba(255,210,125,.22);
    }

    nav ul li a:hover::after{
      opacity:1;
      transform: translateY(0);
    }

    nav ul li a:active{
      transform: translateY(0) scale(1.02);
      box-shadow:0 10px 20px rgba(0,0,0,.22);
    }

    /* “Активная” страница: если захочешь — просто добавь class="active" на нужную ссылку */
    nav ul li a.active{
      background:linear-gradient(180deg, var(--nav-blue2), var(--nav-blue));
      color:#fff;
      border-color: rgba(255,255,255,.35);
      box-shadow:
        0 16px 36px rgba(0,0,0,.28),
        0 0 0 2px rgba(255,210,125,.28);
    }
    nav ul li a.active::after{ opacity:1; transform: translateY(0); }

    @media (max-width:768px) {
      nav { padding:10px 0; }
      nav ul { gap:10px; }
      nav ul li a { font-size:18px; padding:9px 12px; border-radius:12px; }
    }

    /* ===== HEADER =====
       Цель: экран заполнен, НО основной постер без зума.
       1) blur слой (cover) — заполняет экран
       2) основной постер (contain) — всегда целиком, без приближения
    */
    .header{
      position:relative;
      width:100%;
      height:100vh;
      min-height:100svh;
      min-height:100dvh;
      overflow:hidden;
      background:#ddeeff;
    }

    /* Подложка: заполняет экран */
    .header__bg-blur{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      filter: blur(22px) saturate(1.15);
      transform: scale(1.12);
      z-index:0;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    /* Основной постер: БЕЗ ЗУМА (всегда целиком) */
    .header__bg{
      position:absolute;
      left:50%;
      top:50%;
      width:100vw;
      height:auto;
      max-height:100vh;
      transform:translate(-50%, -50%);
      z-index:1;
      object-fit:unset;
      pointer-events:none;
      user-select:none;
    }

    /* Лёгкая вуаль + чуть затемняем края */
    .header::after {
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.05), rgba(0,0,0,0.18)),
        rgba(255,255,255,0.05);
      z-index:3;
      pointer-events:none;
    }

    /* ===== Clouds ===== */
    .cloud-left {
      position:absolute; top:0%; left:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      animation:flyLeftToRight 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    .cloud-right {
      position:absolute; top:3%; right:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      transform:scaleX(-1);
      animation:flyRightToLeft 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    @keyframes flyLeftToRight {
      0%,10%   { transform:translateX(0); }
      90%,100% { transform:translateX(calc(100vw + 250px)); }
    }
    @keyframes flyRightToLeft {
      0%,10%   { transform:translateX(0) scaleX(-1); }
      90%,100% { transform:translateX(calc(-100vw - 250px)) scaleX(-1); }
    }

    /* ===== Cubes ===== */
    .cube-container{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(40, minmax(0, 1fr));
      grid-template-rows:repeat(25, minmax(0, 1fr));
      z-index:2;
      pointer-events:none;
    }
    .cube{
      width:100%;
      height:100%;
      background:url('code.webp') no-repeat center/contain;
      opacity:0;
      animation:cubeReveal 1.5s ease forwards;
    }
    @keyframes cubeReveal {
      0%   { transform:translate(var(--tx),var(--ty)) scale(0.1); opacity:0; }
      50%  { transform:translate(0,0) scale(1); opacity:1; }
      100% { transform:translate(0,0) scale(1); opacity:0; }
    }

    /* ===== Grass ===== */
    .grass {
      position:absolute; bottom:0; left:0;
      width:200%; height:50px;
      background:url('grass.gif') repeat-x;
      background-size:contain;
      animation:slowGrass 60s ease-in-out infinite alternate;
      pointer-events:none; z-index:2;
    }
    @keyframes slowGrass {
      from { transform:translateX(0); }
      to   { transform:translateX(-25%); }
    }
  </style>
</head>

<body>
  <nav>
    <ul>
      <li><a href="https://digitalhavenrussia.ru" class="active">Главная</a></li>
      <li><a href="https://digitalhavenrussia.ru/project.html">О проекте</a></li>
      <li><a href="https://digitalhavenrussia.ru/security.html">Мультик</a></li>
      <li><a href="https://digitalhavenrussia.ru/map.html">Маршрут помощи</a></li>
    </ul>
  </nav>

  <div class="header">
    <!-- Подложка (заполняет экран) -->
    <img class="header__bg-blur" src="header-bg-3840.jpg" alt="" aria-hidden="true" decoding="async">

    <!-- Основной постер (всегда целиком, БЕЗ зума) -->
    <img class="header__bg" src="header-bg-3840.jpg" alt="" loading="eager" decoding="async">

    <div class="cloud-left"></div>
    <div class="cloud-right"></div>

    <div class="cube-container" id="cubes"></div>
    <div class="grass"></div>
  </div>

  <script>
    const container = document.getElementById('cubes');
    const cols = 40, rows = 25;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cube = document.createElement('div');
        cube.className = 'cube';
        cube.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
        cube.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
        cube.style.gridColumn = x + 1;
        cube.style.gridRow = y + 1;
        cube.style.animationDelay = (Math.random() * 0.8) + 's';
        container.appendChild(cube);
      }
    }
  </script>
</body>
</html>
