<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ТехноКрыльяРоссии</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    *{ margin:0; padding:0; box-sizing:border-box; }
    html, body{
      width:100%;
      height:100%;
      overflow-x:hidden;
      font-family:'Ruslan Display', cursive;
      background:#ddeeff;
    }

    /* ============================================================
       HUD MENU (как на твоём скрине)
       - мягкое “стекло” + темно-синяя рамка
       - карточки серо-синие с иконкой слева и плашкой справа
       - золотая кнопка “Поддержать проект”
       - тумблер “Ночной HUD” прямо в TAB
       - сворачивание ВПРАВО (панель уезжает за край)
       ============================================================ */

    :root{
      --nav-right: 18px;
      --nav-top: 14px;

      /* TAB */
      --tab-bg1: rgba(255,255,255,.26);
      --tab-bg2: rgba(255,255,255,.12);
      --tab-stroke: rgba(255,255,255,.34);
      --tab-shadow: rgba(0,0,0,.22);

      /* PANEL */
      --panel-bg1: rgba(45, 75, 105, .52);
      --panel-bg2: rgba(25, 48, 75, .34);
      --panel-stroke: rgba(255,255,255,.22);
      --panel-shadow: rgba(0,0,0,.32);

      /* inside frame */
      --frame-stroke: rgba(255,255,255,.16);

      /* ITEMS */
      --item-bg: rgba(210, 220, 230, .22);
      --item-bg2: rgba(255,255,255,.10);
      --item-stroke: rgba(255,255,255,.18);

      --text: rgba(245,250,255,.95);
      --muted: rgba(220,235,255,.78);

      /* tag pills */
      --pill-bg: rgba(220,235,255,.20);
      --pill-stroke: rgba(255,255,255,.22);
      --pill-text: rgba(235,245,255,.88);

      /* “ACTIVE” warm */
      --pill-active-bg: rgba(255, 220, 140, .32);
      --pill-active-text: rgba(255, 240, 210, .92);

      /* CTA */
      --cta-bg1: rgba(255, 232, 170, .98);
      --cta-bg2: rgba(255, 212, 120, .92);
      --cta-text: rgba(60,55,40,.95);

      --radius: 18px;
      --panel-w: 290px;
    }

    /* Ночной HUD (меняем только переменные — стиль остаётся тот же) */
    .hud--night{
      --panel-bg1: rgba(18, 28, 44, .72);
      --panel-bg2: rgba(10, 16, 28, .50);
      --item-bg: rgba(170, 190, 220, .16);
      --item-bg2: rgba(255,255,255,.08);
      --pill-bg: rgba(160, 200, 255, .16);
      --pill-active-bg: rgba(255, 205, 115, .26);
      --tab-bg1: rgba(255,255,255,.18);
      --tab-bg2: rgba(255,255,255,.08);
    }

    .side-nav{
      position:fixed;
      right: var(--nav-right);
      top: var(--nav-top);
      z-index:1000;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-end;
      transform: translateZ(0);
    }

    /* ============ TAB ============ */
    .side-nav__tab{
      display:flex;
      align-items:center;
      gap:10px;

      padding:10px 12px;
      border-radius:16px;
      background: linear-gradient(180deg, var(--tab-bg1), var(--tab-bg2));
      border:1px solid var(--tab-stroke);
      box-shadow: 0 14px 28px var(--tab-shadow), inset 0 1px 0 rgba(255,255,255,.22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      user-select:none;
    }

    .tab-btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:6px 10px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.08);
      color: var(--text);
      cursor:pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
      transition: transform .16s ease, filter .16s ease;
    }
    .tab-btn:hover{ transform: translateY(-1px); filter:saturate(1.05); }
    .tab-btn:focus-visible{ outline:none; box-shadow: 0 0 0 3px rgba(120,195,255,.28), inset 0 1px 0 rgba(255,255,255,.14); }

    .tab-ico{
      width:26px; height:26px;
      border-radius:10px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.20);
      box-shadow: 0 10px 18px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.20);
      color: var(--text);
      font-size:16px;
      line-height:1;
    }
    .tab-title{
      font-size:15px;
      letter-spacing:.12px;
      opacity:.95;
      white-space:nowrap;
    }

    /* Тумблер ночного HUD (как “ползунок” справа в табе) */
    .hud-switch{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 8px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
    }
    .hud-switch .moon{
      width:18px; height:18px;
      border-radius:8px;
      display:grid;
      place-items:center;
      font-size:13px;
      color: rgba(255,255,255,.9);
      opacity:.9;
    }
    .switch{
      width:38px; height:18px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.10);
      position:relative;
      cursor:pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
    }
    .switch::after{
      content:"";
      position:absolute;
      top:2px; left:2px;
      width:14px; height:14px;
      border-radius:50%;
      background: rgba(255,255,255,.85);
      box-shadow: 0 6px 10px rgba(0,0,0,.22);
      transition: left .18s ease, background .18s ease;
    }
    .switch.is-on{
      background: rgba(255, 220, 140, .20);
    }
    .switch.is-on::after{
      left: 22px;
      background: rgba(255, 235, 185, .95);
    }

    /* ============ PANEL ============ */
    .side-nav__panel{
      width: var(--panel-w);
      border-radius: var(--radius);
      padding:12px 12px 14px;

      background: linear-gradient(180deg, var(--panel-bg1), var(--panel-bg2));
      border:1px solid var(--panel-stroke);
      box-shadow: 0 22px 46px var(--panel-shadow), inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      position:relative;
      overflow:hidden;

      transform-origin: top right;
      transition: transform .22s ease, opacity .22s ease, filter .22s ease;
    }

    /* внутренняя рамка, как на скрине */
    .side-nav__panel::before{
      content:"";
      position:absolute;
      inset:10px;
      border-radius: calc(var(--radius) - 8px);
      border:1px solid var(--frame-stroke);
      pointer-events:none;
    }

    /* лёгкие “пупырышки/точки” слева/снизу (очень тихо) */
    .hud-dots{
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.22;
      background:
        radial-gradient(circle at 18px 22px, rgba(255,255,255,.7) 0 1.2px, transparent 2.4px),
        radial-gradient(circle at 22px 60px, rgba(255,255,255,.55) 0 1px, transparent 2.2px),
        radial-gradient(circle at 28px calc(100% - 26px), rgba(255,255,255,.55) 0 1.1px, transparent 2.3px),
        radial-gradient(circle at 52px calc(100% - 18px), rgba(255,255,255,.45) 0 1px, transparent 2.2px);
    }

    .side-nav__list{
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:10px;
      margin:6px 0 12px;
      padding:0;
      position:relative;
      z-index:1;
    }

    .hud-item{
      position:relative;
      display:flex;
      align-items:center;
      gap:12px;

      padding:12px 12px;
      border-radius:14px;

      background: linear-gradient(180deg, var(--item-bg), var(--item-bg2));
      border:1px solid var(--item-stroke);

      box-shadow: 0 10px 18px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.10);
      text-decoration:none;
      color: var(--text);

      overflow:hidden;
      transition: transform .16s ease, filter .16s ease;
    }
    .hud-item:hover{
      transform: translateY(-1px);
      filter:saturate(1.05);
    }
    .hud-item:focus-visible{
      outline:none;
      box-shadow: 0 0 0 3px rgba(120,195,255,.28), 0 10px 18px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.10);
    }

    /* левая вертикальная полоска подсветки */
    .hud-item::before{
      content:"";
      position:absolute;
      left:8px; top:10px; bottom:10px;
      width:3px;
      border-radius:999px;
      background: rgba(255,255,255,.22);
      opacity:.55;
    }
    .hud-item.is-active::before{
      background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,220,140,.55));
      opacity:.9;
    }

    /* Иконка-слот слева */
    .hud-ico{
      width:44px; height:44px;
      border-radius:14px;
      display:grid;
      place-items:center;

      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 8px 14px rgba(0,0,0,.20);

      font-size:20px;
      line-height:1;
      flex: 0 0 auto;
    }

    .hud-txt{
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width:0;
      flex:1 1 auto;
    }
    .hud-title{
      font-size:16px;
      letter-spacing:.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .hud-sub{
      font-size:12px;
      letter-spacing:.15px;
      color: var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      opacity:.95;
    }

    /* правая плашка ACTIVE/INFO/... */
    .hud-pill{
      flex:0 0 auto;
      padding:6px 10px;
      border-radius:12px;
      border:1px solid var(--pill-stroke);
      background: var(--pill-bg);
      color: var(--pill-text);
      font-size:12px;
      letter-spacing:.18em;
      text-transform:uppercase;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
    }
    .hud-pill.active{
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      letter-spacing:.12em;
    }

    /* маленькая стрелка справа как на скрине */
    .hud-chev{
      margin-left:6px;
      color: rgba(255,255,255,.75);
      opacity:.75;
      font-size:18px;
      line-height:1;
      transform: translateY(-1px);
    }

    .side-nav__divider{
      height:1px;
      margin:10px 2px 12px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
      opacity:.9;
      position:relative;
      z-index:1;
    }

    /* CTA снизу — как твоя золотая кнопка */
    .hud-cta{
      position:relative;
      z-index:1;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      height:54px;
      border-radius:16px;

      background: linear-gradient(180deg, var(--cta-bg1), var(--cta-bg2));
      border:1px solid rgba(255,255,255,.38);
      box-shadow: 0 16px 30px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.55);

      color: var(--cta-text);
      text-decoration:none;
      font-size:16px;
      letter-spacing:.12em;
      text-transform:uppercase;

      transition: transform .16s ease, filter .16s ease;
    }
    .hud-cta:hover{ transform: translateY(-1px); filter:saturate(1.05); }
    .hud-cta:focus-visible{
      outline:none;
      box-shadow: 0 0 0 3px rgba(255,220,140,.28), 0 16px 30px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.55);
    }
    .hud-cta .heart{
      width:28px; height:28px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.55);
      border:1px solid rgba(255,255,255,.40);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.55);
      font-size:14px;
    }

    /* ============ collapse to RIGHT ============ */
    .side-nav.is-collapsed .side-nav__panel{
      transform: translateX(calc(100% + 18px));
      opacity:0;
      pointer-events:none;
      filter: blur(1px);
    }

    /* мобилка */
    @media (max-width: 820px){
      :root{ --nav-right: 10px; --nav-top: 10px; --panel-w: 270px; }
      .tab-title{ display:none; } /* чтобы таб был компактнее */
    }

    @media (prefers-reduced-motion: reduce){
      .side-nav__panel, .hud-item, .tab-btn { transition:none; }
    }

    /* ===== HEADER (твой) ===== */
    .header{
      position:relative;
      width:100%;
      height:100vh;
      min-height:100svh;
      min-height:100dvh;
      overflow:hidden;
      background:#ddeeff;
    }
    .header__bg-blur{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      filter: blur(22px) saturate(1.15);
      transform: scale(1.12);
      z-index:0;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }
    .header__bg{
      position:absolute;
      left:50%;
      top:50%;
      width:100vw;
      height:auto;
      max-height:100vh;
      transform:translate(-50%, -50%);
      z-index:1;
      object-fit:unset;
      pointer-events:none;
      user-select:none;
    }
    .header::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.05), rgba(0,0,0,0.18)),
        rgba(255,255,255,0.05);
      z-index:3;
      pointer-events:none;
    }

    .cloud-left{
      position:absolute; top:0%; left:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      animation:flyLeftToRight 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    .cloud-right{
      position:absolute; top:3%; right:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      transform:scaleX(-1);
      animation:flyRightToLeft 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    @keyframes flyLeftToRight{
      0%,10%{ transform:translateX(0); }
      90%,100%{ transform:translateX(calc(100vw + 250px)); }
    }
    @keyframes flyRightToLeft{
      0%,10%{ transform:translateX(0) scaleX(-1); }
      90%,100%{ transform:translateX(calc(-100vw - 250px)) scaleX(-1); }
    }

    .cube-container{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(40, minmax(0, 1fr));
      grid-template-rows:repeat(25, minmax(0, 1fr));
      z-index:2;
      pointer-events:none;
    }
    .cube{
      width:100%;
      height:100%;
      background:url('code.webp') no-repeat center/contain;
      opacity:0;
      animation:cubeReveal 1.5s ease forwards;
    }
    @keyframes cubeReveal{
      0%{ transform:translate(var(--tx),var(--ty)) scale(0.1); opacity:0; }
      50%{ transform:translate(0,0) scale(1); opacity:1; }
      100%{ transform:translate(0,0) scale(1); opacity:0; }
    }

    .grass{
      position:absolute; bottom:0; left:0;
      width:200%; height:50px;
      background:url('grass.gif') repeat-x;
      background-size:contain;
      animation:slowGrass 60s ease-in-out infinite alternate;
      pointer-events:none; z-index:2;
    }
    @keyframes slowGrass{
      from { transform:translateX(0); }
      to   { transform:translateX(-25%); }
    }
  </style>
</head>

<body>

  <!-- HUD MENU -->
  <nav class="side-nav hud--day" aria-label="Навигация">
    <div class="side-nav__tab">
      <button class="tab-btn" id="menuToggle" type="button" aria-expanded="true" aria-controls="hudPanel" title="Свернуть/развернуть">
        <span class="tab-ico" aria-hidden="true">⟩</span>
        <span class="tab-title">Игровое меню</span>
      </button>

      <div class="hud-switch" title="Ночной HUD">
        <span class="moon" aria-hidden="true">🌙</span>
        <div class="switch" id="nightSwitch" role="switch" aria-checked="false" tabindex="0"></div>
      </div>
    </div>

    <div class="side-nav__panel" id="hudPanel">
      <div class="hud-dots" aria-hidden="true"></div>

      <ul class="side-nav__list">
        <li>
          <a class="hud-item is-active" href="https://digitalhavenrussia.ru">
            <span class="hud-ico" aria-hidden="true">🏠</span>
            <span class="hud-txt">
              <span class="hud-title">Главная</span>
              <span class="hud-sub">миссия активна</span>
            </span>
            <span class="hud-pill active">ACTIVE</span>
            <span class="hud-chev" aria-hidden="true">›</span>
          </a>
        </li>

        <li>
          <a class="hud-item" href="https://digitalhavenrussia.ru/project.html">
            <span class="hud-ico" aria-hidden="true">📘</span>
            <span class="hud-txt">
              <span class="hud-title">О проекте</span>
              <span class="hud-sub">брифинг</span>
            </span>
            <span class="hud-pill">INFO</span>
            <span class="hud-chev" aria-hidden="true">›</span>
          </a>
        </li>

        <li>
          <a class="hud-item" href="https://digitalhavenrussia.ru/security.html">
            <span class="hud-ico" aria-hidden="true">🎬</span>
            <span class="hud-txt">
              <span class="hud-title">Мультфильм</span>
              <span class="hud-sub">обучающий контент</span>
            </span>
            <span class="hud-pill">VIDEO</span>
            <span class="hud-chev" aria-hidden="true">›</span>
          </a>
        </li>

        <li>
          <a class="hud-item" href="https://digitalhavenrussia.ru/map.html">
            <span class="hud-ico" aria-hidden="true">🧭</span>
            <span class="hud-txt">
              <span class="hud-title">Маршрут помощи</span>
              <span class="hud-sub">карта операции</span>
            </span>
            <span class="hud-pill">MAP</span>
            <span class="hud-chev" aria-hidden="true">›</span>
          </a>
        </li>
      </ul>

      <div class="side-nav__divider" aria-hidden="true"></div>

      <a class="hud-cta" href="https://digitalhavenrussia.ru/project.html#help">
        <span class="heart" aria-hidden="true">❤</span>
        <span>Поддержать проект</span>
      </a>
    </div>
  </nav>

  <!-- HEADER -->
  <div class="header">
    <img class="header__bg-blur" src="header-bg-3840.jpg" alt="" aria-hidden="true" decoding="async">
    <img class="header__bg" src="header-bg-3840.jpg" alt="" loading="eager" decoding="async">

    <div class="cloud-left"></div>
    <div class="cloud-right"></div>

    <div class="cube-container" id="cubes"></div>
    <div class="grass"></div>
  </div>

  <script>
    // cubes (как у тебя)
    const container = document.getElementById('cubes');
    const cols = 40, rows = 25;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cube = document.createElement('div');
        cube.className = 'cube';
        cube.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
        cube.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
        cube.style.gridColumn = x + 1;
        cube.style.gridRow = y + 1;
        cube.style.animationDelay = (Math.random() * 0.8) + 's';
        container.appendChild(cube);
      }
    }

    // Активный пункт по URL (находит по pathname)
    (function markActive(){
      try{
        const path = location.pathname.replace(/\/+$/, '') || '/';
        const items = document.querySelectorAll('.hud-item');
        items.forEach(a => a.classList.remove('is-active'));

        const rules = [
          { match: ['/', '/index.html'], hrefPart: 'digitalhavenrussia.ru' },
          { match: ['/project.html'], hrefPart: 'project.html' },
          { match: ['/security.html'], hrefPart: 'security.html' },
          { match: ['/map.html'], hrefPart: 'map.html' },
        ];
        const rule = rules.find(r => r.match.includes(path));
        if(!rule) return;

        const active = Array.from(items).find(a => (a.getAttribute('href') || '').includes(rule.hrefPart));
        if(active) active.classList.add('is-active');
      }catch(e){}
    })();

    // Сворачивание ВПРАВО
    (function toggleMenu(){
      const nav = document.querySelector('.side-nav');
      const btn = document.getElementById('menuToggle');
      const ico = btn?.querySelector('.tab-ico');
      if(!nav || !btn || !ico) return;

      btn.addEventListener('click', () => {
        const collapsed = nav.classList.toggle('is-collapsed');
        btn.setAttribute('aria-expanded', String(!collapsed));
        btn.title = collapsed ? 'Развернуть меню' : 'Свернуть меню';
        ico.textContent = collapsed ? '≡' : '⟩';
      });
    })();

    // Ночной HUD (тумблер)
    (function nightHud(){
      const nav = document.querySelector('.side-nav');
      const sw = document.getElementById('nightSwitch');
      if(!nav || !sw) return;

      const setState = (on) => {
        sw.classList.toggle('is-on', on);
        sw.setAttribute('aria-checked', String(on));
        nav.classList.toggle('hud--night', on);
      };

      const toggle = () => setState(!(sw.getAttribute('aria-checked') === 'true'));

      sw.addEventListener('click', toggle);
      sw.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });

      // стартовое состояние (выключено)
      setState(false);
    })();
  </script>
</body>
</html>
