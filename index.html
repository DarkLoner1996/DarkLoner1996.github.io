<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ТехноКрыльяРоссии</title>

<link rel="icon" href="embl.ico">
<link rel="icon" href="embl.png" type="image/png">
<link rel="icon" href="embl.webp" type="image/webp">

<style>
@import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow-x: hidden;
  font-family: 'Ruslan Display', cursive;
  background: #ddeeff;
}

/* ================= NAV ================= */

@keyframes fadeInDown {
  from { opacity:0; transform:translateY(-20px); }
  to   { opacity:1; transform:translateY(0); }
}

nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 15px 0;
  display: flex;
  justify-content: center;
  background: rgba(0,0,0,0.12);
  backdrop-filter: blur(8px);
  z-index: 1000;
  animation: fadeInDown 1s ease forwards;
}

nav ul {
  list-style: none;
  display: flex;
  gap: 40px;
}

nav a {
  color: #d85612;
  font-size: 30px;
  padding: 10px 20px;
  text-decoration: none;
  -webkit-text-stroke: 1px #000;
  text-shadow: 1px 1px 2px #8B0000;
  border-radius: 8px;
  transition: .3s;
}

nav a:hover {
  background: linear-gradient(90deg,#ffcc00,#ff3300);
  color: #000;
  transform: scale(1.1);
}

/* ================= HEADER ================= */

.header {
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
}

/* --- Блюр-подложка (ВСЕГДА cover) --- */
.header__bg-blur {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: blur(20px) saturate(1.15);
  transform: scale(1.1);
  z-index: 0;
}

/* --- ОСНОВНАЯ КАРТИНКА --- */
/* По умолчанию: ЦЕЛИКОМ */
.header__bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  z-index: 1;
}

/* 👉 ДЕСКТОПЫ 16:9 и шире — НА ВЕСЬ ЭКРАН */
@media (min-aspect-ratio: 16/9) {
  .header__bg {
    object-fit: cover;
    object-position: center;
  }
}

/* Лёгкая вуаль */
.header::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.08);
  z-index: 3;
}

/* ================= ОБЛАКА ================= */

.cloud-left, .cloud-right {
  position: absolute;
  top: 2%;
  width: 450px;
  height: 320px;
  background: url('clouds.webp') no-repeat center / contain;
  z-index: 2;
  pointer-events: none;
}

.cloud-left {
  left: -250px;
  animation: cloudLeft 40s linear infinite;
}

.cloud-right {
  right: -250px;
  transform: scaleX(-1);
  animation: cloudRight 40s linear infinite;
}

@keyframes cloudLeft {
  from { transform: translateX(0); }
  to   { transform: translateX(calc(100vw + 250px)); }
}

@keyframes cloudRight {
  from { transform: translateX(0) scaleX(-1); }
  to   { transform: translateX(calc(-100vw - 250px)) scaleX(-1); }
}

/* ================= КУБИКИ ================= */

.cube-container {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(40, minmax(0,1fr));
  grid-template-rows: repeat(25, minmax(0,1fr));
  z-index: 2;
  pointer-events: none;
}

.cube {
  background: url('code.webp') no-repeat center / contain;
  animation: cubeReveal 1.5s ease forwards;
  opacity: 0;
}

@keyframes cubeReveal {
  from { transform: scale(0.1); opacity: 0; }
  to   { transform: scale(1); opacity: 0; }
}

/* ================= ТРАВА ================= */

.grass {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 200%;
  height: 50px;
  background: url('grass.gif') repeat-x;
  background-size: contain;
  animation: grassMove 60s linear infinite;
  z-index: 2;
}

@keyframes grassMove {
  from { transform: translateX(0); }
  to   { transform: translateX(-25%); }
}

/* ================= MOBILE ================= */

@media (max-width: 768px) {
  nav a {
    font-size: 18px;
    padding: 6px 12px;
  }
}
</style>
</head>

<body>

<nav>
  <ul>
    <li><a href="/">Главная</a></li>
    <li><a href="/project.html">О проекте</a></li>
    <li><a href="/security.html">Мультик</a></li>
    <li><a href="/map.html">Маршрут помощи</a></li>
  </ul>
</nav>

<div class="header">

  <!-- Блюр -->
  <img class="header__bg-blur" src="header-bg-3840.webp" alt="">

  <!-- ОСНОВНОЙ ФОН -->
  <img class="header__bg" src="header-bg-3840.webp" alt="">

  <div class="cloud-left"></div>
  <div class="cloud-right"></div>

  <div class="cube-container" id="cubes"></div>

  <div class="grass"></div>
</div>

<script>
const container = document.getElementById('cubes');
for (let i = 0; i < 600; i++) {
  const c = document.createElement('div');
  c.className = 'cube';
  c.style.gridColumn = Math.floor(Math.random()*40)+1;
  c.style.gridRow = Math.floor(Math.random()*25)+1;
  c.style.animationDelay = Math.random() + 's';
  container.appendChild(c);
}
</script>

</body>
</html>
