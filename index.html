<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ТехноКрыльяРоссии</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body{
      width:100%;
      height:100%;
      overflow-x:hidden;
      font-family:'Ruslan Display', cursive;
      background:#ddeeff;
    }

    /* ============================================================
       GAME HUD MENU (справа сверху) — НЕ МЕНЯЕМ КОНЦЕПЦИЮ
       Улучшения:
       ✅ “HUD рамка” (двойной бордер + углы)
       ✅ мягкий неон-глоу (сине-золотой, патриотично)
       ✅ микро-анимации (скан-линия, “пиксельные” искры)
       ✅ CTA как “легендарная кнопка”
       ✅ сворачивание ВПРАВО (уезжает за край), остаётся TAB
       ============================================================ */

    :root{
      --nav-right: 18px;
      --nav-top: 14px;

      --hud-bg1: rgba(255,255,255,.78);
      --hud-bg2: rgba(255,255,255,.54);
      --hud-shadow: rgba(8, 28, 70, .22);

      --text: rgba(18,40,75,.92);
      --muted: rgba(18,40,75,.72);

      --blue: rgba(90,170,255,.55);
      --blue2: rgba(140,210,255,.32);
      --gold: rgba(255,210,125,.95);
      --gold2: rgba(255,236,170,.95);

      --ring: rgba(120,195,255,.35);

      --cta1: rgba(255,244,210,.98);
      --cta2: rgba(255,220,140,.90);

      --radius: 18px;
    }

    .side-nav{
      position:fixed;
      right: var(--nav-right);
      top: var(--nav-top);
      z-index:1000;

      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-end;
    }

    /* TAB (кнопка меню) */
    .side-nav__toggle{
      position:relative;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.65);

      background:
        linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.62));
      box-shadow:
        0 16px 34px rgba(12,38,80,.16),
        inset 0 1px 0 rgba(255,255,255,.90);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      color: var(--text);
      cursor:pointer;
      user-select:none;
      white-space:nowrap;

      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      overflow:hidden;
    }

    /* “скан-линия” в TAB */
    .side-nav__toggle::after{
      content:"";
      position:absolute;
      left:-40%;
      top:-60%;
      width:80%;
      height:220%;
      transform: rotate(22deg);
      background: linear-gradient(90deg, transparent, rgba(120,195,255,.35), transparent);
      opacity:.65;
      animation: tabSweep 3.8s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes tabSweep{
      0%{ transform: translateX(-30%) rotate(22deg); opacity:.0; }
      20%{ opacity:.55; }
      55%{ opacity:.25; }
      100%{ transform: translateX(120%) rotate(22deg); opacity:0; }
    }

    .side-nav__toggle:hover{
      transform: translateY(-1px);
      box-shadow:
        0 20px 40px rgba(12,38,80,.18),
        0 0 0 2px rgba(120,195,255,.14),
        inset 0 1px 0 rgba(255,255,255,.92);
      filter:saturate(1.03);
    }
    .side-nav__toggle:focus-visible{
      outline:none;
      box-shadow:
        0 0 0 3px var(--ring),
        0 20px 40px rgba(12,38,80,.18),
        inset 0 1px 0 rgba(255,255,255,.92);
    }

    .toggle-ico{
      width:26px; height:26px;
      border-radius:10px;
      display:grid; place-items:center;

      background: rgba(255,255,255,.74);
      border:1px solid rgba(255,255,255,.65);
      box-shadow: 0 10px 18px rgba(20,60,120,.10), inset 0 1px 0 rgba(255,255,255,.9);

      font-size:16px;
      line-height:1;
      position:relative;
    }

    /* маленькая “лампа” статуса */
    .toggle-ico::after{
      content:"";
      position:absolute;
      right:-4px;
      top:-4px;
      width:10px;
      height:10px;
      border-radius:50%;
      background: radial-gradient(circle, rgba(255,236,170,1), rgba(255,210,125,.45));
      box-shadow: 0 0 14px rgba(255,210,125,.55);
      opacity:.9;
    }

    .toggle-text{
      font-size:15px;
      letter-spacing:.15px;
      opacity:.9;
      white-space:nowrap;
    }

    /* PANEL (HUD) */
    .side-nav__panel{
      position:relative;
      width: 210px;
      border-radius: var(--radius);
      padding:10px;

      /* двойная “HUD рамка” */
      background:
        linear-gradient(180deg, var(--hud-bg1), var(--hud-bg2)) padding-box,
        linear-gradient(180deg, rgba(90,170,255,.42), rgba(255,210,125,.38)) border-box;
      border:1px solid transparent;

      box-shadow:
        0 22px 50px var(--hud-shadow),
        0 0 0 1px rgba(255,255,255,.32) inset,
        inset 0 1px 0 rgba(255,255,255,.82);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow:hidden;

      transform-origin: top right;
      transition:
        transform .22s ease,
        opacity .22s ease,
        filter .22s ease;
    }

    /* “HUD углы” */
    .side-nav__panel::before{
      content:"";
      position:absolute;
      inset:6px;
      border-radius: calc(var(--radius) - 6px);
      pointer-events:none;
      background:
        linear-gradient(90deg, rgba(90,170,255,.32), transparent 30%, transparent 70%, rgba(255,210,125,.28));
      opacity:.35;
      mix-blend-mode: screen;
    }
    .corner{
      position:absolute;
      width:14px; height:14px;
      border:2px solid rgba(255,255,255,.55);
      opacity:.65;
      pointer-events:none;
      filter: drop-shadow(0 2px 6px rgba(20,60,120,.10));
    }
    .c-tr{ top:8px; right:8px; border-left:none; border-bottom:none; border-top-right-radius:8px; }
    .c-tl{ top:8px; left:8px; border-right:none; border-bottom:none; border-top-left-radius:8px; }
    .c-br{ bottom:8px; right:8px; border-left:none; border-top:none; border-bottom-right-radius:8px; }
    .c-bl{ bottom:8px; left:8px; border-right:none; border-top:none; border-bottom-left-radius:8px; }

    /* пиксельные искры (очень мягко) */
    .hud-sparks{
      position:absolute;
      inset:-20px;
      pointer-events:none;
      opacity:.35;
      background:
        radial-gradient(circle at 18% 20%, rgba(255,255,255,.9) 0 1.5px, transparent 2.8px),
        radial-gradient(circle at 72% 28%, rgba(120,195,255,.9) 0 1.5px, transparent 3px),
        radial-gradient(circle at 86% 62%, rgba(255,210,125,.95) 0 1.7px, transparent 3px),
        radial-gradient(circle at 26% 74%, rgba(255,255,255,.85) 0 1.2px, transparent 2.6px);
      animation: sparksFloat 6s ease-in-out infinite;
      filter: blur(.2px);
    }
    @keyframes sparksFloat{
      0%,100%{ transform: translateY(0); opacity:.28; }
      50%{ transform: translateY(6px); opacity:.40; }
    }

    .side-nav__list{
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:8px;
      margin:0;
      padding:0;
      position:relative;
      z-index:1;
    }

    .side-nav__link{
      position:relative;
      display:flex;
      align-items:center;
      gap:10px;

      height:44px;
      padding:0 12px 0 10px;
      border-radius:14px;

      text-decoration:none;
      color: var(--muted);
      font-size:15px;
      letter-spacing:.15px;

      transition: background .18s ease, transform .18s ease, box-shadow .18s ease, color .18s ease;
      outline:none;
      user-select:none;
      overflow:hidden;
    }

    /* “плитка” иконки как игровые слоты */
    .ico{
      width:38px; height:38px;
      border-radius:12px;
      display:grid; place-items:center;
      flex:0 0 auto;

      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.92), rgba(255,255,255,.45) 55%, rgba(255,255,255,.22)),
        linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.18));
      border:1px solid rgba(255,255,255,.60);
      box-shadow:
        0 10px 18px rgba(20,60,120,.10),
        inset 0 1px 0 rgba(255,255,255,.88);

      font-size:18px;
      color: var(--text);
      position:relative;
    }

    /* тонкий “скан” по пункту на hover */
    .side-nav__link::after{
      content:"";
      position:absolute;
      left:-60%;
      top:-50%;
      width:55%;
      height:220%;
      transform: rotate(22deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
      opacity:0;
      transition: opacity .18s ease;
      pointer-events:none;
    }

    .label{ white-space:nowrap; }

    .side-nav__link:hover{
      background: rgba(255,255,255,.58);
      color: var(--text);
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(20,60,120,.10);
    }
    .side-nav__link:hover::after{
      opacity:.55;
      animation: itemSweep 1.1s ease-out 1;
    }
    @keyframes itemSweep{
      from{ transform: translateX(-10%) rotate(22deg); }
      to{ transform: translateX(220%) rotate(22deg); }
    }

    .side-nav__link:focus-visible{
      box-shadow: 0 0 0 3px var(--ring);
    }

    /* актив */
    .side-nav__link.is-active{
      background: rgba(255,255,255,.72);
      color: var(--text);
      box-shadow: 0 12px 22px rgba(20,60,120,.12);
    }
    .side-nav__link.is-active::before{
      content:"";
      position:absolute;
      left:0;
      top:8px;
      bottom:8px;
      width:3px;
      border-radius:999px;
      background: linear-gradient(180deg, rgba(90,170,255,.85), rgba(255,210,125,.85));
      box-shadow: 0 0 12px rgba(120,195,255,.35);
      opacity:.9;
    }
    .side-nav__link.is-active .ico{
      box-shadow:
        0 14px 24px rgba(20,60,120,.12),
        0 0 0 2px rgba(255,210,125,.22),
        inset 0 1px 0 rgba(255,255,255,.92);
    }

    .side-nav__divider{
      height:1px;
      margin:10px 4px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.78), transparent);
      opacity:.85;
      position:relative;
      z-index:1;
    }

    /* CTA как “легендарная кнопка” */
    .side-nav__cta{
      position:relative;
      z-index:1;

      display:flex;
      align-items:center;
      gap:10px;

      height:46px;
      padding:0 12px 0 10px;
      border-radius:14px;

      background:
        linear-gradient(180deg, var(--cta1), var(--cta2)) padding-box,
        linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,210,125,.55)) border-box;
      border:1px solid transparent;

      box-shadow:
        0 16px 32px rgba(20,60,120,.14),
        inset 0 1px 0 rgba(255,255,255,.92);

      text-decoration:none;
      color: rgba(55,55,55,.96);
      font-size:15px;
      letter-spacing:.1px;

      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      user-select:none;
      white-space:nowrap;
      overflow:hidden;
    }

    .side-nav__cta::after{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.75), transparent 55%),
        linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
      opacity:.35;
      pointer-events:none;
      transform: translateX(-30%);
      animation: ctaGlow 3.4s ease-in-out infinite;
    }
    @keyframes ctaGlow{
      0%,100%{ transform: translateX(-30%); opacity:.22; }
      50%{ transform: translateX(35%); opacity:.45; }
    }

    .side-nav__cta:hover{
      transform: translateY(-1px);
      box-shadow:
        0 20px 40px rgba(20,60,120,.16),
        0 0 0 2px rgba(255,210,125,.20),
        inset 0 1px 0 rgba(255,255,255,.94);
      filter:saturate(1.05);
    }
    .side-nav__cta:focus-visible{
      outline:none;
      box-shadow:
        0 0 0 3px var(--ring),
        0 20px 40px rgba(20,60,120,.16),
        inset 0 1px 0 rgba(255,255,255,.94);
    }
    .side-nav__cta .ico{
      background: rgba(255,255,255,.78);
      font-size:14px;
    }

    /* ===== Сворачивание ВПРАВО =====
       Панель уезжает за правый край, остаётся таб-кнопка */
    .side-nav.is-collapsed .side-nav__panel{
      transform: translateX(calc(100% + 18px));
      opacity: 0;
      pointer-events:none;
      filter: blur(1px);
    }

    /* иконка в TAB: когда развернуто — “убрать вправо” (⟩),
       когда свернуто — “показать” (≡) */
    .side-nav.is-collapsed .toggle-ico{ font-size:15px; }

    /* мобилка */
    @media (max-width: 820px){
      :root{
        --nav-right: 12px;
        --nav-top: 12px;
      }
      .side-nav__panel{ width: 200px; }
      .side-nav__toggle .toggle-text{ display:none; }
    }

    @media (prefers-reduced-motion: reduce){
      .side-nav__panel,
      .side-nav__link,
      .side-nav__cta,
      .side-nav__toggle,
      .hud-sparks{ transition:none; animation:none; }
      .cloud-left, .cloud-right, .grass, .cube{ animation:none !important; }
    }

    /* ===== HEADER (твой) ===== */
    .header{
      position:relative;
      width:100%;
      height:100vh;
      min-height:100svh;
      min-height:100dvh;
      overflow:hidden;
      background:#ddeeff;
    }

    .header__bg-blur{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      filter: blur(22px) saturate(1.15);
      transform: scale(1.12);
      z-index:0;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .header__bg{
      position:absolute;
      left:50%;
      top:50%;
      width:100vw;
      height:auto;
      max-height:100vh;
      transform:translate(-50%, -50%);
      z-index:1;
      object-fit:unset;
      pointer-events:none;
      user-select:none;
    }

    .header::after {
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.05), rgba(0,0,0,0.18)),
        rgba(255,255,255,0.05);
      z-index:3;
      pointer-events:none;
    }

    /* ===== Clouds ===== */
    .cloud-left {
      position:absolute; top:0%; left:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      animation:flyLeftToRight 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    .cloud-right {
      position:absolute; top:3%; right:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      transform:scaleX(-1);
      animation:flyRightToLeft 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    @keyframes flyLeftToRight {
      0%,10%   { transform:translateX(0); }
      90%,100% { transform:translateX(calc(100vw + 250px)); }
    }
    @keyframes flyRightToLeft {
      0%,10%   { transform:translateX(0) scaleX(-1); }
      90%,100% { transform:translateX(calc(-100vw - 250px)) scaleX(-1); }
    }

    /* ===== Cubes ===== */
    .cube-container{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(40, minmax(0, 1fr));
      grid-template-rows:repeat(25, minmax(0, 1fr));
      z-index:2;
      pointer-events:none;
    }
    .cube{
      width:100%;
      height:100%;
      background:url('code.webp') no-repeat center/contain;
      opacity:0;
      animation:cubeReveal 1.5s ease forwards;
    }
    @keyframes cubeReveal {
      0%   { transform:translate(var(--tx),var(--ty)) scale(0.1); opacity:0; }
      50%  { transform:translate(0,0) scale(1); opacity:1; }
      100% { transform:translate(0,0) scale(1); opacity:0; }
    }

    /* ===== Grass ===== */
    .grass {
      position:absolute; bottom:0; left:0;
      width:200%; height:50px;
      background:url('grass.gif') repeat-x;
      background-size:contain;
      animation:slowGrass 60s ease-in-out infinite alternate;
      pointer-events:none; z-index:2;
    }
    @keyframes slowGrass {
      from { transform:translateX(0); }
      to   { transform:translateX(-25%); }
    }
  </style>
</head>

<body>

  <!-- GAME HUD MENU -->
  <nav class="side-nav" aria-label="Навигация">
    <button class="side-nav__toggle" type="button" aria-expanded="true" aria-controls="sideNavPanel" title="Свернуть меню">
      <span class="toggle-ico" aria-hidden="true">⟩</span>
      <span class="toggle-text">Игровое меню</span>
    </button>

    <div class="side-nav__panel" id="sideNavPanel">
      <div class="hud-sparks" aria-hidden="true"></div>
      <span class="corner c-tr" aria-hidden="true"></span>
      <span class="corner c-tl" aria-hidden="true"></span>
      <span class="corner c-br" aria-hidden="true"></span>
      <span class="corner c-bl" aria-hidden="true"></span>

      <ul class="side-nav__list">
        <li>
          <a class="side-nav__link is-active" href="https://digitalhavenrussia.ru">
            <span class="ico" aria-hidden="true">🏠</span>
            <span class="label">Главная</span>
          </a>
        </li>
        <li>
          <a class="side-nav__link" href="https://digitalhavenrussia.ru/project.html">
            <span class="ico" aria-hidden="true">📘</span>
            <span class="label">О проекте</span>
          </a>
        </li>
        <li>
          <a class="side-nav__link" href="https://digitalhavenrussia.ru/security.html">
            <span class="ico" aria-hidden="true">🎬</span>
            <span class="label">Мультфильм</span>
          </a>
        </li>
        <li>
          <a class="side-nav__link" href="https://digitalhavenrussia.ru/map.html">
            <span class="ico" aria-hidden="true">🧭</span>
            <span class="label">Маршрут помощи</span>
          </a>
        </li>
      </ul>

      <div class="side-nav__divider" aria-hidden="true"></div>

      <a class="side-nav__cta" href="https://digitalhavenrussia.ru/project.html#help">
        <span class="ico" aria-hidden="true">❤</span>
        <span class="label">Поддержать</span>
      </a>
    </div>
  </nav>

  <div class="header">
    <img class="header__bg-blur" src="header-bg-3840.jpg" alt="" aria-hidden="true" decoding="async">
    <img class="header__bg" src="header-bg-3840.jpg" alt="" loading="eager" decoding="async">

    <div class="cloud-left"></div>
    <div class="cloud-right"></div>

    <div class="cube-container" id="cubes"></div>
    <div class="grass"></div>
  </div>

  <script>
    // cubes (как у тебя)
    const container = document.getElementById('cubes');
    const cols = 40, rows = 25;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cube = document.createElement('div');
        cube.className = 'cube';
        cube.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
        cube.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
        cube.style.gridColumn = x + 1;
        cube.style.gridRow = y + 1;
        cube.style.animationDelay = (Math.random() * 0.8) + 's';
        container.appendChild(cube);
      }
    }

    // Активный пункт по URL
    (function markActive(){
      try{
        const path = location.pathname.replace(/\/+$/, '');
        const links = document.querySelectorAll('.side-nav__link');
        links.forEach(a => a.classList.remove('is-active'));

        const rules = [
          { match: ['/', '/index.html'], includes: 'digitalhavenrussia.ru' },
          { match: ['/project.html'], includes: 'project.html' },
          { match: ['/security.html'], includes: 'security.html' },
          { match: ['/map.html'], includes: 'map.html' },
        ];

        const rule = rules.find(r => r.match.includes(path));
        if(!rule) return;

        const active = Array.from(links).find(a => a.getAttribute('href')?.includes(rule.includes));
        if(active) active.classList.add('is-active');
      }catch(e){}
    })();

    // Сворачивание ВПРАВО: панель уезжает за край
    (function toggleNav(){
      const nav = document.querySelector('.side-nav');
      const btn = document.querySelector('.side-nav__toggle');
      const ico = btn?.querySelector('.toggle-ico');
      if(!nav || !btn || !ico) return;

      btn.addEventListener('click', () => {
        const collapsed = nav.classList.toggle('is-collapsed');
        btn.setAttribute('aria-expanded', String(!collapsed));
        btn.title = collapsed ? 'Развернуть меню' : 'Свернуть меню';
        // когда свернуто — “≡” (как игровой таб), когда открыто — “⟩”
        ico.textContent = collapsed ? '≡' : '⟩';
      });
    })();
  </script>
</body>
</html>
