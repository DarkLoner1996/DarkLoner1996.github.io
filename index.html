<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ТехноКрыльяРоссии</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    *{ margin:0; padding:0; box-sizing:border-box; }
    html, body{
      width:100%;
      height:100%;
      overflow-x:hidden;
      font-family:'Ruslan Display', cursive;
      background:#ddeeff;
    }

    /* ============================================================
       MENU — "КАК НА КАРТИНКЕ"
       - Золотая рамка с объемом
       - Изумрудное стекло
       - Кнопки-строки с иконкой слева и pill справа
       - Искры/блики
       ============================================================ */

    :root{
      --nav-left: 18px;
      --nav-top: 14px;
      --panel-w: 360px;

      --teal1:#0b5160;
      --teal2:#0f6b7a;
      --teal3:#0a3f4a;
      --glassA: rgba(10, 90, 105, .66);
      --glassB: rgba(8, 55, 65, .64);

      --gold1:#fff2bf;
      --gold2:#f5d57a;
      --gold3:#c8942f;
      --gold4:#7a4a12;

      --text:#f7f2dc;
      --muted: rgba(245,235,210,.80);

      --shadow: rgba(0,0,0,.28);
      --ring: rgba(255,230,160,.28);

      --rowH: 82px;
      --radius: 22px;
    }

    /* контейнер */
    .side-nav{
      position:fixed;
      left: var(--nav-left);
      top: var(--nav-top);
      z-index:1000;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-start;
      transform: translateZ(0);
      user-select:none;
    }

    /* ====== ВЕРХНЯЯ ПОЛОСА (как на картинке) ====== */
    .side-nav__tab{
      width: var(--panel-w);
      border-radius: 20px;
      padding: 10px 12px;
      position:relative;
      overflow:hidden;

      background:
        radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,.16), transparent 60%),
        linear-gradient(180deg, rgba(16,120,140,.55), rgba(8,70,85,.55));

      box-shadow: 0 18px 38px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.16);
    }

    /* золотая рамка сверху */
    .side-nav__tab::before{
      content:"";
      position:absolute; inset:0;
      border-radius: 20px;
      padding: 2px;
      background: linear-gradient(180deg, var(--gold1), var(--gold2) 35%, var(--gold3) 70%, var(--gold4));
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.98;
    }

    /* искры */
    .side-nav__tab::after{
      content:"";
      position:absolute; inset:-40px;
      background:
        radial-gradient(circle at 86% 40%, rgba(255,240,190,.95) 0 2px, transparent 3px),
        radial-gradient(circle at 92% 54%, rgba(255,255,255,.9) 0 1.5px, transparent 3px),
        radial-gradient(circle at 78% 30%, rgba(255,215,120,.85) 0 2px, transparent 4px);
      filter: blur(.1px);
      opacity:.95;
      pointer-events:none;
    }

    .tab-row{
      position:relative;
      z-index:2;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .back-btn{
      width:44px; height:44px;
      border-radius:14px;
      border:1px solid rgba(255,240,190,.35);
      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.16), transparent 62%),
        linear-gradient(180deg, rgba(10,95,110,.55), rgba(6,55,65,.55));
      box-shadow: 0 14px 24px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.14);
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform .16s ease, filter .16s ease;
    }
    .back-btn:hover{ transform: translateY(-1px); filter:saturate(1.04); }
    .back-btn:active{ transform: translateY(0px) scale(.985); }
    .back-btn svg{ width:22px; height:22px; stroke: var(--text); fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; opacity:.95; }

    .tab-title{
      flex:1;
      font-size:20px;
      letter-spacing:.3px;
      color: var(--text);
      text-shadow: 0 2px 0 rgba(0,0,0,.20);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .hud-switch{
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 8px;
      border-radius:16px;
      border:1px solid rgba(255,240,190,.28);
      background: rgba(0,0,0,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
    }
    .hud-switch .moon{
      width:22px; height:22px;
      display:grid; place-items:center;
      border-radius:10px;
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
      font-size:14px;
      color: rgba(255,255,255,.92);
    }
    .switch{
      width:46px; height:22px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      position:relative;
      cursor:pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
      transition: filter .18s ease, transform .12s ease;
    }
    .switch:hover{ filter:saturate(1.05); }
    .switch:active{ transform: scale(.985); }
    .switch::after{
      content:"";
      position:absolute;
      top:2px; left:2px;
      width:18px; height:18px;
      border-radius:50%;
      background: rgba(255,255,255,.88);
      box-shadow: 0 8px 14px rgba(0,0,0,.25);
      transition: left .18s ease, background .18s ease;
    }
    .switch.is-on{
      background: rgba(255,215,120,.20);
      border-color: rgba(255,235,175,.22);
    }
    .switch.is-on::after{
      left:24px;
      background: rgba(255,240,200,.96);
    }

    /* ====== ОСНОВНАЯ ПАНЕЛЬ (золотая рамка + стекло) ====== */
    .side-nav__panel{
      width: var(--panel-w);
      border-radius: var(--radius);
      padding: 14px;
      position:relative;
      overflow:hidden;

      background:
        radial-gradient(140% 120% at 20% 10%, rgba(255,255,255,.16), transparent 62%),
        radial-gradient(120% 100% at 84% 12%, rgba(255,215,120,.14), transparent 60%),
        linear-gradient(180deg, var(--glassA), var(--glassB));

      box-shadow: 0 26px 60px rgba(0,0,0,.26);
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
    }

    /* золотая толстая рамка */
    .side-nav__panel::before{
      content:"";
      position:absolute; inset:0;
      border-radius: var(--radius);
      padding: 4px;
      background:
        linear-gradient(180deg, var(--gold1), var(--gold2) 34%, var(--gold3) 70%, var(--gold4));
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.98;
    }

    /* внутренняя тонкая рамка */
    .side-nav__panel .inner-stroke{
      position:absolute;
      inset: 10px;
      border-radius: calc(var(--radius) - 10px);
      border: 1px solid rgba(255,240,190,.22);
      pointer-events:none;
      z-index:1;
    }

    /* орнаменты по углам */
    .orn{
      position:absolute;
      width:42px; height:42px;
      z-index:2;
      opacity:.95;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.22));
      pointer-events:none;
    }
    .orn svg{ width:100%; height:100%; }
    .orn path{
      fill:none;
      stroke: rgba(255,220,140,.92);
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .orn.tl{ left:8px; top:8px; transform: rotate(0deg); }
    .orn.tr{ right:8px; top:8px; transform: rotate(90deg); }
    .orn.bl{ left:8px; bottom:8px; transform: rotate(-90deg); }
    .orn.br{ right:8px; bottom:8px; transform: rotate(180deg); }

    /* искры на панели */
    .sparkles{
      position:absolute;
      inset:-40px;
      z-index:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 92% 20%, rgba(255,240,190,.95) 0 2px, transparent 4px),
        radial-gradient(circle at 88% 28%, rgba(255,255,255,.90) 0 1.5px, transparent 3px),
        radial-gradient(circle at 78% 18%, rgba(255,215,120,.85) 0 2px, transparent 4px),
        radial-gradient(circle at 12% 72%, rgba(255,255,255,.20) 0 2px, transparent 5px);
      opacity:.9;
      filter: blur(.15px);
      mix-blend-mode: screen;
    }

    .side-nav__list{
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:12px;
      margin: 6px 0 14px;
      padding:0;
      position:relative;
      z-index:3;
    }

    /* ====== ПОЛОСЫ-КНОПКИ (как на картинке) ====== */
    .hud-item{
      height: var(--rowH);
      border-radius: 18px;
      padding: 12px 14px;
      display:flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      color: var(--text);
      position:relative;
      overflow:hidden;

      background:
        radial-gradient(120% 140% at 25% 20%, rgba(255,255,255,.14), transparent 58%),
        linear-gradient(180deg, rgba(14,120,140,.40), rgba(6,70,85,.36));
      box-shadow:
        0 14px 26px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.14);

      border:1px solid rgba(255,240,190,.22);

      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }

    /* золотой кант внутри строки */
    .hud-item::before{
      content:"";
      position:absolute; inset:0;
      border-radius: 18px;
      padding: 2px;
      background: linear-gradient(180deg, rgba(255,245,205,.70), rgba(245,205,120,.38) 45%, rgba(180,120,35,.28));
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.9;
    }

    /* активная строка — теплее/ярче */
    .hud-item.is-active{
      background:
        radial-gradient(120% 140% at 25% 20%, rgba(255,255,255,.18), transparent 56%),
        linear-gradient(180deg, rgba(28,150,170,.42), rgba(8,80,95,.38));
      box-shadow:
        0 18px 34px rgba(0,0,0,.26),
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 0 18px rgba(255,220,140,.12);
    }

    .hud-item:hover{
      transform: translateY(-1px);
      filter:saturate(1.05);
      box-shadow:
        0 20px 40px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.18);
    }
    .hud-item:active{ transform: translateY(0px) scale(.992); }
    .hud-item:focus-visible{
      outline:none;
      box-shadow:
        0 0 0 3px var(--ring),
        0 20px 40px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.18);
    }

    /* слева круглая иконка */
    .hud-ico{
      width:56px; height:56px;
      border-radius: 18px;
      display:grid;
      place-items:center;
      flex:0 0 auto;

      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.14), transparent 62%),
        linear-gradient(180deg, rgba(0,0,0,.12), rgba(0,0,0,.18));
      border:1px solid rgba(255,240,190,.20);

      box-shadow:
        0 14px 22px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.12);
    }

    .hud-ico svg{
      width:28px; height:28px;
      stroke: rgba(255,245,220,.95);
      fill:none;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
      filter: drop-shadow(0 2px 0 rgba(0,0,0,.20));
    }

    .hud-txt{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
      flex:1 1 auto;
    }

    .hud-title{
      font-size:22px;
      letter-spacing:.8px;
      text-transform:uppercase;
      line-height:1.0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      text-shadow: 0 2px 0 rgba(0,0,0,.22);
    }

    .hud-sub{
      font-size:14px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color: var(--muted);
      opacity:.92;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* справа pill-кнопка (ACTIVE/INFO/VIDEO/MAP) */
    .hud-pill{
      flex:0 0 auto;
      min-width: 92px;
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      font-size:14px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color: rgba(245,250,255,.96);

      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.18), transparent 60%),
        linear-gradient(180deg, rgba(35,140,175,.88), rgba(20,90,125,.86));
      border:1px solid rgba(255,240,190,.20);

      box-shadow:
        0 14px 22px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.18);

      position:relative;
      overflow:hidden;
    }

    /* стрелка внутри pill */
    .hud-pill::after{
      content:"›";
      font-size:20px;
      line-height:1;
      opacity:.85;
      transform: translateY(-1px);
      margin-left:2px;
    }

    /* ACTIVE — золотой */
    .hud-pill.active{
      color: rgba(70,55,28,.95);
      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.24), transparent 60%),
        linear-gradient(180deg, rgba(255,240,190,.98), rgba(245,200,110,.96));
      border-color: rgba(255,255,255,.34);
      box-shadow:
        0 16px 26px rgba(0,0,0,.24),
        inset 0 1px 0 rgba(255,255,255,.55);
    }
    .hud-pill.active::after{ opacity:.65; }

    /* нижняя большая кнопка */
    .hud-cta{
      position:relative;
      z-index:3;
      height: 70px;
      border-radius: 20px;
      display:flex;
      align-items:center;
      gap:14px;
      justify-content:flex-start;
      padding: 0 18px;

      text-decoration:none;
      color: rgba(70,55,28,.95);
      text-transform:uppercase;
      letter-spacing:.10em;
      font-size:20px;

      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.24), transparent 62%),
        linear-gradient(180deg, rgba(255,240,195,.98), rgba(245,200,110,.96));
      border:1px solid rgba(255,255,255,.42);
      box-shadow: 0 22px 42px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.55);

      overflow:hidden;
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }
    .hud-cta::before{
      content:"";
      position:absolute; inset:0;
      border-radius: 20px;
      padding: 2px;
      background: linear-gradient(180deg, rgba(255,255,255,.72), rgba(245,205,120,.50), rgba(140,90,18,.32));
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.85;
    }
    .hud-cta:hover{ transform: translateY(-1px); filter:saturate(1.04); box-shadow: 0 26px 50px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.58); }
    .hud-cta:active{ transform: translateY(0px) scale(.992); }

    .hud-cta .heart{
      width:44px; height:44px;
      border-radius: 16px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(255,255,255,.40);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.55);
      flex:0 0 auto;
      position:relative;
      z-index:2;
    }
    .hud-cta .heart svg{
      width:22px; height:22px;
      stroke: rgba(70,55,28,.90);
      fill:none;
      stroke-width:2.4;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    /* свернуть/развернуть (уезжает влево) */
    .side-nav.is-collapsed .side-nav__panel{
      transform: translateX(calc(-100% - 18px));
      opacity:0;
      pointer-events:none;
      filter: blur(1px);
      transition: transform .22s ease, opacity .22s ease, filter .22s ease;
    }
    .side-nav__panel{
      transition: transform .22s ease, opacity .22s ease, filter .22s ease;
    }

    /* Ночной режим — просто глубже/темнее */
    .hud--night{
      --glassA: rgba(6, 32, 40, .78);
      --glassB: rgba(2, 18, 24, .70);
    }

    @media (max-width: 820px){
      :root{ --nav-left: 10px; --nav-top: 10px; --panel-w: 330px; }
      .tab-title{ font-size:18px; }
    }

    @media (prefers-reduced-motion: reduce){
      .hud-item, .hud-cta, .switch, .back-btn { transition:none !important; }
      .side-nav__panel{ transition:none !important; }
    }

    /* ===== HEADER (твой, без изменений) ===== */
    .header{
      position:relative;
      width:100%;
      height:100vh;
      min-height:100svh;
      min-height:100dvh;
      overflow:hidden;
      background:#ddeeff;
    }
    .header__bg-blur{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      filter: blur(22px) saturate(1.15);
      transform: scale(1.12);
      z-index:0;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }
    .header__bg{
      position:absolute;
      left:50%;
      top:50%;
      width:100vw;
      height:auto;
      max-height:100vh;
      transform:translate(-50%, -50%);
      z-index:1;
      object-fit:unset;
      pointer-events:none;
      user-select:none;
    }
    .header::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.05), rgba(0,0,0,0.18)),
        rgba(255,255,255,0.05);
      z-index:3;
      pointer-events:none;
    }

    .cloud-left{
      position:absolute; top:0%; left:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      animation:flyLeftToRight 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    .cloud-right{
      position:absolute; top:3%; right:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      transform:scaleX(-1);
      animation:flyRightToLeft 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    @keyframes flyLeftToRight{
      0%,10%{ transform:translateX(0); }
      90%,100%{ transform:translateX(calc(100vw + 250px)); }
    }
    @keyframes flyRightToLeft{
      0%,10%{ transform:translateX(0) scaleX(-1); }
      90%,100%{ transform:translateX(calc(-100vw - 250px)) scaleX(-1); }
    }

    .cube-container{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(40, minmax(0, 1fr));
      grid-template-rows:repeat(25, minmax(0, 1fr));
      z-index:2;
      pointer-events:none;
    }
    .cube{
      width:100%;
      height:100%;
      background:url('code.webp') no-repeat center/contain;
      opacity:0;
      animation:cubeReveal 1.5s ease forwards;
    }
    @keyframes cubeReveal{
      0%{ transform:translate(var(--tx),var(--ty)) scale(0.1); opacity:0; }
      50%{ transform:translate(0,0) scale(1); opacity:1; }
      100%{ transform:translate(0,0) scale(1); opacity:0; }
    }

    .grass{
      position:absolute; bottom:0; left:0;
      width:200%; height:50px;
      background:url('grass.gif') repeat-x;
      background-size:contain;
      animation:slowGrass 60s ease-in-out infinite alternate;
      pointer-events:none; z-index:2;
    }
    @keyframes slowGrass{
      from { transform:translateX(0); }
      to   { transform:translateX(-25%); }
    }
  </style>
</head>

<body>

  <!-- MENU -->
  <nav class="side-nav hud--day" aria-label="Навигация">
    <div class="side-nav__tab">
      <div class="tab-row">
        <!-- на картинке кнопка "назад" -->
        <button class="back-btn" id="menuToggle" type="button" aria-expanded="true" aria-controls="hudPanel" title="Свернуть/развернуть">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14.5 6.5 8.5 12l6 5.5"></path>
          </svg>
        </button>

        <div class="tab-title">Игровое меню</div>

        <div class="hud-switch" title="Ночной режим">
          <span class="moon" aria-hidden="true">🌙</span>
          <div class="switch" id="nightSwitch" role="switch" aria-checked="false" tabindex="0"></div>
        </div>
      </div>
    </div>

    <div class="side-nav__panel" id="hudPanel">
      <div class="sparkles" aria-hidden="true"></div>
      <div class="inner-stroke" aria-hidden="true"></div>

      <!-- угловые орнаменты -->
      <div class="orn tl" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <path d="M40 10c-8 0-12 4-14 12-2-8-6-12-14-12M10 40c8 0 12-4 14-12 2 8 6 12 14 12"></path>

  <script>
    // cubes (как у тебя)
    const container = document.getElementById('cubes');
    const cols = 40, rows = 25;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cube = document.createElement('div');
        cube.className = 'cube';
        cube.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
        cube.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
        cube.style.gridColumn = x + 1;
        cube.style.gridRow = y + 1;
        cube.style.animationDelay = (Math.random() * 0.8) + 's';
        container.appendChild(cube);
      }
    }

    // Активный пункт по URL
    (function markActive(){
      try{
        const path = location.pathname.replace(/\/+$/, '') || '/';
        const items = document.querySelectorAll('.hud-item');
        items.forEach(a => a.classList.remove('is-active'));

        const rules = [
          { match: ['/', '/index.html'], hrefPart: 'digitalhavenrussia.ru' },
          { match: ['/project.html'], hrefPart: 'project.html' },
          { match: ['/security.html'], hrefPart: 'security.html' },
          { match: ['/map.html'], hrefPart: 'map.html' },
        ];
        const rule = rules.find(r => r.match.includes(path));
        if(!rule) return;

        const active = Array.from(items).find(a => (a.getAttribute('href') || '').includes(rule.hrefPart));
        if(active) active.classList.add('is-active');
      }catch(e){}
    })();

    // Сворачивание ВЛЕВО
    (function toggleMenu(){
      const nav = document.querySelector('.side-nav');
      const btn = document.getElementById('menuToggle');
      if(!nav || !btn) return;

      btn.addEventListener('click', () => {
        const collapsed = nav.classList.toggle('is-collapsed');
        btn.setAttribute('aria-expanded', String(!collapsed));
        btn.title = collapsed ? 'Развернуть меню' : 'Свернуть меню';
      });
    })();

    // Ночной режим
    (function nightHud(){
      const nav = document.querySelector('.side-nav');
      const sw = document.getElementById('nightSwitch');
      if(!nav || !sw) return;

      const setState = (on) => {
        sw.classList.toggle('is-on', on);
        sw.setAttribute('aria-checked', String(on));
        nav.classList.toggle('hud--night', on);
      };

      const toggle = () => setState(!(sw.getAttribute('aria-checked') === 'true'));

      sw.addEventListener('click', toggle);
      sw.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });

      setState(false);
    })();
  </script>
