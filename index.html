<!DOCTYPE html>  
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ТехноКрыльяРоссии</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    *{ margin:0; padding:0; box-sizing:border-box; }
    html, body{
      width:100%;
      height:100%;
      overflow-x:hidden;
      font-family:'Ruslan Display', cursive;
      background:#ddeeff;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
    }

    :root{
      --nav-left: 18px;
      --nav-top: 14px;
      --panel-w: min(440px, calc(100vw - 36px));

      --text: rgba(250,244,232,.96);
      --muted: rgba(245,235,210,.78);

      --gA: rgba(90, 170, 195, .42);
      --gB: rgba(35, 120, 145, .34);

      --iA: rgba(255,255,255,.14);
      --iB: rgba(0,0,0,.06);

      --goldA:#fff2c9;
      --goldB:#f2d07a;
      --goldC:#c58a2c;
      --goldD:#7a4a12;

      --blueP1: rgba(65, 175, 220, .92);
      --blueP2: rgba(30, 120, 170, .92);

      --actP1: rgba(255, 242, 205, .98);
      --actP2: rgba(245, 206, 120, .98);

      --shadow: rgba(0,0,0,.24);
      --ring: rgba(255,230,160,.22);

      --radius: 26px;
      --rowH: clamp(72px, 10vw, 84px);
    }

    .side-nav{
      position:fixed;
      left: var(--nav-left);
      top: var(--nav-top);
      z-index:1000;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-start;
      transform: translateZ(0);
      user-select:none;
    }

    /* =============== TOP BAR =============== */
    .side-nav__tab{
      width: var(--panel-w);
      border-radius: 22px;
      padding: 10px 12px;
      position:relative;
      overflow:hidden;

      background:
        radial-gradient(120% 120% at 30% 22%, rgba(255,255,255,.18), transparent 60%),
        radial-gradient(110% 80% at 84% 18%, rgba(255,215,120,.16), transparent 58%),
        linear-gradient(180deg, rgba(16,120,140,.52), rgba(7,65,78,.48));

      box-shadow: 0 16px 32px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.18);
    }
    .side-nav__tab::before{
      content:"";
      position:absolute; inset:0;
      border-radius: 22px;
      padding: 2px;
      background: linear-gradient(180deg, var(--goldA), var(--goldB) 35%, var(--goldC) 70%, var(--goldD));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.92;
    }

    .tab-row{
      position:relative;
      z-index:2;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .back-btn{
      width:46px; height:46px;
      border-radius:16px;
      border:1px solid rgba(255,240,190,.30);
      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.16), transparent 62%),
        linear-gradient(180deg, rgba(10,95,110,.50), rgba(6,55,65,.48));
      box-shadow: 0 12px 20px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.14);
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform .16s ease, filter .16s ease;
      flex:0 0 auto;
    }
    .back-btn:hover{ transform: translateY(-1px); filter:saturate(1.04); }
    .back-btn:active{ transform: translateY(0px) scale(.985); }
    .back-btn svg{ width:22px; height:22px; stroke: var(--text); fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; opacity:.96; }

    .tab-title{
      flex:1 1 auto;
      min-width:0;
      font-size: clamp(18px, 3.8vw, 22px);
      letter-spacing:.20px;
      color: var(--text);
      text-shadow: 0 1px 0 rgba(0,0,0,.18);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      padding-left:2px;
    }

    .hud-switch{
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 8px;
      border-radius:16px;
      border:1px solid rgba(255,240,190,.24);
      background: rgba(0,0,0,.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
      flex:0 0 auto;
    }
    .hud-switch .moon{
      width:22px; height:22px;
      display:grid; place-items:center;
      border-radius:10px;
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
      font-size:14px;
      color: rgba(255,255,255,.92);
    }
    .switch{
      width:46px; height:22px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      position:relative;
      cursor:pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
      transition: filter .18s ease, transform .12s ease;
    }
    .switch:hover{ filter:saturate(1.05); }
    .switch:active{ transform: scale(.985); }
    .switch::after{
      content:"";
      position:absolute;
      top:2px; left:2px;
      width:18px; height:18px;
      border-radius:50%;
      background: rgba(255,255,255,.88);
      box-shadow: 0 8px 14px rgba(0,0,0,.22);
      transition: left .18s ease, background .18s ease;
    }
    .switch.is-on{
      background: rgba(255,215,120,.18);
      border-color: rgba(255,235,175,.20);
    }
    .switch.is-on::after{
      left:24px;
      background: rgba(255,240,200,.96);
    }

    /* =============== PANEL =============== */
    .side-nav__panel{
      width: var(--panel-w);
      border-radius: var(--radius);
      padding: 14px 14px 16px;
      position:relative;
      overflow:hidden;

      background:
        radial-gradient(140% 120% at 20% 10%, rgba(255,255,255,.18), transparent 62%),
        radial-gradient(120% 100% at 84% 12%, rgba(255,215,120,.12), transparent 60%),
        linear-gradient(180deg, var(--gA), var(--gB));

      box-shadow: 0 18px 44px rgba(0,0,0,.22);
      backdrop-filter: blur(14px) saturate(1.12);
      -webkit-backdrop-filter: blur(14px) saturate(1.12);
    }
    .side-nav__panel::before{
      content:"";
      position:absolute; inset:0;
      border-radius: var(--radius);
      padding: 4px;
      background: linear-gradient(180deg, var(--goldA), var(--goldB) 34%, var(--goldC) 70%, var(--goldD));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.88;
    }
    .inner-stroke{
      position:absolute;
      inset: 10px;
      border-radius: calc(var(--radius) - 10px);
      border: 1px solid rgba(255,240,190,.20);
      pointer-events:none;
      z-index:1;
    }
    .sparkles{
      position:absolute;
      inset:-40px;
      z-index:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 92% 16%, rgba(255,240,190,.90) 0 2px, transparent 4px),
        radial-gradient(circle at 88% 26%, rgba(255,255,255,.80) 0 1.5px, transparent 3px),
        radial-gradient(circle at 78% 18%, rgba(255,215,120,.80) 0 2px, transparent 4px),
        radial-gradient(circle at 16% 72%, rgba(255,255,255,.14) 0 2px, transparent 5px);
      opacity:.80;
      filter: blur(.15px);
      mix-blend-mode: normal;
    }

    .side-nav__list{
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:12px;
      margin: 8px 0 14px;
      padding:0;
      position:relative;
      z-index:3;
    }

    /* =============== ITEM ROW =============== */
    .hud-item{
      height: var(--rowH);
      border-radius: 20px;
      padding: 12px 14px;
      display:flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      color: var(--text);
      position:relative;
      overflow:hidden;

      background:
        radial-gradient(120% 140% at 25% 20%, rgba(255,255,255,.16), transparent 58%),
        linear-gradient(180deg, var(--iA), var(--iB));

      box-shadow: 0 10px 20px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.12);
      border:1px solid rgba(255,240,190,.18);

      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }
    .hud-item::before{
      content:"";
      position:absolute; inset:0;
      border-radius: 20px;
      padding: 2px;
      background: linear-gradient(180deg, rgba(255,245,205,.60), rgba(245,205,120,.30) 45%, rgba(180,120,35,.22));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.88;
    }

    /* ✅ маркер слева */
    .hud-item::after{
      content:"";
      position:absolute;
      left: 10px;
      top: 50%;
      width: 10px;
      height: 10px;
      transform: translateY(-50%) rotate(45deg);
      border-radius: 2px;
      background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.08));
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 10px 16px rgba(0,0,0,.16);
      opacity:.86;
    }
    .hud-item.is-active::after{
      background: linear-gradient(180deg, rgba(255,240,195,.95), rgba(245,206,120,.86));
      border-color: rgba(255,255,255,.32);
      box-shadow: 0 0 10px rgba(255,220,140,.16), 0 10px 16px rgba(0,0,0,.16);
      opacity:1;
    }
    .hud-item.is-active{
      box-shadow: 0 14px 28px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.16), inset 0 0 18px rgba(255,220,140,.10);
    }
    .hud-item:hover{
      transform: translateY(-1px);
      filter:saturate(1.05);
      box-shadow: 0 18px 34px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.16);
    }
    .hud-item:active{ transform: translateY(0px) scale(.992); }
    .hud-item:focus-visible{
      outline:none;
      box-shadow: 0 0 0 3px var(--ring), 0 18px 34px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.16);
    }

    /* ✅ отступ между маркером и иконкой */
    .hud-ico{
      width: clamp(50px, 11vw, 58px);
      height: clamp(50px, 11vw, 58px);
      border-radius: 18px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      margin-left: 20px;

      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.14), transparent 62%),
        linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.14));
      border:1px solid rgba(255,240,190,.18);
      box-shadow: 0 12px 18px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.12);
    }
    .hud-ico svg{
      width: clamp(24px, 6vw, 30px);
      height: clamp(24px, 6vw, 30px);
      stroke: rgba(255,245,220,.95);
      fill:none;
      stroke-width:2.3;
      stroke-linecap:round;
      stroke-linejoin:round;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.18));
    }

    .hud-txt{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
      flex:1 1 auto;
    }

    .hud-title{
      font-size: clamp(16px, 3.6vw, 20px);
      letter-spacing: .03em;
      text-transform: uppercase;
      line-height: 1.02;
      text-shadow: 0 1px 0 rgba(0,0,0,.18);

      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
      overflow: hidden;
    }

    .hud-sub{
      font-size: clamp(10px, 2.4vw, 12px);
      letter-spacing:.08em;
      text-transform:uppercase;
      color: var(--muted);
      opacity:.88;

      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
      overflow:hidden;
    }

    .hud-title--split{
      display:flex;
      flex-direction:column;
      gap:2px;
      line-height:1.02;
    }
    .hud-title--split > span{ display:block; }

    .hud-pill{
      flex:0 0 auto;
      min-width: clamp(84px, 20vw, 110px);
      height: clamp(32px, 7.8vw, 38px);
      padding: 0 12px;
      border-radius: 999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      font-size: clamp(11px, 2.8vw, 14px);
      letter-spacing:.16em;
      text-transform:uppercase;
      color: rgba(245,250,255,.96);

      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.18), transparent 60%),
        linear-gradient(180deg, var(--blueP1), var(--blueP2));
      border:1px solid rgba(255,240,190,.18);

      box-shadow:
        0 12px 18px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.20);

      position:relative;
      overflow:hidden;

      backdrop-filter: blur(6px) saturate(1.05);
      -webkit-backdrop-filter: blur(6px) saturate(1.05);
    }
    .hud-pill::after{
      content:"›";
      font-size: clamp(18px, 4.2vw, 22px);
      line-height:1;
      opacity:.88;
      transform: translateY(-1px);
      margin-left:2px;
    }
    .hud-pill.active{
      color: rgba(70,55,28,.95);
      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.26), transparent 60%),
        linear-gradient(180deg, var(--actP1), var(--actP2));
      border-color: rgba(255,255,255,.32);
      box-shadow:
        0 14px 22px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.58);
    }
    .hud-pill.active::after{ opacity:.62; }
    .hud-item:hover .hud-pill{
      filter:saturate(1.06);
      transform: translateY(-1px);
      transition: transform .16s ease, filter .16s ease;
    }

    /* =============== CTA =============== */
    .hud-cta{
      position:relative;
      z-index:3;

      height: clamp(64px, 14vw, 74px);
      border-radius: 22px;
      display:flex;
      align-items:center;
      gap:12px;
      justify-content:flex-start;

      padding: 0 58px 0 18px;

      text-decoration:none;
      color: rgba(70,55,28,.95);
      text-transform:uppercase;
      letter-spacing:.10em;
      font-size: clamp(16px, 4.1vw, 21px);

      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.26), transparent 62%),
        linear-gradient(180deg, rgba(255,240,195,.98), rgba(245,206,120,.98));
      border:1px solid rgba(255,255,255,.44);
      box-shadow: 0 20px 38px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.58);

      overflow:hidden;
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }
    .hud-cta::before{
      content:"";
      position:absolute; inset:0;
      border-radius: 22px;
      padding: 2px;
      background: linear-gradient(180deg, rgba(255,255,255,.78), rgba(245,205,120,.52), rgba(140,90,18,.34));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.88;
    }

    .cta-text{
      flex:1 1 auto;
      min-width:0;
      padding-right:10px;
    }

    .cta-gem{
      position:absolute;
      top:50%;
      width:16px; height:16px;
      transform: translateY(-50%) rotate(45deg);
      border-radius: 4px;
      opacity:.90;
      pointer-events:none;

      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), transparent 48%),
        linear-gradient(180deg, rgba(120, 230, 255, .92), rgba(40, 150, 210, .92));
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: 0 10px 16px rgba(0,0,0,.18);
    }
    .cta-gem.left{ display:none; }
    .cta-gem.right{ right: 14px; }

    .hud-cta:hover{
      transform: translateY(-1px);
      filter:saturate(1.04);
      box-shadow: 0 24px 46px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.60);
    }
    .hud-cta:active{ transform: translateY(0px) scale(.992); }

    .hud-cta .heart{
      width:44px;
      height:44px;
      border-radius: 14px;
      display:grid;
      place-items:center;

      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.70), rgba(255,255,255,.35) 55%, rgba(255,255,255,.18));
      border:1px solid rgba(255,255,255,.55);
      box-shadow:
        0 10px 18px rgba(0,0,0,.14),
        inset 0 1px 0 rgba(255,255,255,.70);

      flex:0 0 auto;
      position:relative;
      z-index:2;
      margin-left: 2px;
    }
    .hud-cta .heart svg{
      width:20px; height:20px;
      stroke: rgba(70,55,28,.92);
      fill:none;
      stroke-width:2.6;
      stroke-linecap:round;
      stroke-linejoin:round;
      filter: drop-shadow(0 1px 0 rgba(255,255,255,.35));
    }

    /* =============== COLLAPSE =============== */
    .side-nav.is-collapsed .side-nav__panel{
      transform: translateX(calc(-100% - 18px));
      opacity:0;
      pointer-events:none;
      filter: blur(1px);
      transition: transform .22s ease, opacity .22s ease, filter .22s ease;
    }
    .side-nav__panel{ transition: transform .22s ease, opacity .22s ease, filter .22s ease; }

    /* =============== NIGHT =============== */
    .hud--night{
      --gA: rgba(18, 55, 70, .62);
      --gB: rgba(8, 30, 40, .54);
      --iA: rgba(255,255,255,.12);
      --iB: rgba(0,0,0,.10);
    }

    @media (max-width: 520px){
      .hud-title{ -webkit-line-clamp: 2; }
      .hud-sub{ -webkit-line-clamp: 1; }
      .hud-pill{ min-width: 86px; }
      .hud-ico{ margin-left: 18px; }
    }

    @media (prefers-reduced-motion: reduce){
      .hud-item, .hud-cta, .switch, .back-btn { transition:none !important; }
      .side-nav__panel{ transition:none !important; }
    }

    /* ===== HEADER (исправлено: без "сосиски") ===== */
    .header{
      position:relative;
      width:100%;

      /* было height:100vh (жестко), теперь нормальная высота + можно скролл */
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;

      overflow:hidden;
      background:#ddeeff;
    }

    /* блюр-слой пусть заполняет экран красиво */
    .header__bg-blur{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      filter: blur(22px) saturate(1.15);
      transform: scale(1.12);
      z-index:0;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    /* ✅ ГЛАВНОЕ: картинка больше НЕ искажается */
    .header__bg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;

      /* прозрачные поля по краям вместо сплющивания */
      object-fit: contain;
      object-position: center;

      z-index:1;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .header::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.05), rgba(0,0,0,0.18)),
        rgba(255,255,255,0.05);
      z-index:3;
      pointer-events:none;
    }

    .cube-container{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(40, minmax(0, 1fr));
      grid-template-rows:repeat(25, minmax(0, 1fr));
      z-index:2;
      pointer-events:none;
    }
    .cube{
      width:100%;
      height:100%;
      background:url('code.webp') no-repeat center/contain;
      opacity:0;
      animation:cubeReveal 1.5s ease forwards;
    }
    @keyframes cubeReveal{
      0%{ transform:translate(var(--tx),var(--ty)) scale(0.1); opacity:0; }
      50%{ transform:translate(0,0) scale(1); opacity:1; }
      100%{ transform:translate(0,0) scale(1); opacity:0; }
    }
  </style>
</head>

<body>

  <!-- MENU -->
  <nav class="side-nav hud--day" aria-label="Навигация">
    <div class="side-nav__tab">
      <div class="tab-row">
        <button class="back-btn" id="menuToggle" type="button" aria-expanded="true" aria-controls="hudPanel" title="Свернуть/развернуть">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14.5 6.5 8.5 12l6 5.5"></path>
          </svg>
        </button>

        <div class="tab-title">Игровое меню</div>

        <div class="hud-switch" title="Ночной режим">
          <span class="moon" aria-hidden="true">🌙</span>
          <div class="switch" id="nightSwitch" role="switch" aria-checked="false" tabindex="0"></div>
        </div>
      </div>
    </div>

    <div class="side-nav__panel" id="hudPanel">
      <div class="sparkles" aria-hidden="true"></div>
      <div class="inner-stroke" aria-hidden="true"></div>

      <ul class="side-nav__list">
        <li>
          <a class="hud-item is-active" href="https://digitalhavenrussia.ru">
            <span class="hud-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M3 10.5 12 3l9 7.5"></path>

  <div class="header">
    <img class="header__bg-blur" src="header-bg-3840.jpg" alt="" aria-hidden="true" decoding="async">
    <img class="header__bg" src="header-bg-3840.jpg" alt="" loading="eager" decoding="async">

    <div class="cube-container" id="cubes"></div>
  </div>

  <script>
    // cubes (как у тебя)
    const container = document.getElementById('cubes');
    const cols = 40, rows = 25;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cube = document.createElement('div');
        cube.className = 'cube';
        cube.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
        cube.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
        cube.style.gridColumn = x + 1;
        cube.style.gridRow = y + 1;
        cube.style.animationDelay = (Math.random() * 0.8) + 's';
        container.appendChild(cube);
      }
    }

    // Активный пункт по URL
    (function markActive(){
      try{
        const path = location.pathname.replace(/\/+$/, '') || '/';
        const items = document.querySelectorAll('.hud-item');
        items.forEach(a => a.classList.remove('is-active'));

        const rules = [
          { match: ['/', '/index.html'], hrefPart: 'digitalhavenrussia.ru' },
          { match: ['/project.html'], hrefPart: 'project.html' },
          { match: ['/security.html'], hrefPart: 'security.html' },
          { match: ['/map.html'], hrefPart: 'map.html' },
        ];
        const rule = rules.find(r => r.match.includes(path));
        if(!rule) return;

        const active = Array.from(items).find(a => (a.getAttribute('href') || '').includes(rule.hrefPart));
        if(active) active.classList.add('is-active');
      }catch(e){}
    })();

    // Сворачивание
    (function toggleMenu(){
      const nav = document.querySelector('.side-nav');
      const btn = document.getElementById('menuToggle');
      if(!nav || !btn) return;

      btn.addEventListener('click', () => {
        const collapsed = nav.classList.toggle('is-collapsed');
        btn.setAttribute('aria-expanded', String(!collapsed));
        btn.title = collapsed ? 'Развернуть меню' : 'Свернуть меню';
      });
    })();

    // Ночной режим
    (function nightHud(){
      const nav = document.querySelector('.side-nav');
      const sw = document.getElementById('nightSwitch');
      if(!nav || !sw) return;

      const setState = (on) => {
        sw.classList.toggle('is-on', on);
        sw.setAttribute('aria-checked', String(on));
        nav.classList.toggle('hud--night', on);
      };

      const toggle = () => setState(!(sw.getAttribute('aria-checked') === 'true'));

      sw.addEventListener('click', toggle);
      sw.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });

      setState(false);
    })();
  </script>
