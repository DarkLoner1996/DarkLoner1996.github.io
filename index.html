<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ТехноКрыльяРоссии</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    *{ margin:0; padding:0; box-sizing:border-box; }
    html, body{
      width:100%;
      height:100%;
      overflow-x:hidden;
      font-family:'Ruslan Display', cursive;
      background:#ddeeff;
    }

    /* ============================================================
       HUD MENU "КАК НА МАКЕТЕ"
       - стеклянная зелёно-бирюзовая панель
       - яркие кромки + глянец + мягкий glow
       - SVG-иконки в едином UI стиле (не эмодзи)
       - pill-бейджи как в макете
       ============================================================ */

    :root{
      --nav-left: 18px;
      --nav-top: 14px;
      --panel-w: 352px;

      /* общий тон макета */
      --glass-1: rgba(120, 210, 205, .22);
      --glass-2: rgba(45, 120, 115, .28);
      --glass-3: rgba(20, 70, 72, .34);

      --stroke: rgba(255,255,255,.28);
      --stroke-soft: rgba(255,255,255,.16);
      --shadow: rgba(0,0,0,.32);

      --text: rgba(245,252,255,.96);
      --muted: rgba(220,245,245,.78);

      --ring: rgba(140, 255, 235, .30);

      --active-glow: rgba(170, 255, 220, .34);
      --hover-glow: rgba(140, 230, 255, .22);

      --pill-bg: rgba(255,255,255,.12);
      --pill-stroke: rgba(255,255,255,.22);
      --pill-text: rgba(240,252,255,.92);

      --pill-active-bg1: rgba(255, 240, 195, .42);
      --pill-active-bg2: rgba(255, 210, 120, .20);

      --cta-bg1: rgba(255, 236, 176, .98);
      --cta-bg2: rgba(255, 210, 118, .94);
      --cta-text: rgba(60,55,40,.96);

      --radius: 18px;
    }

    /* Night mode — чуть темнее, но всё равно “стекло” */
    .hud--night{
      --glass-1: rgba(90, 190, 190, .16);
      --glass-2: rgba(25, 80, 78, .28);
      --glass-3: rgba(10, 30, 34, .52);

      --stroke: rgba(255,255,255,.24);
      --stroke-soft: rgba(255,255,255,.12);

      --active-glow: rgba(140, 230, 255, .26);
      --hover-glow: rgba(140, 230, 255, .18);

      --muted: rgba(210,240,240,.72);
      --ring: rgba(140,230,255,.28);
    }

    /* ===== container ===== */
    .side-nav{
      position:fixed;
      left: var(--nav-left);
      top: var(--nav-top);
      z-index:1000;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-start;
      transform: translateZ(0);
    }

    /* ===== TOP TAB ===== */
    .side-nav__tab{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:16px;

      background:
        radial-gradient(120% 120% at 20% 10%, rgba(255,255,255,.25), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,.10));

      border:1px solid rgba(255,255,255,.32);
      box-shadow:
        0 14px 28px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.28);

      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      user-select:none;
      position:relative;
      overflow:hidden;
    }
    .side-nav__tab::after{
      content:"";
      position:absolute;
      inset:-45% -35%;
      background: radial-gradient(circle at 25% 20%, rgba(255,255,255,.26), transparent 58%);
      transform: rotate(10deg);
      pointer-events:none;
      opacity:.8;
    }

    .tab-btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:7px 10px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.08);
      color: var(--text);
      cursor:pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
      white-space:nowrap;
      position:relative;
      z-index:1;
    }
    .tab-btn:hover{
      transform: translateY(-1px);
      filter:saturate(1.06);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.12),
        0 10px 20px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.16);
    }
    .tab-btn:focus-visible{
      outline:none;
      box-shadow: 0 0 0 3px var(--ring), inset 0 1px 0 rgba(255,255,255,.14);
    }

    .tab-ico{
      width:26px; height:26px;
      border-radius:10px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.22);
      box-shadow: 0 10px 18px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.22);
      color: var(--text);
      font-size:16px;
      line-height:1;
    }
    .tab-title{
      font-size:15px;
      letter-spacing:.12px;
      opacity:.95;
      white-space:nowrap;
    }

    /* ===== switch ===== */
    .hud-switch{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 8px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
      position:relative;
      z-index:1;
    }
    .hud-switch .moon{
      width:18px; height:18px;
      border-radius:8px;
      display:grid;
      place-items:center;
      font-size:13px;
      color: rgba(255,255,255,.92);
      opacity:.92;
    }
    .switch{
      width:40px; height:18px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.10);
      position:relative;
      cursor:pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
      transition: filter .18s ease, transform .12s ease;
    }
    .switch:hover{ filter:saturate(1.06); }
    .switch:active{ transform: scale(.985); }
    .switch::after{
      content:"";
      position:absolute;
      top:2px; left:2px;
      width:14px; height:14px;
      border-radius:50%;
      background: rgba(255,255,255,.88);
      box-shadow: 0 6px 10px rgba(0,0,0,.22);
      transition: left .18s ease, background .18s ease;
    }
    .switch.is-on{ background: rgba(255, 220, 140, .20); }
    .switch.is-on::after{ left:24px; background: rgba(255, 235, 185, .96); }

    /* ===== PANEL (как на макете: зелёное стекло) ===== */
    .side-nav__panel{
      width: var(--panel-w);
      border-radius: var(--radius);
      padding:14px 14px 16px;

      background:
        radial-gradient(120% 90% at 18% 8%, rgba(255,255,255,.26), transparent 60%),
        radial-gradient(120% 90% at 90% 120%, rgba(140,255,235,.12), transparent 55%),
        linear-gradient(180deg, var(--glass-1), var(--glass-2) 55%, var(--glass-3));

      border:1px solid var(--stroke);

      box-shadow:
        0 26px 58px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,.22),
        inset 0 0 0 1px rgba(255,255,255,.08);

      backdrop-filter: blur(16px) saturate(1.25);
      -webkit-backdrop-filter: blur(16px) saturate(1.25);

      position:relative;
      overflow:hidden;

      transform-origin: top left;
      transition: transform .22s ease, opacity .22s ease, filter .22s ease;
    }

    /* внутренний контур */
    .side-nav__panel::before{
      content:"";
      position:absolute;
      inset:9px;
      border-radius: calc(var(--radius) - 10px);
      border:1px solid var(--stroke-soft);
      pointer-events:none;
      z-index:1;
    }

    /* глянец + очень мягкие scanlines */
    .side-nav__panel::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(90% 70% at 20% 8%, rgba(255,255,255,.22), transparent 62%),
        repeating-linear-gradient(to bottom, transparent 0 10px, rgba(255,255,255,.03) 10px 11px);
      opacity:.85;
      mix-blend-mode: soft-light;
      z-index:0;
    }

    /* лёгкий noise */
    .hud-noise{
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.55;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,.03) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 30%, rgba(255,255,255,.03) 0 1px, transparent 2px),
        radial-gradient(circle at 40% 80%, rgba(255,255,255,.028) 0 1px, transparent 2px),
        radial-gradient(circle at 85% 65%, rgba(255,255,255,.028) 0 1px, transparent 2px);
      filter: blur(.2px);
      z-index:0;
    }

    .side-nav__list{
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:10px;
      margin:8px 0 12px;
      padding:0;
      position:relative;
      z-index:2;
    }

    /* ===== ITEM (пластик + свечения как на макете) ===== */
    .hud-item{
      position:relative;
      display:flex;
      align-items:center;
      gap:12px;

      padding:13px 12px;
      border-radius:16px;

      background:
        radial-gradient(120% 90% at 18% 10%, rgba(255,255,255,.20), transparent 58%),
        linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.07));

      border:1px solid rgba(255,255,255,.18);

      box-shadow:
        0 12px 22px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.18);

      text-decoration:none;
      color: var(--text);
      overflow:hidden;

      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }

    .hud-item:hover{
      transform: translateY(-1px);
      filter:saturate(1.06);
      box-shadow:
        0 18px 32px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 0 18px var(--hover-glow);
    }
    .hud-item:active{ transform: translateY(0px) scale(.995); }

    .hud-item:focus-visible{
      outline:none;
      box-shadow:
        0 0 0 3px var(--ring),
        0 18px 32px rgba(0,0,0,.26),
        inset 0 1px 0 rgba(255,255,255,.18);
    }

    /* левый “энерго-бар” */
    .hud-item::before{
      content:"";
      position:absolute;
      left:10px; top:10px; bottom:10px;
      width:4px;
      border-radius:999px;
      background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.06));
      opacity:.9;
    }
    .hud-item.is-active::before{
      background: linear-gradient(180deg, rgba(180,255,210,.88), rgba(255,220,140,.88));
      box-shadow: 0 0 14px rgba(140,255,235,.35);
      opacity:1;
    }

    /* активный пункт */
    .hud-item.is-active{
      box-shadow:
        0 22px 40px rgba(0,0,0,.34),
        inset 0 1px 0 rgba(255,255,255,.22),
        inset 0 0 22px var(--active-glow);
    }

    /* ===== ICON (SVG) ===== */
    .hud-ico{
      width:44px; height:44px;
      border-radius:14px;
      display:grid;
      place-items:center;

      background:
        radial-gradient(120% 90% at 30% 20%, rgba(255,255,255,.20), transparent 55%),
        rgba(255,255,255,.10);

      border:1px solid rgba(255,255,255,.20);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        0 10px 18px rgba(0,0,0,.22);

      flex:0 0 auto;
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }

    .hud-ico svg{
      width:22px;
      height:22px;
      stroke: rgba(245,252,255,.92);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.18));
    }

    .hud-item:hover .hud-ico{
      transform: translateY(-1px) scale(1.02);
      filter:saturate(1.08);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        0 12px 20px rgba(0,0,0,.26),
        0 0 18px rgba(140,255,235,.18);
    }
    .hud-item.is-active .hud-ico{
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        0 12px 22px rgba(0,0,0,.28),
        0 0 22px rgba(255,220,140,.18);
    }

    .hud-txt{
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width:0;
      flex:1 1 auto;
    }
    .hud-title{
      font-size:16px;
      letter-spacing:.2px;
      line-height:1.05;
    }
    .hud-sub{
      font-size:12px;
      letter-spacing:.12px;
      color: var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      opacity:.92;
    }

    /* pill — именно “макетная” капсула */
    .hud-pill{
      flex:0 0 auto;
      padding:6px 12px;
      border-radius:999px;
      border:1px solid var(--pill-stroke);
      background:
        radial-gradient(120% 120% at 25% 20%, rgba(255,255,255,.18), transparent 58%),
        rgba(255,255,255,.10);
      color: var(--pill-text);
      font-size:11px;
      letter-spacing:.18em;
      text-transform:uppercase;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
      margin-left:6px;
      transition: transform .16s ease, filter .16s ease;
    }
    .hud-pill.active{
      background:
        radial-gradient(120% 120% at 25% 20%, rgba(255,255,255,.22), transparent 62%),
        linear-gradient(180deg, var(--pill-active-bg1), var(--pill-active-bg2));
      color: rgba(255,250,240,.98);
      border-color: rgba(255,255,255,.30);
    }
    .hud-item:hover .hud-pill{ transform: translateY(-1px); filter:saturate(1.05); }

    .hud-chev{
      margin-left:6px;
      color: rgba(255,255,255,.78);
      opacity:.78;
      font-size:18px;
      line-height:1;
      transform: translateY(-1px);
      transition: transform .16s ease, opacity .16s ease;
    }
    .hud-item:hover .hud-chev{ transform: translateY(-1px) translateX(2px); opacity:.95; }

    .side-nav__divider{
      height:1px;
      margin:10px 2px 12px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
      opacity:.9;
      position:relative;
      z-index:2;
    }

    .hud-cta{
      position:relative;
      z-index:2;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      height:56px;
      border-radius:16px;

      background: linear-gradient(180deg, var(--cta-bg1), var(--cta-bg2));
      border:1px solid rgba(255,255,255,.42);
      box-shadow: 0 16px 30px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.55);

      color: var(--cta-text);
      text-decoration:none;
      font-size:16px;
      letter-spacing:.12em;
      text-transform:uppercase;

      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
      text-align:center;
      padding:0 12px;

      animation: ctaBreath 6s ease-in-out infinite;
    }
    @keyframes ctaBreath{
      0%,100%{ filter:saturate(1.0); box-shadow: 0 16px 30px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.55); }
      50%{ filter:saturate(1.08); box-shadow: 0 18px 34px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.58), 0 0 22px rgba(255,220,140,.18); }
    }
    .hud-cta:hover{
      transform: translateY(-1px);
      filter:saturate(1.08);
      box-shadow:
        0 18px 34px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.58),
        0 0 26px rgba(255,220,140,.20);
    }
    .hud-cta:active{ transform: translateY(0px) scale(.995); animation:none; }
    .hud-cta:focus-visible{
      outline:none;
      box-shadow:
        0 0 0 3px rgba(255,220,140,.28),
        0 18px 34px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.58);
    }

    /* сердечко в CTA — тоже SVG */
    .hud-cta .heart{
      width:30px; height:30px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.55);
      border:1px solid rgba(255,255,255,.40);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.55);
      flex:0 0 auto;
    }
    .hud-cta .heart svg{
      width:16px; height:16px;
      stroke: rgba(70,60,40,.85);
      fill:none;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    /* ===== collapse left ===== */
    .side-nav.is-collapsed .side-nav__panel{
      transform: translateX(calc(-100% - 18px));
      opacity:0;
      pointer-events:none;
      filter: blur(1px);
    }

    @media (max-width: 820px){
      :root{ --nav-left: 10px; --nav-top: 10px; --panel-w: 310px; }
      .tab-title{ display:none; }
    }
    @media (prefers-reduced-motion: reduce){
      .side-nav__panel, .hud-item, .tab-btn, .hud-cta, .switch { transition:none !important; animation:none !important; }
    }

    /* ===== HEADER (твой, без изменений) ===== */
    .header{
      position:relative;
      width:100%;
      height:100vh;
      min-height:100svh;
      min-height:100dvh;
      overflow:hidden;
      background:#ddeeff;
    }
    .header__bg-blur{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      filter: blur(22px) saturate(1.15);
      transform: scale(1.12);
      z-index:0;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }
    .header__bg{
      position:absolute;
      left:50%;
      top:50%;
      width:100vw;
      height:auto;
      max-height:100vh;
      transform:translate(-50%, -50%);
      z-index:1;
      object-fit:unset;
      pointer-events:none;
      user-select:none;
    }
    .header::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.05), rgba(0,0,0,0.18)),
        rgba(255,255,255,0.05);
      z-index:3;
      pointer-events:none;
    }

    .cloud-left{
      position:absolute; top:0%; left:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      animation:flyLeftToRight 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    .cloud-right{
      position:absolute; top:3%; right:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      transform:scaleX(-1);
      animation:flyRightToLeft 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    @keyframes flyLeftToRight{
      0%,10%{ transform:translateX(0); }
      90%,100%{ transform:translateX(calc(100vw + 250px)); }
    }
    @keyframes flyRightToLeft{
      0%,10%{ transform:translateX(0) scaleX(-1); }
      90%,100%{ transform:translateX(calc(-100vw - 250px)) scaleX(-1); }
    }

    .cube-container{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(40, minmax(0, 1fr));
      grid-template-rows:repeat(25, minmax(0, 1fr));
      z-index:2;
      pointer-events:none;
    }
    .cube{
      width:100%;
      height:100%;
      background:url('code.webp') no-repeat center/contain;
      opacity:0;
      animation:cubeReveal 1.5s ease forwards;
    }
    @keyframes cubeReveal{
      0%{ transform:translate(var(--tx),var(--ty)) scale(0.1); opacity:0; }
      50%{ transform:translate(0,0) scale(1); opacity:1; }
      100%{ transform:translate(0,0) scale(1); opacity:0; }
    }

    .grass{
      position:absolute; bottom:0; left:0;
      width:200%; height:50px;
      background:url('grass.gif') repeat-x;
      background-size:contain;
      animation:slowGrass 60s ease-in-out infinite alternate;
      pointer-events:none; z-index:2;
    }
    @keyframes slowGrass{
      from { transform:translateX(0); }
      to   { transform:translateX(-25%); }
    }
  </style>
</head>

<body>

  <!-- HUD MENU (СЛЕВА) -->
  <nav class="side-nav hud--day" aria-label="Навигация">
    <div class="side-nav__tab">
      <button class="tab-btn" id="menuToggle" type="button" aria-expanded="true" aria-controls="hudPanel" title="Свернуть/развернуть">
        <span class="tab-ico" aria-hidden="true">⟨</span>
        <span class="tab-title">Игровое меню</span>
      </button>

      <div class="hud-switch" title="Ночной HUD">
        <span class="moon" aria-hidden="true">🌙</span>
        <div class="switch" id="nightSwitch" role="switch" aria-checked="false" tabindex="0"></div>
      </div>
    </div>

    <div class="side-nav__panel" id="hudPanel">
      <div class="hud-noise" aria-hidden="true"></div>

      <ul class="side-nav__list">
        <li>
          <a class="hud-item is-active" href="https://digitalhavenrussia.ru">
            <span class="hud-ico" aria-hidden="true">
              <!-- HOME -->
              <svg viewBox="0 0 24 24">
                <path d="M3 10.5 12 3l9 7.5"></path>
                <path d="M5 10.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9.5"></path>
              </svg>
            </span>

    <div class="grass"></div>

  <script>
    // cubes (как у тебя)
    const container = document.getElementById('cubes');
    const cols = 40, rows = 25;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cube = document.createElement('div');
        cube.className = 'cube';
        cube.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
        cube.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
        cube.style.gridColumn = x + 1;
        cube.style.gridRow = y + 1;
        cube.style.animationDelay = (Math.random() * 0.8) + 's';
        container.appendChild(cube);
      }
    }

    // Активный пункт по URL
    (function markActive(){
      try{
        const path = location.pathname.replace(/\/+$/, '') || '/';
        const items = document.querySelectorAll('.hud-item');
        items.forEach(a => a.classList.remove('is-active'));

        const rules = [
          { match: ['/', '/index.html'], hrefPart: 'digitalhavenrussia.ru' },
          { match: ['/project.html'], hrefPart: 'project.html' },
          { match: ['/security.html'], hrefPart: 'security.html' },
          { match: ['/map.html'], hrefPart: 'map.html' },
        ];
        const rule = rules.find(r => r.match.includes(path));
        if(!rule) return;

        const active = Array.from(items).find(a => (a.getAttribute('href') || '').includes(rule.hrefPart));
        if(active) active.classList.add('is-active');
      }catch(e){}
    })();

    // Сворачивание ВЛЕВО
    (function toggleMenu(){
      const nav = document.querySelector('.side-nav');
      const btn = document.getElementById('menuToggle');
      const ico = btn?.querySelector('.tab-ico');
      if(!nav || !btn || !ico) return;

      btn.addEventListener('click', () => {
        const collapsed = nav.classList.toggle('is-collapsed');
        btn.setAttribute('aria-expanded', String(!collapsed));
        btn.title = collapsed ? 'Развернуть меню' : 'Свернуть меню';
        ico.textContent = collapsed ? '≡' : '⟨';
      });
    })();

    // Ночной HUD (тумблер)
    (function nightHud(){
      const nav = document.querySelector('.side-nav');
      const sw = document.getElementById('nightSwitch');
      if(!nav || !sw) return;

      const setState = (on) => {
        sw.classList.toggle('is-on', on);
        sw.setAttribute('aria-checked', String(on));
        nav.classList.toggle('hud--night', on);
      };

      const toggle = () => setState(!(sw.getAttribute('aria-checked') === 'true'));

      sw.addEventListener('click', toggle);
      sw.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });

      setState(false);
    })();
  </script>
