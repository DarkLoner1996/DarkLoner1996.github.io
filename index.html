<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ТехноКрыльяРоссии</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%;
      height:100%;
      overflow-x:hidden;
      font-family:'Ruslan Display', cursive;
      background:#ddeeff;
    }

    /* ============================================================
       ВЕРТИКАЛЬНОЕ МЕНЮ СЛЕВА (в стиле премиум + кнопка сворачивания)
       ✅ Позиция в зоне “берёзы” задаётся 2 переменными:
          --nav-left и --nav-top
       ✅ Кнопка “Меню” сворачивает/разворачивает панель
       ✅ Без эмблемы, без перегруза, подходит под богатый фон
       ============================================================ */

    :root{
      /* 🔧 ТУТ ДВИГАЕШЬ МЕНЮ ПОД СТРЕЛКУ */
      --nav-left: 30px;   /* отступ слева */
      --nav-top: 210px;   /* отступ сверху */

      /* стиль панели */
      --panel-bg1: rgba(255,255,255,.82);
      --panel-bg2: rgba(255,255,255,.60);
      --panel-shadow: rgba(12, 38, 80, .18);

      --text: rgba(18,40,75,.92);
      --muted: rgba(18,40,75,.72);

      --active: rgba(255,210,125,.95);
      --ring: rgba(120,195,255,.35);

      --cta1: rgba(255,244,210,.98);
      --cta2: rgba(255,220,140,.92);
    }

    /* контейнер меню */
    .side-nav{
      position:fixed;
      left: var(--nav-left);
      top: var(--nav-top);
      transform:none;
      z-index:1000;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    /* кнопка сворачивания */
    .side-nav__toggle{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.65);
      background: linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.64));
      box-shadow: 0 16px 34px rgba(12,38,80,.14), inset 0 1px 0 rgba(255,255,255,.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text);
      cursor:pointer;
      user-select:none;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .side-nav__toggle:hover{
      transform: translateY(-1px);
      box-shadow: 0 18px 38px rgba(12,38,80,.16), inset 0 1px 0 rgba(255,255,255,.92);
      filter:saturate(1.03);
    }
    .side-nav__toggle:focus-visible{
      outline:none;
      box-shadow: 0 0 0 3px var(--ring), 0 18px 38px rgba(12,38,80,.16), inset 0 1px 0 rgba(255,255,255,.92);
    }

    .toggle-ico{
      width:26px; height:26px;
      border-radius:10px;
      display:grid; place-items:center;
      background: rgba(255,255,255,.72);
      border:1px solid rgba(255,255,255,.65);
      box-shadow: 0 10px 18px rgba(20,60,120,.10), inset 0 1px 0 rgba(255,255,255,.9);
      font-size:16px;
      line-height:1;
    }
    .toggle-text{
      font-size:15px;
      letter-spacing:.15px;
      opacity:.9;
      white-space:nowrap;
    }

    /* панель */
    .side-nav__panel{
      width: 210px;
      border-radius:18px;
      padding:10px;

      background:
        linear-gradient(180deg, var(--panel-bg1), var(--panel-bg2)) padding-box,
        linear-gradient(180deg, rgba(120,195,255,.35), rgba(255,210,125,.35)) border-box;
      border:1px solid transparent;

      box-shadow: 0 20px 46px var(--panel-shadow), inset 0 1px 0 rgba(255,255,255,.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow:hidden;
      transition: width .22s ease, padding .22s ease;
    }

    .side-nav__list{
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:8px;
      margin:0;
      padding:0;
    }

    .side-nav__link{
      position:relative;
      display:flex;
      align-items:center;
      gap:10px;

      height:44px;
      padding:0 12px 0 10px;
      border-radius:14px;

      text-decoration:none;
      color: var(--muted);
      font-size:15px;
      letter-spacing:.15px;

      transition: background .18s ease, transform .18s ease, box-shadow .18s ease, color .18s ease;
      outline:none;
      user-select:none;
    }

    .ico{
      width:38px; height:38px;
      border-radius:12px;
      display:grid; place-items:center;
      flex:0 0 auto;

      background: rgba(255,255,255,.60);
      border:1px solid rgba(255,255,255,.60);
      box-shadow: 0 10px 18px rgba(20,60,120,.10), inset 0 1px 0 rgba(255,255,255,.85);

      font-size:18px;
      color: var(--text);
    }

    .label{
      white-space:nowrap;
    }

    .side-nav__link:hover{
      background: rgba(255,255,255,.58);
      color: var(--text);
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(20,60,120,.10);
    }
    .side-nav__link:focus-visible{
      box-shadow: 0 0 0 3px var(--ring);
    }

    /* актив */
    .side-nav__link.is-active{
      background: rgba(255,255,255,.70);
      color: var(--text);
      box-shadow: 0 12px 22px rgba(20,60,120,.12);
    }
    .side-nav__link.is-active::after{
      content:"";
      position:absolute;
      left:12px; right:12px; bottom:6px;
      height:2px;
      border-radius:999px;
      background: linear-gradient(90deg, transparent, var(--active), transparent);
      pointer-events:none;
    }
    .side-nav__link.is-active .ico{
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), rgba(255,236,170,.70) 55%, rgba(255,255,255,.35));
      box-shadow: 0 14px 24px rgba(20,60,120,.12), 0 0 0 2px rgba(255,210,125,.22), inset 0 1px 0 rgba(255,255,255,.9);
    }

    .side-nav__divider{
      height:1px;
      margin:10px 4px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.78), transparent);
      opacity:.85;
    }

    .side-nav__cta{
      display:flex;
      align-items:center;
      gap:10px;

      height:44px;
      padding:0 12px 0 10px;
      border-radius:14px;

      background: linear-gradient(180deg, var(--cta1), var(--cta2));
      border:1px solid rgba(255,255,255,.65);
      box-shadow: 0 14px 26px rgba(20,60,120,.12), inset 0 1px 0 rgba(255,255,255,.9);

      text-decoration:none;
      color: rgba(55,55,55,.96);
      font-size:15px;

      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      user-select:none;
    }
    .side-nav__cta:hover{
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(20,60,120,.14), inset 0 1px 0 rgba(255,255,255,.92);
      filter:saturate(1.04);
    }
    .side-nav__cta:focus-visible{
      outline:none;
      box-shadow: 0 0 0 3px var(--ring), 0 18px 34px rgba(20,60,120,.14), inset 0 1px 0 rgba(255,255,255,.92);
    }
    .side-nav__cta .ico{
      background: rgba(255,255,255,.75);
      font-size:14px;
    }

    /* свёрнутый режим */
    .side-nav.is-collapsed .side-nav__panel{
      width: 64px;
      padding:10px;
    }
    .side-nav.is-collapsed .label{ display:none; }
    .side-nav.is-collapsed .side-nav__link{ justify-content:center; padding:0; }
    .side-nav.is-collapsed .side-nav__cta{ justify-content:center; padding:0; }
    .side-nav.is-collapsed .side-nav__divider{ display:none; }

    /* мобилка: аккуратнее (не перекрывать важные элементы) */
    @media (max-width: 820px){
      :root{
        --nav-left: 12px;
        --nav-top: 140px;
      }
      .side-nav__panel{ width: 200px; }
    }

    @media (prefers-reduced-motion: reduce){
      .side-nav__panel,
      .side-nav__link,
      .side-nav__cta,
      .side-nav__toggle{ transition:none; }
      .cloud-left, .cloud-right, .grass, .cube{ animation:none !important; }
    }

    /* ===== HEADER (твой) ===== */
    .header{
      position:relative;
      width:100%;
      height:100vh;
      min-height:100svh;
      min-height:100dvh;
      overflow:hidden;
      background:#ddeeff;
    }

    .header__bg-blur{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      filter: blur(22px) saturate(1.15);
      transform: scale(1.12);
      z-index:0;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .header__bg{
      position:absolute;
      left:50%;
      top:50%;
      width:100vw;
      height:auto;
      max-height:100vh;
      transform:translate(-50%, -50%);
      z-index:1;
      object-fit:unset;
      pointer-events:none;
      user-select:none;
    }

    .header::after {
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.05), rgba(0,0,0,0.18)),
        rgba(255,255,255,0.05);
      z-index:3;
      pointer-events:none;
    }

    /* ===== Clouds ===== */
    .cloud-left {
      position:absolute; top:0%; left:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      animation:flyLeftToRight 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    .cloud-right {
      position:absolute; top:3%; right:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      transform:scaleX(-1);
      animation:flyRightToLeft 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    @keyframes flyLeftToRight {
      0%,10%   { transform:translateX(0); }
      90%,100% { transform:translateX(calc(100vw + 250px)); }
    }
    @keyframes flyRightToLeft {
      0%,10%   { transform:translateX(0) scaleX(-1); }
      90%,100% { transform:translateX(calc(-100vw - 250px)) scaleX(-1); }
    }

    /* ===== Cubes ===== */
    .cube-container{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(40, minmax(0, 1fr));
      grid-template-rows:repeat(25, minmax(0, 1fr));
      z-index:2;
      pointer-events:none;
    }
    .cube{
      width:100%;
      height:100%;
      background:url('code.webp') no-repeat center/contain;
      opacity:0;
      animation:cubeReveal 1.5s ease forwards;
    }
    @keyframes cubeReveal {
      0%   { transform:translate(var(--tx),var(--ty)) scale(0.1); opacity:0; }
      50%  { transform:translate(0,0) scale(1); opacity:1; }
      100% { transform:translate(0,0) scale(1); opacity:0; }
    }

    /* ===== Grass ===== */
    .grass {
      position:absolute; bottom:0; left:0;
      width:200%; height:50px;
      background:url('grass.gif') repeat-x;
      background-size:contain;
      animation:slowGrass 60s ease-in-out infinite alternate;
      pointer-events:none; z-index:2;
    }
    @keyframes slowGrass {
      from { transform:translateX(0); }
      to   { transform:translateX(-25%); }
    }
  </style>
</head>

<body>

<!-- ВЕРТИКАЛЬНОЕ МЕНЮ -->
<nav class="side-nav" aria-label="Навигация">
  <button class="side-nav__toggle" type="button" aria-expanded="true" aria-controls="sideNavPanel" title="Свернуть меню">
    <span class="toggle-ico" aria-hidden="true">⟨</span>
    <span class="toggle-text">Игровое меню</span>
  </button>

  <div class="side-nav__panel" id="sideNavPanel">
    <ul class="side-nav__list">
      <li>
        <a class="side-nav__link is-active" href="https://digitalhavenrussia.ru">
          <span class="ico" aria-hidden="true">🏠</span>
          <span class="label">Главная</span>
        </a>
      </li>
      <li>
        <a class="side-nav__link" href="https://digitalhavenrussia.ru/project.html">
          <span class="ico" aria-hidden="true">📘</span>
          <span class="label">О проекте</span>
        </a>
      </li>
      <li>
        <a class="side-nav__link" href="https://digitalhavenrussia.ru/security.html">
          <span class="ico" aria-hidden="true">🎬</span>
          <span class="label">Мультфильм</span>
        </a>
      </li>
      <li>
        <a class="side-nav__link" href="https://digitalhavenrussia.ru/map.html">
          <span class="ico" aria-hidden="true">🧭</span>
          <span class="label">Маршрут помощи</span>
        </a>
      </li>
    </ul>

    <div class="side-nav__divider" aria-hidden="true"></div>

    <a class="side-nav__cta" href="https://digitalhavenrussia.ru/project.html#help">
      <span class="ico" aria-hidden="true">❤</span>
      <span class="label">Поддержать</span>
    </a>
  </div>
</nav>

  <div class="header">
    <img class="header__bg-blur" src="header-bg-3840.jpg" alt="" aria-hidden="true" decoding="async">
    <img class="header__bg" src="header-bg-3840.jpg" alt="" loading="eager" decoding="async">

    <div class="cloud-left"></div>
    <div class="cloud-right"></div>

    <div class="cube-container" id="cubes"></div>
    <div class="grass"></div>
  </div>

  <script>
    // cubes (как у тебя)
    const container = document.getElementById('cubes');
    const cols = 40, rows = 25;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cube = document.createElement('div');
        cube.className = 'cube';
        cube.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
        cube.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
        cube.style.gridColumn = x + 1;
        cube.style.gridRow = y + 1;
        cube.style.animationDelay = (Math.random() * 0.8) + 's';
        container.appendChild(cube);
      }
    }

    // Активный пункт по URL
    (function markActive(){
      try{
        const path = location.pathname.replace(/\/+$/, '');
        const links = document.querySelectorAll('.side-nav__link');
        links.forEach(a => a.classList.remove('is-active'));

        const rules = [
          { match: ['/', '/index.html'], includes: 'digitalhavenrussia.ru' },
          { match: ['/project.html'], includes: 'project.html' },
          { match: ['/security.html'], includes: 'security.html' },
          { match: ['/map.html'], includes: 'map.html' },
        ];

        const rule = rules.find(r => r.match.includes(path));
        if(!rule) return;

        const active = Array.from(links).find(a => a.getAttribute('href')?.includes(rule.includes));
        if(active) active.classList.add('is-active');
      }catch(e){}
    })();

    // Свернуть/развернуть меню
    (function toggleNav(){
      const nav = document.querySelector('.side-nav');
      const btn = document.querySelector('.side-nav__toggle');
      if(!nav || !btn) return;

      btn.addEventListener('click', () => {
        const collapsed = nav.classList.toggle('is-collapsed');
        btn.setAttribute('aria-expanded', String(!collapsed));
        btn.title = collapsed ? 'Развернуть меню' : 'Свернуть меню';
        btn.querySelector('.toggle-ico').textContent = collapsed ? '⟩' : '⟨';
      });
    })();
  </script>
</body>
</html>
