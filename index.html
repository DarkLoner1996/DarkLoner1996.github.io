<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ТехноКрыльяРоссии</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    *{ margin:0; padding:0; box-sizing:border-box; }

    /* ✅ FIX: скроллит НЕ страница, а .header (чтобы стартовать снизу) */
    html, body{
      width:100%;
      height:100%;
      overflow:hidden; /* было overflow-x:hidden */
      font-family:'Ruslan Display', cursive;
      background:#ddeeff;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
    }

    :root{
      --nav-left: 18px;
      --nav-top: 14px;
      --panel-w: min(440px, calc(100vw - 36px));

      --text: rgba(250,244,232,.96);
      --muted: rgba(245,235,210,.78);

      --gA: rgba(90, 170, 195, .42);
      --gB: rgba(35, 120, 145, .34);

      --iA: rgba(255,255,255,.14);
      --iB: rgba(0,0,0,.06);

      --goldA:#fff2c9;
      --goldB:#f2d07a;
      --goldC:#c58a2c;
      --goldD:#7a4a12;

      --blueP1: rgba(65, 175, 220, .92);
      --blueP2: rgba(30, 120, 170, .92);

      --actP1: rgba(255, 242, 205, .98);
      --actP2: rgba(245, 206, 120, .98);

      --shadow: rgba(0,0,0,.24);
      --ring: rgba(255,230,160,.22);

      --radius: 26px;
      --rowH: clamp(72px, 10vw, 84px);

      /* Matrix/HUD accents */
      --mx: rgba(110,255,210,.92);
      --mx2: rgba(40,220,160,.55);
      --mxDark: rgba(6,18,16,.55);

      /* Matrix colors (yellow + blue) */
      --mxY: rgba(255, 226, 120, .95); /* жёлтый */
      --mxB: rgba(80, 175, 255, .80);  /* синий */

      /* ✅ Режим хедера:
         1 = "по ширине 100%, без искажений, лишнее вниз (скролл)" — самый честный
         2 = "на весь экран cover (будет кроп, но красиво)"
      */
      --hero-mode: 1;
    }

    .side-nav{
      position:fixed;
      left: var(--nav-left);
      top: var(--nav-top);
      z-index:1000;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-start;
      transform: translateZ(0);
      user-select:none;
    }

    /* =============== TOP BAR =============== */
    .side-nav__tab{
      width: var(--panel-w);
      border-radius: 22px;
      padding: 10px 12px;
      position:relative;
      overflow:hidden;

      background:
        radial-gradient(120% 120% at 30% 22%, rgba(255,255,255,.18), transparent 60%),
        radial-gradient(110% 80% at 84% 18%, rgba(255,215,120,.16), transparent 58%),
        linear-gradient(180deg, rgba(16,120,140,.52), rgba(7,65,78,.48));

      box-shadow: 0 16px 32px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.18);
    }
    .side-nav__tab::before{
      content:"";
      position:absolute; inset:0;
      border-radius: 22px;
      padding: 2px;
      background: linear-gradient(180deg, var(--goldA), var(--goldB) 35%, var(--goldC) 70%, var(--goldD));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.92;
    }

    .tab-row{
      position:relative;
      z-index:2;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .back-btn{
      width:46px; height:46px;
      border-radius:16px;
      border:1px solid rgba(255,240,190,.30);
      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.16), transparent 62%),
        linear-gradient(180deg, rgba(10,95,110,.50), rgba(6,55,65,.48));
      box-shadow: 0 12px 20px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.14);
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform .16s ease, filter .16s ease;
      flex:0 0 auto;
    }
    .back-btn:hover{ transform: translateY(-1px); filter:saturate(1.04); }
    .back-btn:active{ transform: translateY(0px) scale(.985); }
    .back-btn svg{ width:22px; height:22px; stroke: var(--text); fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; opacity:.96; }

    .tab-title{
      flex:1 1 auto;
      min-width:0;
      font-size: clamp(18px, 3.8vw, 22px);
      letter-spacing:.20px;
      color: var(--text);
      text-shadow: 0 1px 0 rgba(0,0,0,.18);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      padding-left:2px;
    }

    .hud-switch{
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 8px;
      border-radius:16px;
      border:1px solid rgba(255,240,190,.24);
      background: rgba(0,0,0,.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
      flex:0 0 auto;
    }
    .hud-switch .moon{
      width:22px; height:22px;
      display:grid; place-items:center;
      border-radius:10px;
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
      font-size:14px;
      color: rgba(255,255,255,.92);
    }
    .switch{
      width:46px; height:22px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      position:relative;
      cursor:pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
      transition: filter .18s ease, transform .12s ease;
    }
    .switch:hover{ filter:saturate(1.05); }
    .switch:active{ transform: scale(.985); }
    .switch::after{
      content:"";
      position:absolute;
      top:2px; left:2px;
      width:18px; height:18px;
      border-radius:50%;
      background: rgba(255,255,255,.88);
      box-shadow: 0 8px 14px rgba(0,0,0,.22);
      transition: left .18s ease, background .18s ease;
    }
    .switch.is-on{
      background: rgba(255,215,120,.18);
      border-color: rgba(255,235,175,.20);
    }
    .switch.is-on::after{
      left:24px;
      background: rgba(255,240,200,.96);
    }

    /* =============== PANEL =============== */
    .side-nav__panel{
      width: var(--panel-w);
      border-radius: var(--radius);
      padding: 14px 14px 16px;
      position:relative;
      overflow:hidden;

      background:
        radial-gradient(140% 120% at 20% 10%, rgba(255,255,255,.18), transparent 62%),
        radial-gradient(120% 100% at 84% 12%, rgba(255,215,120,.12), transparent 60%),
        linear-gradient(180deg, var(--gA), var(--gB));

      box-shadow: 0 18px 44px rgba(0,0,0,.22);
      backdrop-filter: blur(14px) saturate(1.12);
      -webkit-backdrop-filter: blur(14px) saturate(1.12);
    }
    .side-nav__panel::before{
      content:"";
      position:absolute; inset:0;
      border-radius: var(--radius);
      padding: 4px;
      background: linear-gradient(180deg, var(--goldA), var(--goldB) 34%, var(--goldC) 70%, var(--goldD));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.88;
    }
    .inner-stroke{
      position:absolute;
      inset: 10px;
      border-radius: calc(var(--radius) - 10px);
      border: 1px solid rgba(255,240,190,.20);
      pointer-events:none;
      z-index:1;
    }
    .sparkles{
      position:absolute;
      inset:-40px;
      z-index:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 92% 16%, rgba(255,240,190,.90) 0 2px, transparent 4px),
        radial-gradient(circle at 88% 26%, rgba(255,255,255,.80) 0 1.5px, transparent 3px),
        radial-gradient(circle at 78% 18%, rgba(255,215,120,.80) 0 2px, transparent 4px),
        radial-gradient(circle at 16% 72%, rgba(255,255,255,.14) 0 2px, transparent 5px);
      opacity:.80;
      filter: blur(.15px);
      mix-blend-mode: normal;
    }

    .side-nav__list{
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:12px;
      margin: 8px 0 14px;
      padding:0;
      position:relative;
      z-index:3;
    }

    /* =============== ITEM ROW =============== */
    .hud-item{
      height: var(--rowH);
      border-radius: 20px;
      padding: 12px 14px;
      display:flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      color: var(--text);
      position:relative;
      overflow:hidden;

      background:
        radial-gradient(120% 140% at 25% 20%, rgba(255,255,255,.16), transparent 58%),
        linear-gradient(180deg, var(--iA), var(--iB));

      box-shadow: 0 10px 20px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.12);
      border:1px solid rgba(255,240,190,.18);

      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }
    .hud-item::before{
      content:"";
      position:absolute; inset:0;
      border-radius: 20px;
      padding: 2px;
      background: linear-gradient(180deg, rgba(255,245,205,.60), rgba(245,205,120,.30) 45%, rgba(180,120,35,.22));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.88;
    }

    .hud-item::after{
      content:"";
      position:absolute;
      left: 10px;
      top: 50%;
      width: 10px;
      height: 10px;
      transform: translateY(-50%) rotate(45deg);
      border-radius: 2px;
      background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.08));
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 10px 16px rgba(0,0,0,.16);
      opacity:.86;
    }
    .hud-item.is-active::after{
      background: linear-gradient(180deg, rgba(255,240,195,.95), rgba(245,206,120,.86));
      border-color: rgba(255,255,255,.32);
      box-shadow: 0 0 10px rgba(255,220,140,.16), 0 10px 16px rgba(0,0,0,.16);
      opacity:1;
    }
    .hud-item.is-active{
      box-shadow: 0 14px 28px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.16), inset 0 0 18px rgba(255,220,140,.10);
    }
    .hud-item:hover{
      transform: translateY(-1px);
      filter:saturate(1.05);
      box-shadow: 0 18px 34px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.16);
    }
    .hud-item:active{ transform: translateY(0px) scale(.992); }
    .hud-item:focus-visible{
      outline:none;
      box-shadow: 0 0 0 3px var(--ring), 0 18px 34px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.16);
    }

    .hud-ico{
      width: clamp(50px, 11vw, 58px);
      height: clamp(50px, 11vw, 58px);
      border-radius: 18px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      margin-left: 20px;

      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.14), transparent 62%),
        linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.14));
      border:1px solid rgba(255,240,190,.18);
      box-shadow: 0 12px 18px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.12);
    }
    .hud-ico svg{
      width: clamp(24px, 6vw, 30px);
      height: clamp(24px, 6vw, 30px);
      stroke: rgba(255,245,220,.95);
      fill:none;
      stroke-width:2.3;
      stroke-linecap:round;
      stroke-linejoin:round;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.18));
    }

    .hud-txt{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
      flex:1 1 auto;
    }

    .hud-title{
      font-size: clamp(16px, 3.6vw, 20px);
      letter-spacing: .03em;
      text-transform: uppercase;
      line-height: 1.02;
      text-shadow: 0 1px 0 rgba(0,0,0,.18);

      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
      overflow: hidden;
    }

    .hud-sub{
      font-size: clamp(10px, 2.4vw, 12px);
      letter-spacing:.08em;
      text-transform:uppercase;
      color: var(--muted);
      opacity:.88;

      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
      overflow:hidden;
    }

    .hud-title--split{
      display:flex;
      flex-direction:column;
      gap:2px;
      line-height:1.02;
    }
    .hud-title--split > span{ display:block; }

    .hud-pill{
      flex:0 0 auto;
      min-width: clamp(84px, 20vw, 110px);
      height: clamp(32px, 7.8vw, 38px);
      padding: 0 12px;
      border-radius: 999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      font-size: clamp(11px, 2.8vw, 14px);
      letter-spacing:.16em;
      text-transform:uppercase;
      color: rgba(245,250,255,.96);

      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.18), transparent 60%),
        linear-gradient(180deg, var(--blueP1), var(--blueP2));
      border:1px solid rgba(255,240,190,.18);

      box-shadow:
        0 12px 18px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.20);

      position:relative;
      overflow:hidden;

      backdrop-filter: blur(6px) saturate(1.05);
      -webkit-backdrop-filter: blur(6px) saturate(1.05);
    }
    .hud-pill::after{
      content:"›";
      font-size: clamp(18px, 4.2vw, 22px);
      line-height:1;
      opacity:.88;
      transform: translateY(-1px);
      margin-left:2px;
    }
    .hud-pill.active{
      color: rgba(70,55,28,.95);
      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.26), transparent 60%),
        linear-gradient(180deg, var(--actP1), var(--actP2));
      border-color: rgba(255,255,255,.32);
      box-shadow:
        0 14px 22px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.58);
    }
    .hud-pill.active::after{ opacity:.62; }
    .hud-item:hover .hud-pill{
      filter:saturate(1.06);
      transform: translateY(-1px);
      transition: transform .16s ease, filter .16s ease;
    }

    /* =============== CTA =============== */
    .hud-cta{
      position:relative;
      z-index:3;

      height: clamp(64px, 14vw, 74px);
      border-radius: 22px;
      display:flex;
      align-items:center;
      gap:12px;
      justify-content:flex-start;

      padding: 0 58px 0 18px;

      text-decoration:none;
      color: rgba(70,55,28,.95);
      text-transform:uppercase;
      letter-spacing:.10em;
      font-size: clamp(16px, 4.1vw, 21px);

      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.26), transparent 62%),
        linear-gradient(180deg, rgba(255,240,195,.98), rgba(245,206,120,.98));
      border:1px solid rgba(255,255,255,.44);
      box-shadow: 0 20px 38px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.58);

      overflow:hidden;
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }
    .hud-cta::before{
      content:"";
      position:absolute; inset:0;
      border-radius: 22px;
      padding: 2px;
      background: linear-gradient(180deg, rgba(255,255,255,.78), rgba(245,205,120,.52), rgba(140,90,18,.34));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.88;
    }

    .cta-text{
      flex:1 1 auto;
      min-width:0;
      padding-right:10px;
    }

    .cta-gem{
      position:absolute;
      top:50%;
      width:16px; height:16px;
      transform: translateY(-50%) rotate(45deg);
      border-radius: 4px;
      opacity:.90;
      pointer-events:none;

      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), transparent 48%),
        linear-gradient(180deg, rgba(120, 230, 255, .92), rgba(40, 150, 210, .92));
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: 0 10px 16px rgba(0,0,0,.18);
    }
    .cta-gem.left{ display:none; }
    .cta-gem.right{ right: 14px; }

    .hud-cta:hover{
      transform: translateY(-1px);
      filter:saturate(1.04);
      box-shadow: 0 24px 46px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.60);
    }
    .hud-cta:active{ transform: translateY(0px) scale(.992); }

    .hud-cta .heart{
      width:44px;
      height:44px;
      border-radius: 14px;
      display:grid;
      place-items:center;

      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.70), rgba(255,255,255,.35) 55%, rgba(255,255,255,.18));
      border:1px solid rgba(255,255,255,.55);
      box-shadow:
        0 10px 18px rgba(0,0,0,.14),
        inset 0 1px 0 rgba(255,255,255,.70);

      flex:0 0 auto;
      position:relative;
      z-index:2;
      margin-left: 2px;
    }
    .hud-cta .heart svg{
      width:20px; height:20px;
      stroke: rgba(70,55,28,.92);
      fill:none;
      stroke-width:2.6;
      stroke-linecap:round;
      stroke-linejoin:round;
      filter: drop-shadow(0 1px 0 rgba(255,255,255,.35));
    }

    /* =============== COLLAPSE =============== */
    .side-nav.is-collapsed .side-nav__panel{
      transform: translateX(calc(-100% - 18px));
      opacity:0;
      pointer-events:none;
      filter: blur(1px);
      transition: transform .22s ease, opacity .22s ease, filter .22s ease;
    }
    .side-nav__panel{ transition: transform .22s ease, opacity .22s ease, filter .22s ease; }

    /* =============== NIGHT =============== */
    .hud--night{
      --gA: rgba(18, 55, 70, .62);
      --gB: rgba(8, 30, 40, .54);
      --iA: rgba(255,255,255,.12);
      --iB: rgba(0,0,0,.10);
    }

    @media (max-width: 520px){
      .hud-title{ -webkit-line-clamp: 2; }
      .hud-sub{ -webkit-line-clamp: 1; }
      .hud-pill{ min-width: 86px; }
      .hud-ico{ margin-left: 18px; }
    }

    /* =========================================================
       ✅ HEADER: СКРОЛЛ ВНУТРИ .header + СТАРТ СНИЗУ
    ========================================================= */

    /* ✅ FIX: делаем .header скролл-контейнером ровно в экран */
    .header{
      position:relative;
      width:100%;
      height:100vh;             /* было min-height:100svh */
      max-height:100vh;
      background:#ddeeff;

      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;

      isolation:isolate;
    }

    .header__bg-blur{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position: 50% 100%; /* ✅ низ */
      filter: blur(22px) saturate(1.15);
      transform: scale(1.12);
      z-index:0;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
      will-change: transform;
    }

    .header__bg{
      position:relative;
      display:block;
      width:100vw;
      height:auto;
      z-index:1;
      margin:0 auto;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
      image-rendering: auto;
      -ms-interpolation-mode: bicubic;
    }

    :root[style*="--hero-mode: 2"] .header{
      overflow:hidden;
    }
    :root[style*="--hero-mode: 2"] .header__bg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position: 50% 100%; /* ✅ низ */
    }

    .header::after{
      content:"";
      position:fixed;
      inset:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.06), rgba(0,0,0,0.22)),
        linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.02) 35%, rgba(0,0,0,0.10));
      z-index:2;
      pointer-events:none;
    }

    /* ===================== MATRIX GLOBAL (FULL SITE) ===================== */
    .matrix-wrap{
      position:fixed;
      inset:0;
      z-index:9997;
      pointer-events:none;
      opacity:0;
      transition: opacity 1.25s ease;
      background: rgba(0,0,0,.26);
      mix-blend-mode: normal;
    }
    .matrix-wrap.is-on{ opacity:1; }
    .matrix-wrap.is-off{ opacity:0; }

    .matrix{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      pointer-events:none;

      opacity:.92;
      mix-blend-mode: screen;
      filter: blur(.35px) saturate(1.25) contrast(1.06);
    }

    .intro{
      position:fixed;
      inset:0;
      z-index:9998;
      pointer-events:none;
      background:
        radial-gradient(120% 120% at 50% 20%, rgba(110,255,210,.10), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,.65), rgba(0,0,0,.35));
      opacity:0;
      transform: translateZ(0);
    }
    .intro.is-on{
      opacity:1;
      animation: introFade 1.35s ease forwards;
    }

    .intro::before{
      content:"";
      position:absolute;
      left:-20%;
      top:-30%;
      width:140%;
      height:30%;
      background: linear-gradient(90deg, transparent, rgba(110,255,210,.16), transparent);
      transform: rotate(12deg) translateY(-120%);
      filter: blur(1px);
      opacity:.9;
      animation: scan 1.35s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .intro::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px),
        radial-gradient(circle at 20% 30%, rgba(110,255,210,.12), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(110,255,210,.08), transparent 55%);
      opacity:.22;
      mix-blend-mode: overlay;
      animation: glitch 1.35s steps(18) forwards;
    }

    @keyframes introFade{
      0%{ opacity:1; }
      75%{ opacity:1; }
      100%{ opacity:0; }
    }
    @keyframes scan{
      0%{ transform: rotate(12deg) translateY(-140%); }
      75%{ transform: rotate(12deg) translateY(120%); }
      100%{ transform: rotate(12deg) translateY(170%); }
    }
    @keyframes glitch{
      0%{ transform: translateX(0); filter:none; }
      20%{ transform: translateX(-1px); filter: contrast(1.08); }
      40%{ transform: translateX(1px); filter: hue-rotate(8deg); }
      60%{ transform: translateX(-1px); filter: contrast(1.04); }
      80%{ transform: translateX(1px); filter: hue-rotate(-6deg); }
      100%{ transform: translateX(0); filter:none; }
    }

    .page-transition{
      position:fixed;
      inset:0;
      z-index:9999;
      pointer-events:none;
      opacity:0;
      background:
        radial-gradient(120% 120% at 50% 25%, rgba(110,255,210,.10), transparent 62%),
        linear-gradient(180deg, rgba(0,0,0,.82), rgba(0,0,0,.55));
      transform: translateZ(0);
    }
    .page-transition.is-leaving{
      opacity:1;
      animation: ptIn .52s ease forwards;
    }
    .page-transition.is-entering{
      opacity:1;
      animation: ptOut .46s ease forwards;
    }

    .page-transition .wipe{
      position:absolute;
      inset:-10%;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(110,255,210,.0) 0 18px,
          rgba(110,255,210,.06) 18px 20px,
          rgba(110,255,210,.0) 20px 36px
        ),
        radial-gradient(circle at 50% 50%, rgba(110,255,210,.12), transparent 62%);
      mix-blend-mode: screen;
      filter: blur(.3px);
      transform: translateX(-120%);
      opacity:.95;
    }
    .page-transition.is-leaving .wipe{ animation: wipeIn .52s cubic-bezier(.2,.8,.2,1) forwards; }
    .page-transition.is-entering .wipe{ animation: wipeOut .46s cubic-bezier(.2,.8,.2,1) forwards; }

    @keyframes ptIn{ 0%{ opacity:0; } 25%{ opacity:1; } 100%{ opacity:1; } }
    @keyframes ptOut{ 0%{ opacity:1; } 100%{ opacity:0; } }
    @keyframes wipeIn{ 0%{ transform: translateX(-120%); } 100%{ transform: translateX(120%); } }
    @keyframes wipeOut{ 0%{ transform: translateX(120%); } 100%{ transform: translateX(220%); } }

    /* ===================== ✅ LOGIN PORTAL (VARIANT 2) ===================== */
    .login-overlay{
      position:fixed;
      inset:0;
      z-index:10020; /* выше меню/матрицы, ниже page-transition (9999 уже ниже, поэтому ставим выше 1000 и ниже 9999? -> page-transition 9999, тут 10020, значит портал будет выше перехода. Если хочешь наоборот — поставь 9996 */
      display:grid;
      place-items:center;
      padding: 18px;
      background:
        radial-gradient(120% 120% at 50% 20%, rgba(80,175,255,.10), transparent 62%),
        radial-gradient(110% 110% at 50% 80%, rgba(255,220,120,.10), transparent 60%),
        rgba(0,0,0,.22);

      opacity:0;
      pointer-events:none;
      transition: opacity .55s ease;
    }
    .login-overlay.is-open{
      opacity:1;
      pointer-events:auto;
    }

    .login-portal{
      width: min(720px, calc(100vw - 36px));
      border-radius: 28px;
      position:relative;
      overflow:hidden;

      background:
        radial-gradient(120% 120% at 20% 12%, rgba(255,255,255,.18), transparent 62%),
        radial-gradient(110% 90% at 82% 14%, rgba(120,200,255,.14), transparent 60%),
        linear-gradient(180deg, rgba(40,120,170,.28), rgba(10,55,80,.22));

      backdrop-filter: blur(18px) saturate(1.18);
      -webkit-backdrop-filter: blur(18px) saturate(1.18);

      box-shadow:
        0 30px 70px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.18);
      transform: translateY(10px) scale(.985);
      opacity:0;
      transition: transform .6s ease, opacity .6s ease;
    }
    .login-overlay.is-open .login-portal{
      transform: translateY(0) scale(1);
      opacity:1;
    }

    /* светящаяся рамка */
    .login-portal::before{
      content:"";
      position:absolute; inset:0;
      border-radius: 28px;
      padding: 2px;
      background:
        linear-gradient(180deg,
          rgba(200,240,255,.85),
          rgba(120,200,255,.35) 40%,
          rgba(255,230,160,.35) 75%,
          rgba(255,210,120,.55)
        );
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      opacity:.95;
      filter: drop-shadow(0 0 10px rgba(120,200,255,.25));
    }

    /* снежинки/пыль в портале */
    .login-spark{
      position:absolute;
      inset:-40px;
      pointer-events:none;
      opacity:.75;
      background:
        radial-gradient(circle at 18% 24%, rgba(255,255,255,.85) 0 1.5px, transparent 3px),
        radial-gradient(circle at 82% 18%, rgba(200,240,255,.85) 0 2px, transparent 4px),
        radial-gradient(circle at 72% 62%, rgba(255,230,160,.75) 0 1.5px, transparent 3px),
        radial-gradient(circle at 28% 78%, rgba(255,255,255,.55) 0 2px, transparent 4px);
      filter: blur(.2px);
      mix-blend-mode: screen;
      animation: loginFloat 5s ease-in-out infinite;
    }
    @keyframes loginFloat{
      0%,100%{ transform: translateY(0px); opacity:.70; }
      50%{ transform: translateY(-6px); opacity:.86; }
    }

    .login-inner{
      position:relative;
      z-index:2;
      padding: clamp(18px, 3.6vw, 30px);
      display:grid;
      gap: 14px;
      text-align:center;
      color: rgba(250,244,232,.96);
      text-shadow: 0 1px 0 rgba(0,0,0,.18);
    }

    .login-title{
      font-size: clamp(26px, 4.8vw, 44px);
      letter-spacing:.02em;
    }
    .login-sub{
      font-size: clamp(14px, 2.5vw, 18px);
      color: rgba(245,235,210,.85);
      margin-top:-6px;
    }

    .login-form{
      margin-top: 4px;
      display:grid;
      gap: 12px;
      justify-items:stretch;
    }

    .login-field{
      position:relative;
      width: min(520px, 100%);
      margin: 0 auto;
    }

    .login-field input{
      width:100%;
      height: 56px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.20);
      outline:none;

      padding: 0 16px 0 52px;

      background: rgba(255,255,255,.12);
      color: rgba(255,255,255,.95);
      font-family:'Ruslan Display', cursive;
      font-size: 18px;
      letter-spacing:.02em;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.10),
        0 10px 22px rgba(0,0,0,.18);

      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .login-field input::placeholder{ color: rgba(255,255,255,.70); }
    .login-field input:focus{
      border-color: rgba(255,230,160,.35);
      background: rgba(255,255,255,.14);
      box-shadow:
        0 0 0 3px rgba(255,230,160,.12),
        inset 0 1px 0 rgba(255,255,255,.12),
        0 12px 26px rgba(0,0,0,.22);
    }

    .login-ico{
      position:absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      opacity:.90;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.25));
      pointer-events:none;
    }
    .login-ico svg{
      width:100%;
      height:100%;
      stroke: rgba(255,245,220,.95);
      fill:none;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .login-actions{
      display:flex;
      gap: 10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top: 2px;
    }

    .login-btn{
      width: min(520px, 100%);
      height: 58px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.28);
      cursor:pointer;

      font-family:'Ruslan Display', cursive;
      font-size: 22px;
      letter-spacing:.03em;

      color: rgba(70,55,28,.95);
      background:
        radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.28), transparent 62%),
        linear-gradient(180deg, rgba(255,240,195,.98), rgba(245,206,120,.98));

      box-shadow:
        0 22px 40px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.60);

      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
      position:relative;
      overflow:hidden;
    }
    .login-btn:hover{
      transform: translateY(-1px);
      filter:saturate(1.05);
      box-shadow:
        0 28px 52px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.62);
    }
    .login-btn:active{ transform: translateY(0px) scale(.992); }

    .login-close{
      position:absolute;
      right: 14px;
      top: 14px;
      width: 44px;
      height: 44px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 10px 18px rgba(0,0,0,.18);
      cursor:pointer;
      display:grid;
      place-items:center;
      color: rgba(255,255,255,.92);
      font-size: 18px;
      transition: transform .16s ease, filter .16s ease;
      z-index:3;
    }
    .login-close:hover{ transform: translateY(-1px); filter:saturate(1.06); }
    .login-close:active{ transform: translateY(0px) scale(.985); }

    /* на мобиле чуть ниже, чтобы не закрывать верх */
    @media (max-width: 520px){
      .login-portal{ border-radius: 24px; }
      .login-field input{ height: 54px; font-size: 17px; }
      .login-btn{ height: 56px; font-size: 20px; }
    }
  </style>
</head>

<body>

  <!-- Matrix full-site overlay -->
  <div class="matrix-wrap" id="matrixWrap" aria-hidden="true">
    <canvas class="matrix" id="matrix" aria-hidden="true"></canvas>
  </div>

  <!-- Intro on load -->
  <div class="intro" id="intro" aria-hidden="true"></div>

  <!-- Page transition overlay -->
  <div class="page-transition" id="pt" aria-hidden="true">
    <div class="wipe"></div>
  </div>

  <!-- ✅ LOGIN OVERLAY (ПОРТАЛ) -->
  <div class="login-overlay" id="loginOverlay" aria-hidden="true">
    <div class="login-portal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <div class="login-spark" aria-hidden="true"></div>

      <button class="login-close" id="loginClose" type="button" aria-label="Закрыть">✕</button>

      <div class="login-inner">
        <div class="login-title" id="loginTitle">Вход в систему</div>
        <div class="login-sub">Добро пожаловать в цифровое будущее</div>

        <form class="login-form" id="loginForm" autocomplete="on">
          <label class="login-field">
            <span class="login-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input name="login" type="text" placeholder="Логин" required>
          </label>

          <label class="login-field">
            <span class="login-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <input name="password" type="password" placeholder="Пароль" required>
          </label>

          <div class="login-actions">
            <button class="login-btn" type="submit">Войти</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MENU -->
  <nav class="side-nav hud--day" aria-label="Навигация">
    <!-- ... твой код меню без изменений ... -->
  </nav>

  <!-- HEADER -->
  <div class="header" id="hero">
    <img class="header__bg-blur" src="header-bg-3840.jpg" alt="" aria-hidden="true" decoding="async">
    <img
      class="header__bg"
      src="header-bg-3840.jpg"
      alt=""
      loading="eager"
      decoding="async"
      draggable="false"
    >
  </div>

  <script>
    // =============== Intro (on load) ===============
    (function introAnim(){
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(reduce) return;
      const intro = document.getElementById('intro');
      if(!intro) return;
      requestAnimationFrame(() => intro.classList.add('is-on'));
      setTimeout(() => intro.remove(), 1650);
    })();

    /* =========================================================
       ✅ LOGIN PORTAL: появляется через 30 секунд
       - плавный fade/scale
       - закрытие по X, Esc, клику по фону
       - фокус на логин
       - не показывать повторно в текущей сессии (sessionStorage)
    ========================================================= */
    (function loginPortal(){
      const overlay = document.getElementById('loginOverlay');
      const closeBtn = document.getElementById('loginClose');
      const form = document.getElementById('loginForm');
      if(!overlay || !closeBtn || !form) return;

      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const KEY = 'dh_login_portal_shown';

      let openTimer = null;

      function open(){
        if(sessionStorage.getItem(KEY) === '1') return;

        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');

        // помним что показали (в рамках вкладки)
        sessionStorage.setItem(KEY, '1');

        // фокус на логин
        const loginInput = form.querySelector('input[name="login"]');
        if(loginInput) setTimeout(() => loginInput.focus({ preventScroll:true }), 60);
      }

      function close(){
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
      }

      // появление через 30 секунд на странице
      function schedule(){
        if(sessionStorage.getItem(KEY) === '1') return;
        if(reduce) return; // в reduce-motion не показываем авто-попап
        openTimer = setTimeout(open, 30000);
      }

      // закрытие: кнопка, Esc, клик по фону
      closeBtn.addEventListener('click', close);

      overlay.addEventListener('click', (e) => {
        if(e.target === overlay) close();
      });

      window.addEventListener('keydown', (e) => {
        if(e.key === 'Escape' && overlay.classList.contains('is-open')) close();
      });

      // сабмит: пока просто заглушка (подключишь реальную авторизацию)
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        // TODO: тут отправка на сервер/валидация
        close();
      });

      // если ушли со страницы / скрыли вкладку — таймер не обязан жить
      window.addEventListener('pagehide', () => {
        if(openTimer) clearTimeout(openTimer);
      });

      schedule();
    })();

    // ================= остальной твой JS ниже без изменений =================
    // (оставь весь твой код markActive / toggleMenu / nightHud / matrix / transitions / startAtBottom)
  </script>
</body>
</html>
