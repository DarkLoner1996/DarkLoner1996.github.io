<!DOCTYPE html>  
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="embl.ico" type="image/x-icon">
  <link rel="icon" href="embl.png" type="image/png">
  <link rel="icon" href="embl.webp" type="image/webp" sizes="72x72">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ТехноКрыльяРоссии</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%;
      height:100%;
      overflow-x:hidden;
      font-family:'Ruslan Display', cursive;
      background:#ddeeff;
    }

    /* ============================================================
       LEFT MINI NAV (стильно, легко, без эмблемы)
       - слева сверху
       - один ряд, без “таблеток” и круглых иконок
       - минимальный glass, чтобы не спорить с фоном
       - аккуратный active через подсветку и нижнюю линию
       - CTA "Поддержать" компактная
       ============================================================ */

    :root{
      --nav-bg: rgba(255,255,255,.72);
      --nav-bg2: rgba(255,255,255,.56);
      --nav-border: rgba(255,255,255,.55);
      --nav-shadow: rgba(12, 38, 80, .16);

      --text: rgba(20,45,80,.92);
      --muted: rgba(20,45,80,.72);

      --accent1: rgba(255,236,170,.95);
      --accent2: rgba(255,210,125,.92);
      --accentText: rgba(55,55,55,.95);

      --activeLine: rgba(255,200,90,.95);
    }

    .nav-left{
      position:fixed;
      top:22px;
      left:22px;
      z-index:1000;
      width: auto;
      max-width: calc(100% - 44px);
    }

    .nav-left__inner{
      display:flex;
      align-items:center;
      gap:14px;
      padding:10px 12px;
      border-radius:18px;

      background: linear-gradient(180deg, var(--nav-bg), var(--nav-bg2));
      border: 1px solid var(--nav-border);
      box-shadow: 0 14px 34px var(--nav-shadow), inset 0 1px 0 rgba(255,255,255,.8);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      overflow:hidden;
    }

    /* лёгкая “полоска света” сверху — очень мягко */
    .nav-left__inner::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background: linear-gradient(180deg, rgba(255,255,255,.55), transparent 60%);
      opacity:.35;
    }

    .nav-left__list{
      list-style:none;
      display:flex;
      align-items:center;
      gap:10px;
      margin:0;
      padding:0;
      flex-wrap:nowrap;
      white-space:nowrap;
    }

    .nav-left__list a{
      position:relative;
      display:inline-flex;
      align-items:center;
      gap:8px;

      padding:8px 10px;
      border-radius:12px;
      text-decoration:none;

      color: var(--muted);
      font-size:16px;
      letter-spacing:.2px;

      transition: background .18s ease, color .18s ease, transform .18s ease;
    }

    .nav-left__list a:hover{
      background: rgba(255,255,255,.55);
      color: var(--text);
      transform: translateY(-1px);
    }

    /* Активный пункт: тонкая линия + мягкая подложка */
    .nav-left__list a.is-active{
      color: var(--text);
      background: rgba(255,255,255,.66);
    }
    .nav-left__list a.is-active::after{
      content:"";
      position:absolute;
      left:10px;
      right:10px;
      bottom:5px;
      height:2px;
      border-radius:999px;
      background: linear-gradient(90deg, transparent, var(--activeLine), transparent);
      opacity:1;
    }

    /* маленькие минимал-иконки (не круги) */
    .mini-ico{
      font-size:16px;
      opacity:.9;
      transform: translateY(-.5px);
    }

    /* CTA справа */
    .nav-cta{
      flex:0 0 auto;
      display:inline-flex;
      align-items:center;
      gap:8px;

      padding:9px 12px;
      border-radius:14px;
      text-decoration:none;
      white-space:nowrap;

      background: linear-gradient(180deg, var(--accent1), var(--accent2));
      border: 1px solid rgba(255,255,255,.65);
      box-shadow: 0 12px 24px rgba(20,60,120,.12), inset 0 1px 0 rgba(255,255,255,.9);

      color: var(--accentText);
      font-size:15px;

      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    .nav-cta:hover{
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(20,60,120,.14), inset 0 1px 0 rgba(255,255,255,.92);
      filter:saturate(1.04);
    }

    .nav-cta .heart{
      width:22px;
      height:22px;
      border-radius:999px;
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(255,255,255,.7);
      display:grid;
      place-items:center;
      font-size:13px;
    }

    /* Мобилка: меню превращаем в горизонтальный скролл */
    @media (max-width: 820px){
      .nav-left{ top:14px; left:12px; max-width: calc(100% - 24px); }
      .nav-left__inner{
        gap:10px;
        padding:10px;
        border-radius:16px;
      }
      .nav-left__list{
        overflow:auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width:none;
        gap:8px;
      }
      .nav-left__list::-webkit-scrollbar{ display:none; }
      .nav-left__list a{ font-size:14px; padding:8px 10px; }
      .nav-cta{ font-size:14px; padding:9px 10px; }
    }

    @media (prefers-reduced-motion: reduce){
      .nav-left__list a, .nav-cta { transition:none; }
      .cloud-left, .cloud-right, .grass, .cube{ animation:none !important; }
    }

    /* ===== HEADER (твой) ===== */
    .header{
      position:relative;
      width:100%;
      height:100vh;
      min-height:100svh;
      min-height:100dvh;
      overflow:hidden;
      background:#ddeeff;
    }

    .header__bg-blur{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      filter: blur(22px) saturate(1.15);
      transform: scale(1.12);
      z-index:0;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .header__bg{
      position:absolute;
      left:50%;
      top:50%;
      width:100vw;
      height:auto;
      max-height:100vh;
      transform:translate(-50%, -50%);
      z-index:1;
      object-fit:unset;
      pointer-events:none;
      user-select:none;
    }

    .header::after {
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.05), rgba(0,0,0,0.18)),
        rgba(255,255,255,0.05);
      z-index:3;
      pointer-events:none;
    }

    /* ===== Clouds ===== */
    .cloud-left {
      position:absolute; top:0%; left:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      animation:flyLeftToRight 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    .cloud-right {
      position:absolute; top:3%; right:-250px;
      width:450px; height:320px;
      background:url('clouds.webp') no-repeat center/contain;
      transform:scaleX(-1);
      animation:flyRightToLeft 40s linear infinite;
      pointer-events:none; z-index:2;
    }
    @keyframes flyLeftToRight {
      0%,10%   { transform:translateX(0); }
      90%,100% { transform:translateX(calc(100vw + 250px)); }
    }
    @keyframes flyRightToLeft {
      0%,10%   { transform:translateX(0) scaleX(-1); }
      90%,100% { transform:translateX(calc(-100vw - 250px)) scaleX(-1); }
    }

    /* ===== Cubes ===== */
    .cube-container{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(40, minmax(0, 1fr));
      grid-template-rows:repeat(25, minmax(0, 1fr));
      z-index:2;
      pointer-events:none;
    }
    .cube{
      width:100%;
      height:100%;
      background:url('code.webp') no-repeat center/contain;
      opacity:0;
      animation:cubeReveal 1.5s ease forwards;
    }
    @keyframes cubeReveal {
      0%   { transform:translate(var(--tx),var(--ty)) scale(0.1); opacity:0; }
      50%  { transform:translate(0,0) scale(1); opacity:1; }
      100% { transform:translate(0,0) scale(1); opacity:0; }
    }

    /* ===== Grass ===== */
    .grass {
      position:absolute; bottom:0; left:0;
      width:200%; height:50px;
      background:url('grass.gif') repeat-x;
      background-size:contain;
      animation:slowGrass 60s ease-in-out infinite alternate;
      pointer-events:none; z-index:2;
    }
    @keyframes slowGrass {
      from { transform:translateX(0); }
      to   { transform:translateX(-25%); }
    }
  </style>
</head>

<body>

<!-- LEFT NAV -->
<nav class="nav-left" aria-label="Навигация">
  <div class="nav-left__inner">
    <ul class="nav-left__list">
      <li><a href="https://digitalhavenrussia.ru" class="is-active"><span class="mini-ico">🏠</span>Главная</a></li>
      <li><a href="https://digitalhavenrussia.ru/project.html"><span class="mini-ico">📘</span>О проекте</a></li>
      <li><a href="https://digitalhavenrussia.ru/security.html"><span class="mini-ico">🎬</span>Мультфильм</a></li>
      <li><a href="https://digitalhavenrussia.ru/map.html"><span class="mini-ico">🧭</span>Маршрут помощи</a></li>
    </ul>

    <a class="nav-cta" href="https://digitalhavenrussia.ru/project.html#help">
      <span class="heart" aria-hidden="true">❤</span>
      <span>Поддержать</span>
    </a>
  </div>
</nav>

  <div class="header">
    <img class="header__bg-blur" src="header-bg-3840.jpg" alt="" aria-hidden="true" decoding="async">
    <img class="header__bg" src="header-bg-3840.jpg" alt="" loading="eager" decoding="async">

    <div class="cloud-left"></div>
    <div class="cloud-right"></div>

    <div class="cube-container" id="cubes"></div>
    <div class="grass"></div>
  </div>

  <script>
    const container = document.getElementById('cubes');
    const cols = 40, rows = 25;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cube = document.createElement('div');
        cube.className = 'cube';
        cube.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
        cube.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
        cube.style.gridColumn = x + 1;
        cube.style.gridRow = y + 1;
        cube.style.animationDelay = (Math.random() * 0.8) + 's';
        container.appendChild(cube);
      }
    }

    // Активный пункт по URL
    (function markActive(){
      try{
        const path = location.pathname.replace(/\/+$/, '');
        const links = document.querySelectorAll('.nav-left__list a');

        links.forEach(a => a.classList.remove('is-active'));

        const rules = [
          { match: ['/', '/index.html'], hrefIncludes: 'digitalhavenrussia.ru' },
          { match: ['/project.html'], hrefIncludes: 'project.html' },
          { match: ['/security.html'], hrefIncludes: 'security.html' },
          { match: ['/map.html'], hrefIncludes: 'map.html' },
        ];

        const rule = rules.find(r => r.match.includes(path));
        if(!rule) return;

        const active = Array.from(links).find(a => a.getAttribute('href')?.includes(rule.hrefIncludes));
        if(active) active.classList.add('is-active');
      }catch(e){}
    })();
  </script>
</body>
</html>
